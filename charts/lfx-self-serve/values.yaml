replicaCount: 3

# strategy controls the Kubernetes rolling update behavior.
# maxSurge: "100%" spins up a full new replica set before terminating any old pods (zero disruption).
# maxUnavailable: 0 ensures the ready count never drops below the desired replica count.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "100%"
    maxUnavailable: 0

# terminationGracePeriodSeconds must exceed preStop.sleep + PM2 kill_timeout.
# IMPORTANT: preStop runs *inside* the grace period — the clock starts when the pod enters
# Terminating (before preStop executes), not after it finishes.
# Timing breakdown after pod enters Terminating:
#   10s  preStop sleep    — kube-proxy / Traefik endpoint removal propagation (inside grace period)
#   15s  LB drain sleep   — in-process wait (1.5× readyz periodSeconds) for LB to act on 503
#   25s  HTTP drain       — in-flight requests complete (httpServer.close 25s window)
#   15s  service drain    — NATS + Snowflake pool drain in parallel (budget-capped)
#    5s  margin
# Active time = 10s + 60s (PM2 kill_timeout) = 70s. 75s provides a 5s safety margin.
terminationGracePeriodSeconds: 75

# lifecycle hooks run inside the container before SIGTERM is sent.
# The preStop sleep gives kube-proxy / Traefik time to propagate endpoint removal
# so no new requests arrive on a pod that is about to be terminated.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]

# podDisruptionBudget configures a PodDisruptionBudget for the deployment.
# Only one of minAvailable or maxUnavailable may be set (not both).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

image:
  repository: ghcr.io/linuxfoundation/lfx-self-serve
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# External Secrets Operator configuration
# Manages secrets from external providers (AWS Secrets Manager, HashiCorp Vault, etc.)
# Requires the External Secrets Operator to be installed in the cluster
externalSecrets:
  # Enable ExternalSecrets integration
  # When enabled, a SecretStore and ExternalSecret will be created
  enabled: false

  # Provider configuration (required)
  # Defines which external secret provider to use and how to authenticate
  # Examples:
  #
  # AWS Secrets Manager:
  # provider:
  #   aws:
  #     service: SecretsManager
  #     region: us-east-1
  #     auth:
  #       jwt:
  #         serviceAccountRef:
  #           name: lfx-self-serve-sa
  provider: {}

  # Annotations to add to ExternalSecret resources
  annotations: {}

  # SecretStore-specific configuration
  secretStore:
    # Annotations specific to the SecretStore resource
    annotations: {}
    # Name of the SecretStore resource
    # Defaults to the fullname template if not specified
    name: ""

  # Name of the ExternalSecret resource
  # Defaults to the fullname template if not specified
  name: ""

  # How frequently the secret should be refreshed from the external provider
  # Format: 10s, 1m, 1h, etc. (default: 10m)
  refreshInterval: "10m"

  # Target Kubernetes Secret configuration
  target:
    # Name of the Secret that will be created/managed (required)
    name: ""

    # Creation policy for the target Secret
    # - Owner: ExternalSecret owns the Secret, deletion of ExternalSecret deletes the Secret
    # - Orphan: Secret won't be deleted when ExternalSecret is deleted
    # - Merge: Merge with existing Secret if it exists
    # - None: Don't create or update the Secret
    creationPolicy: "Owner"

    # Template for generating the Secret content
    # Allows transformation of secret data before creating the Kubernetes Secret
    # Example:
    #   template:
    #     engineVersion: v2
    #     data:
    #       config.json: |
    #         {
    #           "apiKey": "{{ .apiKey }}",
    #           "secretKey": "{{ .secretKey }}"
    #         }
    template: {}

  # Fetch multiple secrets using queries (required)
  # Example:
  #   dataFrom:
  #     - find:
  #         tags:
  #           service: "lfx-self-serve"
  #       rewrite:
  #         - merge: {}
  dataFrom:
    - find:
        tags:
          service: pcc
      rewrite:
        - merge: {}
    - find:
        tags:
          service-pcc: enabled
      rewrite:
        - merge: {}

# Global annotations to add to all resources
annotations: {}

# Global labels to add to all resources
labels: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Pod scheduling. All default to empty and render nothing when unset.
# nodeSelector + tolerations are the pair needed to target a tainted node pool.
nodeSelector: {}
tolerations: []
affinity: {}
# priorityClassName affects preemption order. Leave empty unless the cluster
# defines priority classes; a nonexistent class blocks scheduling entirely.
priorityClassName: ""

# Spread replicas across failure domains. Consumed by the deployment template;
# previously undeclared here.
topologySpreadConstraints: []

service:
  type: ClusterIP
  port: 80
  targetPort: 4000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

# Startup probe — gates liveness and readiness during the initial startup window.
# Once it succeeds, Kubernetes hands off to livenessProbe and readinessProbe.
# Budget: 10s initial delay + (10s × 30 failures) = 310s (~5 min) maximum,
# giving headroom over the observed ~4 min cold-start time.
# Set to null to disable: startupProbe: null
startupProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# Liveness probe — restarts the pod if it becomes unresponsive at runtime.
# startupProbe handles the startup window, so initialDelaySeconds is 0 here.
# Targets GET /livez (plain text "OK"), registered before logging, auth, and
# rate-limit middleware so it is always reachable if the process is alive.
# Set to null to disable: livenessProbe: null
livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 0
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe — controls when the pod receives traffic from the Service.
# startupProbe handles the startup window, so initialDelaySeconds is 0 here.
# Targets GET /readyz (JSON {"status":"ready"}) which is registered before
# pino-http so probes don't pollute request logs. The endpoint confirms that
# Express is listening and the Angular SSR engine loaded; it intentionally
# does not probe lazy-initialized clients (NATS, Snowflake) because those
# report not-connected at startup even when most SSR pages render fine without
# them. See apps/lfx-one/src/server/server.ts for implementation details.
# Set to null to disable: readinessProbe: null
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Static ConfigMaps rendered by the chart and mounted as files into the container.
# Use for non-secret structured data that should not live in source (vendor IDs,
# allowlists, profile definitions, etc.). Each entry produces one ConfigMap named
# "<release-fullname>-<key>" and one volume + volumeMount.
#
# Constraints:
#   - Each map key must be a valid DNS-1123 label (lowercase, [a-z0-9-], <=63 chars).
#     The rendered name "<release-fullname>-<key>" must also stay <=253 chars.
#   - data values must be strings (use a YAML literal block scalar like '|' for
#     multi-line content). Nested maps/numbers/booleans will be rejected at
#     render time by the chart's `kindIs "string"` guard.
#
# Example:
#   staticConfigMaps:
#     linkedin-config:
#       mountPath: /etc/lfx-self-serve/linkedin
#       data:
#         linkedin.json: |
#           { "defaultAccountId": "...", "accounts": [...] }
#
# Application override: services that read from a static-config mount typically
# expose an env var to point at a different path during local dev. The
# lfx-one server reads the LinkedIn config from /etc/lfx-self-serve/linkedin/linkedin.json
# by default; set LINKEDIN_CONFIG_PATH to override (handy if you change `mountPath`
# above, or want to swap in a fixture for tests).
#
# Reload-on-change is handled in two layers:
#   1. The existing reloader.stakater.com/auto annotation (when Reloader is
#      installed in the cluster), and
#   2. A `checksum/staticConfigMaps` annotation on the Deployment pod template,
#      which forces a rolling restart whenever the rendered ConfigMap content
#      changes — even if Reloader isn't installed.
staticConfigMaps: {}

# Environment variables for the application
# Uses map/object format for deep merging support
environment:
  # Node.js environment
  NODE_ENV:
    value: production
  
  # Application configuration
  PORT:
    value: "4000"
  
  # Cache and temporary directories
  COREPACK_HOME:
    value: "/home/appuser/.cache/node/corepack"
  XDG_CACHE_HOME:
    value: "/home/appuser/.cache"
  TMPDIR:
    value: "/tmp"
  
  # PCC specific configuration
  PCC_BASE_URL:
    value: "https://pcc.k8s.orb.local"
  
  # Auth0 configuration (non-secret values)
  PCC_AUTH0_ISSUER_BASE_URL:
    value: "https://linuxfoundation-dev.auth0.com/"
  PCC_AUTH0_AUDIENCE:
    value: "https://api-gw.dev.platform.linuxfoundation.org/"
  M2M_AUTH_ISSUER_BASE_URL:
    value: "https://linuxfoundation-dev.auth0.com/"
  M2M_AUTH_AUDIENCE:
    value: "https://api-gw.dev.platform.linuxfoundation.org/"

  # API Gateway — audience for the secondary silent access token and base URL for outbound API calls
  API_GW_AUDIENCE:
    value: "https://api-gw.dev.platform.linuxfoundation.org/"

  # Environment identifier
  ENV:
    value: "production"

  # Query service configuration
  QUERY_SERVICE_URL:
    value: "http://query-service.default.svc.cluster.local/query/resources"

  # Optional configuration with defaults
  LOG_LEVEL:
    value: "info"

  # required environment variable secrets

  PCC_AUTH0_CLIENT_ID:
    value:

  PCC_AUTH0_CLIENT_SECRET:
    value:

  PCC_AUTH0_SECRET:
    value:

  SUPABASE_URL:
    value:

  POSTGRES_API_KEY:
    value:

  M2M_AUTH_CLIENT_ID:
    value:

  M2M_AUTH_CLIENT_SECRET:
    value:

  LFX_V2_SERVICE:
    value:

  # `LFX_V2_CAMPAIGN_SERVICE` is deliberately NOT declared here, and neither are the sibling
  # `LFX_V2_MEMBER_SERVICE` / `LFX_V2_COMMITTEE_SERVICE`. Each one falls back in code to
  # `LFX_V2_SERVICE`, so leaving it unset routes campaign traffic through the gateway — and
  # the gateway is where the authorization lives. Heimdall and OpenFGA enforce
  # `campaign_manager` on the project in front of campaign-service; the service's own token
  # check is an authentication check, not a project-scoped authorization one, so a base URL
  # pointing straight at a service instance would let any caller holding a valid token act on
  # a project it has no grant for, by knowing a job id.
  #
  # Omitting them here is not the enforcement, though — `templates/deployment.yaml` emits every
  # entry in this map, so an override adds the variable without touching the chart. All three
  # are rejected at render time by `lfx-self-serve.environment.gatewayOnlyValidate`; a
  # deployment that genuinely needs a direct address drops one from that list in a reviewed
  # chart commit. None of this is needed for the cutover flag below, a separate variable.

  # Campaign-service cutover, one endpoint at a time (LFXV2-3070). Serves
  # GET /api/campaigns/jobs/:jobId from lfx-v2-campaign-service instead of the in-process job
  # map, which only answers correctly when the poll lands on the pod that started the job.
  #
  # ON for "true", "1", "yes" or "on", trimmed and case-insensitive. Everything else is OFF,
  # including empty, "0", "false", and any misspelling — so a rollback is this value alone:
  # no code change, no build, no image promotion. Note that "yes" and "on" DO enable it; this
  # is not a `== "true"` comparison, and setting one of them expecting to be ignored would
  # route production traffic. Default-deny is the deliberate half: `flase` is invisible in a
  # values.yaml diff, so an unrecognised value fails towards the path known to work.
  #
  # It is NOT a live switch. This is a container environment variable, so changing it edits the
  # pod template and takes effect only as pods are replaced; with the default replica count and
  # a RollingUpdate, flag-on and flag-off pods serve side by side for the length of the rollout.
  # The source is chosen by the job id's shape as well as by the flag: a `job_...` id is answered
  # from the in-process map on every pod, flag or no flag. That made an overlapping rollout safe
  # for THIS flag while no UUID job id could exist — but that premise expires the moment campaign
  # creation ships. CREATE below is still unset, so no UUID job id exists yet and the premise
  # holds today; it stops holding as soon as CREATE is enabled, and a pod with JOBS off would then
  # skip the id-shape check entirely and answer a terminal `not_found` for a campaign that is
  # running and SPENDING. JOBS must stay on, and on rollback it comes off LAST — turn CREATE off
  # first and let outstanding UUID jobs drain. Do not copy the
  # "rollback is one value" line onto a future flag whose two paths could both claim the same
  # request — that one needs a no-overlap rollout or a shared runtime configuration source.
  #
  # With this flag on, a poll for a UUID job id requires `?project=` and is refused with a 400
  # without it (campaign.controller.ts). The LFX One client always sends it; a direct API caller
  # may not.
  LFX_CUTOVER_CAMPAIGN_SERVICE_JOBS:
    value: "true"

  # Persist the generated campaign brief to campaign-service instead of holding it only in the
  # browser tab. Same accepted values and same default-deny as the flag above.
  #
  # This one has NO id-shape backstop. It is no longer write-only: the flag now also gates the
  # brief READ-BACK (`GET /api/campaigns/brief` and the Planning tab's restore offer), so the
  # earlier "nothing reads them yet" no longer holds and neither does the safety argument built
  # on it.
  #
  # What a mixed rollout actually costs, stated plainly. Requests are not sticky to a pod, so
  # during a RollingUpdate one user's lookup can land flag-on and their next save flag-off, or
  # the reverse:
  #
  #   - a lookup on a flag-off pod answers `off`, so a stored brief is not offered and the user
  #     regenerates. Their save then lands on a flag-on pod, finds the row, and is refused as
  #     `unowned-brief-exists` — a confusing but SAFE outcome; nothing is overwritten.
  #   - a restore on a flag-on pod followed by a save on a flag-off pod is a no-op save. The
  #     stored brief is untouched.
  #
  # Both directions are recoverable and neither loses stored content, which is why this is a
  # rollout caveat rather than a blocker. It is still worse than the write-only version, so:
  # prefer a no-overlap rollout (scale to one replica, or `maxSurge: 0` with `maxUnavailable: 1`)
  # when flipping this flag, and expect transient `unowned-brief-exists` refusals if you do not.
  #
  # Turning it off again leaves the saved briefs in place; they simply stop being offered.
  LFX_CUTOVER_CAMPAIGN_SERVICE_BRIEFS:
    value: "true"

  # Route campaign CREATION to lfx-v2-campaign-service instead of the per-platform Express
  # services. Same accepted values and same default-deny as the two flags above.
  #
  # Requires BOTH LFX_CUTOVER_CAMPAIGN_SERVICE_BRIEFS AND LFX_CUTOVER_CAMPAIGN_SERVICE_JOBS to be
  # on. createCampaigns gates on all three together — with either prerequisite off it reports
  # disabled and every create silently stays on the legacy path. Enabling CREATE alone, or
  # CREATE+BRIEFS without JOBS, does nothing at all.
  #
  # BRIEFS, because the create route is /projects/{slug}/briefs/{brief_id}/campaigns — there is no
  # create-without-a-brief path, so without it there is no brief id to create from.
  #
  # JOBS, because a campaign-service create returns a job the client must then POLL. Creating
  # through the new system while the poll route still assumes legacy `job_...` ids would strand
  # the job: it exists and is spending, and nothing can report on it.
  #
  # That id-shape distinction is what lets both eras of job id resolve during an overlapping
  # rollout: campaign-service mints UUID job ids and the legacy path mints `job_...`, so a poll is
  # answered by whichever system owns that job.
  #
  # It is NOT unconditionally safe, and the ORDER is the whole of the safety. The check only runs
  # on a pod that has JOBS on. If the cutover flags flip in one RollingUpdate, a flag-on pod mints a
  # UUID job while a not-yet-updated pod routes that UUID to its in-process map and answers
  # terminal `not_found` — a campaign that is running and spending, reported as lost.
  #
  #   Enable:   JOBS -> confirm every pod has it -> BRIEFS -> STATUS_TOGGLE -> CREATE
  #   Roll back: CREATE off first -> let outstanding UUID jobs drain -> then JOBS
  #
  # OPERATIONAL PRECONDITION: campaign-service reads ad-platform credentials from its OWN
  # connection tables, never from this application's GADS_ / LINKEDIN_ environment variables.
  # Those values do not reach it.
  #
  # There IS a system-account fallback, but do not plan around it. `credsSource.resolve` falls back
  # to the reserved system scope when a project has NO connection of its own — so a dispatch can
  # succeed on the LF-owned ad account. Three limits:
  #
  #   - Only a genuine absence falls back. An unusable or undecryptable project row fails instead,
  #     because running that project's campaign on the LF account would spend LF money on a
  #     request the project believed was its own.
  #   - HubSpot is excluded by design: falling back there would write one tenant's contacts into
  #     the LF's own portal.
  #   - The spend lands on the LF account, which is right for LF campaigns and wrong for a
  #     foundation's own.
  #
  # So provision the connection for each project slug before turning this on, with
  # `POST /projects/{slug}/connection-{provider}` (singleton per provider — a second POST 409s).
  # Where neither a project row nor the fallback applies, the failure surfaces per-campaign rather
  # than at startup, so nothing warns you at deploy time.
  # Order: enable this ONLY after LFX_CUTOVER_CAMPAIGN_SERVICE_STATUS_TOGGLE below has been on
  # and its rollout has fully converged. Turning both on in one rollout opens a window where a
  # new pod mints a UUID campaign while an old pod, still without the toggle flag, refuses that
  # campaign's pause/resume at campaign.controller.ts:1156. Requests are not sticky and this
  # chart runs replicaCount: 3 with maxSurge: "100%", so during the overlap pause — the primary
  # cost-control lever — can intermittently 400 on a campaign created moments earlier.
  # Sequencing costs one extra deploy and closes the window outright.
  LFX_CUTOVER_CAMPAIGN_SERVICE_CREATE:
    value:

  # Gates whether a Demand Gen Google campaign may be requested at all (LFXV2-3257).
  #
  # SEPARATE from the cutover flags above because it asks a different question: not "should
  # creates go through campaign-service?" but "does the DEPLOYED campaign-service understand
  # googleAdsConfig.channel?". That field ships with LFXV2-3257, and the two can be out of
  # step — the create cutover may be on against a service that predates it.
  #
  # Leaving it off is SAFE and is the default. Turning it on before campaign-service has the
  # channel field is not: Go's JSON decoder ignores unknown keys, so an older service DROPS
  # `channel` and builds its default SEARCH campaign instead — real budget, no keywords, and
  # by its own documentation it "can never serve". Nothing errors; the job reports success and
  # the wrong campaign is found later in Google Ads with money already spent.
  #
  # Order: deploy campaign-service with LFXV2-3257, confirm it, THEN set this. Same accepted
  # values as the flags above.
  LFX_CUTOVER_CAMPAIGN_SERVICE_DEMAND_GEN:
    value:

  # Gates FGA-based (marketing_auditor / campaign_manager) authorization on the marketing
  # analytics routes (analytics.route.ts) and campaigns routes (campaigns.route.ts). Same
  # accepted values and same default-deny as the campaign-service flags above.
  #
  # OFF (the default) establishes an executive_director-only baseline. Analytics routes
  # already gated by LFXV2-3294 preserve their prior behavior exactly; campaigns routes
  # that previously had no authorization middleware are intentionally tightened to ED-only.
  # Deploying with the default value still tightens authorization for campaigns — every
  # non-ED caller that was previously admitted is now denied. ON
  # additionally admits a root-writer bypass plus a caller with an actual root- or
  # project-scoped marketing_auditor / campaign_manager FGA grant. LF Staff are NOT part of
  # what this flag adds: their bypass, where it exists at all, is wired per-endpoint
  # (`allowLfStaff` on the specific analytics routes shared with the Marketing Overview
  # widget — not on Campaigns) and fires regardless of this flag's state, on or off.
  #
  # Deliberately independent from the client-side OpenFeature flag (marketing-ops-fga-enabled):
  # the Web SDK never runs server-side, so without this a direct API caller with an FGA
  # marketing relation could not reach these routes even after the UI flag turns on the
  # corresponding client guards. Both must be enabled for the feature to actually work.
  #
  # OFF by default is a hard requirement, not a convenience default. The reverted PR #1112
  # caused a TOTAL LOCKOUT for all users when its UI guards shipped without a kill switch
  # (LFXV2-2231 gap-analysis G2). This flag exists so a bad rollout can be reverted with an
  # env var, not a revert PR — flip it back to unset/off and the ED-only baseline is
  # restored (analytics routes to their pre-PR state; campaigns to the new ED-only default
  # introduced by this PR, not the pre-PR open state), with no code path that can deny every user at once.
  #
  # It is NOT a live switch — same rollout caveat as every flag on this page: the chart
  # injects this as a container environment variable, so flipping it edits the Deployment pod
  # template and reaches a process only through a rolling restart. With the default replica
  # count and a RollingUpdate, flag-on and flag-off pods overlap for the duration. That overlap
  # is SAFE, not harmless: no caller can be locked out, but a caller who is ONLY an FGA
  # marketing_auditor / campaign_manager (no ED or root-writer persona, and not covered by an
  # `allowLfStaff` endpoint) will see a request succeed on a flag-on pod and 403 on a flag-off
  # pod purely depending on which pod answers — a real, if temporary, inconsistency, not a
  # no-op. ED/root-writer callers, and LF Staff on the endpoints that allow them, are
  # unaffected either way, since those checks are reachable regardless of this flag.
  #
  # Rollout ordering across this flag and the client-side marketing-ops-fga-enabled OpenFeature
  # flag (this order matters — the overlap above is safe but not consequence-free): set this flag
  # true and confirm the rolling update has fully converged (no pod still on the old pod template)
  # BEFORE enabling the client flag — otherwise the UI can advertise Campaigns/Analytics links
  # that a not-yet-converged pod still 403s on. To roll back, reverse it: disable the client flag
  # first, confirm it, then unset/disable this flag.
  LFX_MARKETING_OPS_FGA_ENABLED:
    value:

  # Serves PATCH /api/campaigns/:campaignId/status from campaign-service instead of the
  # per-platform SDK calls in campaign-proxy.service.ts (LFXV2-3226).
  #
  # This buys REACH, not just a different backend. The legacy path is a switch over meta-ads and
  # reddit-ads whose default arm throws, so pause is unavailable for every other platform. Turning
  # this on is what makes Google Ads and LinkedIn pausable at all — and pause is the primary
  # cost-control lever on a mis-targeted or overspending campaign.
  #
  # This IS user-visible now. The line that stood here said it enabled the server path only and
  # that nothing would change on screen — true when written, false since the UI half landed: the
  # Optimize tab propagates statusToggleEnabled and calls updateCampaignStatus, so operators get a
  # working pause control.
  #
  # Still inert for campaigns the LEGACY path created: pausing needs a campaign UUID, which only a
  # campaign-service create mints. The control appears for campaigns made after CREATE was
  # enabled, not retroactively.
  #
  # MISROUTING during overlap is impossible, unlike LFX_CUTOVER_CAMPAIGN_SERVICE_JOBS, whose
  # hazard looks identical and is not. Routing runs a campaign-id SHAPE check BEFORE and
  # INDEPENDENTLY of this flag, and the two id spaces are disjoint: campaign-service keys
  # campaigns by UUID, the legacy path by the ad platform's numeric id. No request can be claimed
  # by both paths, so a flag-on and a flag-off pod cannot disagree about where one belongs.
  #
  # That is a narrower claim than it first appears, and an earlier revision of this comment
  # overstated it as "rollout overlap is safe". Disjoint id spaces mean a flag-off pod handed a
  # UUID REFUSES rather than answering a confident falsehood — but a refusal is still a failure.
  # It returns 400 at campaign.controller.ts:1156, and a caller that cannot pause a spending
  # campaign is not much comforted that the error was well-formed. That is why CREATE above is
  # sequenced AFTER this flag: no UUID-keyed campaign exists to be refused until CREATE is on.
  #
  # Order: enable this FIRST, before LFX_CUTOVER_CAMPAIGN_SERVICE_CREATE. It is INERT until
  # CREATE has produced UUID-keyed campaigns — a campaign only has a UUID if campaign-service
  # created it — so switching it on early does nothing observable, which is exactly what makes it
  # the safe half to ship first. Enabling it AFTER CREATE is the ordering that costs something:
  # that is the overlap described above. Same accepted values as the flags above.
  LFX_CUTOVER_CAMPAIGN_SERVICE_STATUS_TOGGLE:
    value: "true"

  # Set to 'live' to proxy WG Weekly Brief endpoints to committee-service (LFXV2-2175/2176).
  # The BFF refuses to serve mock brief data when NODE_ENV=production and this
  # isn't 'live' — leaving it unset here would 500 on every weekly-brief request.
  WEEKLY_BRIEF_BACKEND:
    value: "live"

  NATS_URL:
    value:

  AI_PROXY_URL:
    value:

  AI_API_KEY:
    value:

  # Guild AI Integration — server-side credentials for the Marketing OS agents proxy.
  GUILD_API_URL:
    value: "https://app.guild.ai"

  GUILD_API_KEY:
    value:

  GUILD_WORKSPACE_OWNER:
    value:

  GUILD_WORKSPACE_NAME:
    value:

  # Transport for the Message Foundation batch intake payload. Default "false"
  # sends the BFF-rendered form text; set to "true" (no redeploy needed beyond
  # this value) once Guild delivers structured agent inputs verbatim.
  GUILD_STRUCTURED_AGENT_INPUT:
    value: "false"

  # Optional GitHub token for the server-side README fetch that grounds the
  # Message Foundation agent. Unauthenticated GitHub REST is capped at 60/hour
  # PER SOURCE IP, so a deployment behind one egress IP silently degrades to
  # README-less generations under load; any token with public-repo read access
  # raises the cap to 5,000/hour. Unset = unauthenticated (still functional).
  GITHUB_API_TOKEN:
    value:

  # Public Intercom Messenger workspace App ID. Identity verification rides on the
  # `http://lfx.dev/claims/intercom` Auth0 claim — not on this value.
  INTERCOM_APP_ID:
    value:

  # Invite JWT signing secret (HS256) — used to verify signed invite tokens.
  # Must match the INVITE_JWT_SECRET configured in lfx-v2-invite-service.
  # The value is used as raw UTF-8 bytes (not base64-decoded) to match how
  # the Go invite service derives the HMAC key ([]byte(secret)).
  INVITE_SERVICE_JWT_SECRET:
    value:

  # Snowflake Analytics Configuration
  # Required for analytics endpoints: active-weeks-streak, pull-requests-merged, code-commits
  SNOWFLAKE_ACCOUNT:
    value:

  SNOWFLAKE_USER:
    value:

  SNOWFLAKE_ROLE:
    value:

  SNOWFLAKE_DATABASE:
    value:

  SNOWFLAKE_WAREHOUSE:
    value:

  SNOWFLAKE_API_KEY:
    value:

  # Optional Snowflake configuration
  SNOWFLAKE_LOG_LEVEL:
    value: "ERROR"

  SNOWFLAKE_LOCK_STRATEGY:
    value: "memory"

  # Shared Valkey cache connection URL (rediss:// enables TLS in transit; credentials, if any,
  # are embedded in the URL). Unset disables caching (direct-fetch fallback).
  VALKEY_URL:
    value:

  # Optional per-deployment cache-key namespace (e.g. a feature-branch id) so deployments sharing one
  # Valkey instance never collide on cache keys. Unset in cluster-isolated environments.
  VALKEY_KEY_NAMESPACE:
    value:

  # Stores the OIDC session server-side in Valkey (keyed by an opaque session id) instead of the
  # encrypted appSession cookie, so cookie size stays flat as more tokens are added to the session.
  # Only takes effect when VALKEY_URL is also set. Toggling this value (in either direction) changes
  # what the appSession cookie means, which the chart's default 3-replica RollingUpdate cannot
  # interpret consistently mid-rollout — flip it only during a low-traffic window using a Recreate
  # (no-overlap) rollout strategy. Not an instant/safe-anytime rollback despite being a single value
  # flip — see Runtime Configuration docs.
  SESSION_STORE_ENABLED:
    value: "false"

  SNOWFLAKE_MIN_CONNECTIONS:
    value: "2"

  SNOWFLAKE_MAX_CONNECTIONS:
    value: "10"

  # Google Ads API Configuration (Campaign Management)
  GADS_DEVELOPER_TOKEN:
    value:

  GADS_CLIENT_ID:
    value:

  GADS_CLIENT_SECRET:
    value:

  GADS_REFRESH_TOKEN:
    value:

  GADS_LOGIN_CUSTOMER_ID:
    value:

  GADS_CUSTOMER_ID:
    value:

  # Campaign Brief Scrape — SSRF host allowlist (comma-separated)
  CAMPAIGN_BRIEF_SCRAPE_HOST_ALLOWLIST:
    value: "events.linuxfoundation.org,lfevents.linuxfoundation.org,www.linuxfoundation.org"

  # HubSpot Configuration (Campaign UTM Tracking)
  HUBSPOT_ACCESS_TOKEN:
    value:

  # Stripe publishable key
  STRIPE_PUBLISHABLE_KEY:
    value: