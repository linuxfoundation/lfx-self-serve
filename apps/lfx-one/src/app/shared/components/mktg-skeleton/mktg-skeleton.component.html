<div class="flex animate-pulse flex-col gap-3" aria-hidden="true" [attr.data-variant]="variant()">
  @if (variant() === 'run-page') {
    <div class="h-3 w-1/3 rounded bg-gray-100"></div>
  }
  @if (variant() !== 'rows') {
    <div class="h-5 w-2/3 rounded bg-gray-100"></div>
  }
  @if (variant() === 'header') {
    <div class="h-3 w-1/3 rounded bg-gray-100"></div>
  } @else {
    @for (row of rowIndices(); track row) {
      <div class="h-12 w-full rounded-lg bg-gray-100" data-testid="mktg-skeleton-row"></div>
    }
  }
</div>
