<lfx-card>
  <div class="flex flex-col items-center justify-center gap-2 py-8 text-center" role="alert" [attr.data-testid]="errorTestId()">
    <i class="fa-light fa-triangle-exclamation text-3xl text-amber-500" aria-hidden="true"></i>
    <h3 class="text-gray-700 font-medium">Couldn't load training stats</h3>
    <p class="text-sm text-gray-500">{{ message() }}</p>
    <lfx-button
      label="Retry"
      icon="fa-light fa-arrow-rotate-left"
      severity="secondary"
      size="small"
      (onClick)="retry.emit()"
      [attr.data-testid]="retryTestId()" />
  </div>
</lfx-card>
