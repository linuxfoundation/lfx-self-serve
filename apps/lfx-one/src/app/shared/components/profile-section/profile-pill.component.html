@if (href(); as link) {
  <a
    [href]="link"
    target="_blank"
    rel="noopener noreferrer"
    class="{{ pillClass }}"
    [lfxUiHoverCard]="hoverCard()"
    [lfxUiHoverCardWidth]="hoverCardWidth()"
    [attr.data-testid]="testId()"
    ><ng-container [ngTemplateOutlet]="body"
  /></a>
} @else {
  <!-- Focusable only when it opens a card, so the card reaches keyboard users. -->
  <div
    class="{{ pillClass }}"
    [attr.tabindex]="hoverCard() ? 0 : null"
    [lfxUiHoverCard]="hoverCard()"
    [lfxUiHoverCardWidth]="hoverCardWidth()"
    [attr.data-testid]="testId()">
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}

<!-- Exact [Npx] design values throughout: rem undershoots at the 14px root. -->
<ng-template #body>
  <span
    class="flex size-[48px] flex-none items-center justify-center overflow-hidden"
    [class.rounded-[12px]]="tile() === 'logo'"
    [class.shadow-[inset_0_0_0_1px_theme(colors.gray.200)]]="tile() === 'logo'"
    aria-hidden="true">
    @if (imageUrl()) {
      <img class="size-[48px] object-contain" [src]="imageUrl()" alt="" loading="lazy" />
    } @else {
      <span class="text-[16px] font-semibold text-gray-500">{{ initial() }}</span>
    }
  </span>
  <span class="flex min-w-0 flex-col gap-[4px]">
    <span class="truncate text-[13px] font-semibold leading-[18px] text-gray-900" [attr.data-testid]="testId() + '-name'">{{ name() }}</span>
    <span class="flex min-w-0 flex-row flex-wrap items-center gap-x-[8px] gap-y-[4px] text-[12px] leading-[16px] text-gray-500 empty:hidden"
      ><ng-content
    /></span>
  </span>
</ng-template>
