<div #recoveryHome class="contents">
  @if (recovery.needsReload()) {
    <!-- Outside overlays, clear their masks. Inside one, stay in flow within its trap;
       transformed dialog/drawer roots cannot safely contain a viewport-fixed banner. -->
    <section
      #recoveryPanel
      tabindex="-1"
      role="alert"
      aria-labelledby="chunk-load-recovery-heading"
      aria-atomic="true"
      [class.fixed]="!inOverlay()"
      [class.bottom-4]="!inOverlay()"
      [class.left-4]="!inOverlay()"
      [class.right-4]="!inOverlay()"
      [class.m-4]="inOverlay()"
      class="z-[11000] flex shrink-0 flex-col gap-3 rounded-lg border border-red-300 bg-white p-4 text-gray-900 shadow-lg sm:flex-row sm:items-center sm:justify-between"
      data-testid="chunk-load-recovery">
      <div class="flex flex-col gap-1">
        <h2 id="chunk-load-recovery-heading" class="font-semibold">Part of this page couldn't load.</h2>
        <p class="text-sm">Check your connection, then reload. Reloading may discard unsaved changes.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <lfx-ui-button [loading]="recovery.reloading()" (click)="recovery.reload()" data-testid="chunk-load-recovery-reload">Reload page</lfx-ui-button>
        <lfx-ui-button variant="secondary" lfxOpenIntercom data-testid="chunk-load-recovery-support">Contact support</lfx-ui-button>
      </div>
    </section>
  }
</div>
