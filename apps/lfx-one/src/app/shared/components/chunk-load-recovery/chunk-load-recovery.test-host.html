<input aria-label="Draft input" data-testid="unsaved-form" />
<textarea aria-label="Draft notes" data-testid="unsaved-textarea"></textarea>
<select aria-label="Draft selection" data-testid="unsaved-select">
  <option>Draft selection</option>
</select>
<div contenteditable="true" role="textbox" aria-label="Rich-text draft" tabindex="0" data-testid="unsaved-richtext">Draft text</div>
<button type="button" data-testid="existing-action">Existing action</button>
<lfx-chunk-load-recovery />
<p-drawer [(visible)]="drawerVisible" [modal]="true" [baseZIndex]="1000" appendTo="body" header="Draft drawer">
  <lfx-recovery-overlay-content />
</p-drawer>
<p-dialog [(visible)]="dialogVisible" [modal]="true" [baseZIndex]="2000" appendTo="body" header="Draft dialog">
  <lfx-recovery-overlay-content />
</p-dialog>
<ng-template #cdkDrawer>
  <lfx-ui-drawer heading="CDK draft drawer">
    <lfx-recovery-overlay-content />
    <ng-container drawerFooter><button type="button">Save draft</button></ng-container>
  </lfx-ui-drawer>
</ng-template>
