<div
  class="p-4"
  [ngClass]="{
    'rounded-lg border border-gray-200': !attached(),
    'bg-gray-50': comingSoon(),
  }"
  [attr.data-testid]="'feature-' + feature().key">
  <div class="flex items-center justify-between gap-3">
    <div class="flex min-w-0 items-start gap-3">
      <div
        class="w-10 h-10 rounded-lg text-center items-center justify-center flex"
        [ngClass]="{ 'grayscale opacity-50': comingSoon() }"
        [style.background-color]="feature().color + '15'"
        [style.color]="feature().color">
        <i [class]="feature().icon + ' text-lg'"></i>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 mb-1">
          <p class="text-sm font-semibold" [ngClass]="{ 'text-gray-900': !comingSoon(), 'text-gray-400': comingSoon() }">{{ feature().title }}</p>
          @if (comingSoon()) {
            <span class="px-2 py-0.5 bg-gray-200 text-gray-500 text-xs rounded">Coming Soon</span>
          } @else if (feature().recommended) {
            <span class="px-2 py-0.5 bg-blue-100 text-blue-500 text-xs rounded">Recommended</span>
          }
        </div>
        <p class="text-xs font-medium" [ngClass]="{ 'text-gray-500': !comingSoon(), 'text-gray-400': comingSoon() }">{{ feature().description }}</p>
      </div>
    </div>
    @if (!comingSoon()) {
      <div class="flex shrink-0 items-center gap-3">
        @if (toggleNote(); as note) {
          <span class="text-right text-xs italic text-gray-500" [attr.data-testid]="'feature-note-' + feature().key">{{ note }}</span>
        }
        <lfx-toggle
          [form]="form()"
          [control]="feature().key"
          [id]="feature().key"
          [trueValue]="feature().trueValue || true"
          [falseValue]="feature().falseValue || false"
          [ariaLabel]="toggleAriaLabel()"
          [attr.data-testid]="'toggle-' + feature().key">
        </lfx-toggle>
      </div>
    }
  </div>

  <!-- Nested content slot - parent controls visibility with @if -->
  @if (!comingSoon()) {
    <ng-content></ng-content>
  }
</div>
