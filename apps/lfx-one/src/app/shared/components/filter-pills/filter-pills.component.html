@if (variant() === 'segmented') {
  <!-- Joined control for mutually exclusive choices (e.g. Upcoming / Past), so it reads as one
       either/or choice rather than as independent toggles beside it. -->
  <div class="inline-flex items-stretch rounded-md border border-gray-300 overflow-hidden" role="group" [attr.aria-label]="ariaLabel() || null">
    @for (option of options(); track option.id; let first = $first) {
      <button
        type="button"
        (click)="handleFilterChange(option.id)"
        class="px-3 py-1 text-sm transition-colors"
        [class.border-l]="!first"
        [class.border-gray-300]="!first"
        [class]="selectedFilter() === option.id ? 'bg-blue-500 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
        [pTooltip]="option.fullLabel || ''"
        [tooltipDisabled]="!option.fullLabel || option.fullLabel === option.label"
        tooltipPosition="top"
        [attr.aria-label]="option.fullLabel || option.label"
        [attr.aria-pressed]="selectedFilter() === option.id"
        [attr.data-testid]="'filter-pill-' + option.id">
        {{ option.label }}
      </button>
    }
  </div>
} @else {
  <div class="flex flex-wrap items-center gap-2">
    @for (option of options(); track option.id) {
      <button
        type="button"
        (click)="handleFilterChange(option.id)"
        [class]="
          selectedFilter() === option.id
            ? 'px-3 py-1 rounded-full text-sm transition-colors bg-blue-500 text-white'
            : 'px-3 py-1 rounded-full text-sm transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200'
        "
        [pTooltip]="option.fullLabel || ''"
        [tooltipDisabled]="!option.fullLabel || option.fullLabel === option.label"
        tooltipPosition="top"
        [attr.aria-label]="option.fullLabel || option.label"
        [attr.aria-pressed]="selectedFilter() === option.id"
        [attr.data-testid]="'filter-pill-' + option.id">
        {{ option.label }}
      </button>
    }
  </div>
}
