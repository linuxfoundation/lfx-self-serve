@if (variant() === 'segmented') {
  <!-- Joined control for mutually exclusive choices (e.g. Upcoming / Past), so it reads as one
       either/or choice rather than as independent toggles beside it. -->
  <div class="inline-flex items-stretch rounded-md border border-gray-300 overflow-hidden" role="group" [attr.aria-label]="ariaLabel() || null">
    @for (option of options(); track option.id; let first = $first) {
      <button
        type="button"
        (click)="handleFilterChange(option.id)"
        class="px-3 py-1 text-sm transition-colors"
        [class.border-l]="!first"
        [class.border-gray-300]="!first"
        [class]="selectedFilter() === option.id ? 'bg-blue-500 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
        [pTooltip]="option.fullLabel || ''"
        [tooltipDisabled]="!option.fullLabel || option.fullLabel === option.label"
        tooltipPosition="top"
        [attr.aria-label]="option.ariaLabel || option.fullLabel || option.label"
        [attr.aria-pressed]="selectedFilter() === option.id"
        [attr.data-testid]="'filter-pill-' + option.id">
        {{ option.label }}
      </button>
    }
  </div>
} @else if (variant() === 'track') {
  <!-- One grey track with the selected option as a white chip. It scrolls rather than wraps on overflow, since a
       wrapped track reads as two broken controls. Pixel sizes are exact; the 14px root makes the rem scale undershoot. -->
  <div #track class="max-w-full overflow-x-auto" data-testid="filter-pills-track">
    <div class="inline-flex items-center gap-1 rounded-full bg-gray-100 p-1" role="group" [attr.aria-label]="ariaLabel() || null">
      @for (option of options(); track option.id) {
        <button
          type="button"
          (click)="handleFilterChange(option.id)"
          [class]="
            selectedFilter() === option.id
              ? 'h-[28px] whitespace-nowrap rounded-full bg-white px-[12px] text-[14px] font-medium text-gray-900 shadow-sm transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500'
              : 'h-[28px] whitespace-nowrap rounded-full px-[12px] text-[14px] text-gray-600 transition-colors hover:text-gray-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500'
          "
          [pTooltip]="option.fullLabel || ''"
          [tooltipDisabled]="!option.fullLabel || option.fullLabel === option.label"
          tooltipPosition="top"
          [attr.aria-label]="option.ariaLabel || option.fullLabel || option.label"
          [attr.aria-pressed]="selectedFilter() === option.id"
          [attr.data-testid]="'filter-pill-' + option.id">
          {{ option.label }}
        </button>
      }
    </div>
  </div>
} @else {
  <div class="flex flex-wrap items-center gap-2">
    @for (option of options(); track option.id) {
      <button
        type="button"
        (click)="handleFilterChange(option.id)"
        [class]="pillClasses()[option.id]"
        [pTooltip]="option.fullLabel || ''"
        [tooltipDisabled]="!option.fullLabel || option.fullLabel === option.label"
        tooltipPosition="top"
        [attr.aria-label]="option.ariaLabel || option.fullLabel || option.label"
        [attr.aria-pressed]="selectedFilter() === option.id"
        [attr.data-testid]="'filter-pill-' + option.id">
        {{ option.label }}
      </button>
    }
  </div>
}
