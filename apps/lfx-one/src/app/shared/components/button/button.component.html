@if (href()) {
  <a
    pButton
    [type]="type()"
    [href]="href()"
    [target]="target()"
    [rel]="rel()"
    [label]="label()!"
    [severity]="severity()"
    [raised]="raised()"
    [rounded]="rounded()"
    [text]="text()"
    [plain]="plain()"
    [outlined]="outlined()"
    [size]="size()"
    [loading]="loading()"
    [ariaLabel]="ariaLabel()!"
    [tabindex]="tabindex()"
    [fluid]="fluid()"
    [icon]="icon()!"
    [pTooltip]="tooltip()"
    [tooltipPosition]="tooltipPosition()"
    [style]="style()"
    [ngClass]="styleClass()"
    (click)="handleClick($event)">
    <ng-content></ng-content>
  </a>
} @else if (routerLink()) {
  <!-- Real anchor so the link carries a href (a11y, middle-click) and RouterLink's click listener fires -->
  <!-- before any consumer stopPropagation on (onClick) can starve it on the p-button host. -->
  <!-- Null link while disabled/loading: RouterLink no-ops on a null urlTree and renders no href, -->
  <!-- mirroring the p-button branch's disabled behavior; aria-disabled keeps AT informed. -->
  <a
    pButton
    [type]="type()"
    [routerLink]="disabled() || loading() ? null : routerLink()"
    [class.p-disabled]="disabled() || loading()"
    [attr.aria-disabled]="disabled() || loading() ? true : null"
    [queryParams]="queryParams()"
    [target]="target()"
    [rel]="rel()"
    [label]="label()!"
    [severity]="severity()"
    [raised]="raised()"
    [rounded]="rounded()"
    [text]="text()"
    [plain]="plain()"
    [outlined]="outlined()"
    [size]="size()"
    [loading]="loading()"
    [ariaLabel]="ariaLabel()!"
    [attr.tabindex]="disabled() || loading() ? -1 : tabindex()"
    [fluid]="fluid()"
    [icon]="icon()!"
    [pTooltip]="tooltip()"
    [tooltipPosition]="tooltipPosition()"
    [style]="style()"
    [ngClass]="styleClass()"
    (click)="handleClick($event)">
    <ng-content></ng-content>
  </a>
} @else {
  <p-button
    [label]="label()"
    [icon]="icon()"
    [iconPos]="iconPos()"
    [severity]="severity()"
    [raised]="raised()"
    [rounded]="rounded()"
    [text]="text()"
    [plain]="plain()"
    [outlined]="outlined()"
    [size]="size()"
    [disabled]="disabled()"
    [loading]="loading()"
    [loadingIcon]="loadingIcon()"
    [styleClass]="styleClass()"
    [badge]="badge()"
    [badgeSeverity]="badgeSeverity()"
    [ariaLabel]="ariaLabel()"
    [pt]="ariaPt()"
    [tabindex]="tabindex()"
    [autofocus]="autofocus()"
    [type]="type()"
    [variant]="variant()"
    [fluid]="fluid()"
    [style]="style()"
    [pTooltip]="tooltip()"
    [tooltipPosition]="tooltipPosition()"
    (onClick)="handleClick($event)">
    <ng-content></ng-content>
  </p-button>
}
