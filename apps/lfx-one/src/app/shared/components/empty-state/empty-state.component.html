@if (variant() === 'compact') {
  <!-- Pixel sizes follow the Health Metrics design; the 14px root makes the rem scale undershoot them. -->
  <div class="flex min-h-[200px] flex-col items-center justify-center gap-[6px] px-[16px] py-[8px] text-center" data-testid="empty-state-compact">
    <span class="mb-[4px] flex h-[44px] w-[44px] items-center justify-center rounded-[12px] border border-gray-200 bg-white shadow-sm" aria-hidden="true">
      <i [class]="icon() + ' text-[18px] text-gray-600'"></i>
    </span>
    <h3 class="m-0 text-[14px] font-semibold text-gray-900">{{ title() }}</h3>
    @if (subtitle()) {
      <p class="m-0 max-w-[420px] text-pretty text-[13px] leading-[1.5] text-gray-500">{{ subtitle() }}</p>
    }
    <ng-container [ngTemplateOutlet]="projected" />
  </div>
} @else if (withCard()) {
  <lfx-card>
    <ng-container [ngTemplateOutlet]="content" />
  </lfx-card>
} @else {
  <ng-container [ngTemplateOutlet]="content" />
}

<ng-template #content>
  <div class="p-8 md:p-16">
    <div class="mx-auto text-center flex flex-col gap-4 items-center">
      <!-- Icon -->
      <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center">
        <i [class]="icon() + ' text-3xl text-gray-500'"></i>
      </div>

      <!-- Title -->
      <h3 class="text-lg font-semibold text-gray-900">{{ title() }}</h3>

      <!-- Subtitle -->
      @if (subtitle()) {
        <p class="text-sm text-gray-500">{{ subtitle() }}</p>
      }

      <ng-container [ngTemplateOutlet]="projected" />

      <!-- CTA -->
      @if (ctaLabel() && ctaRoute()) {
        <lfx-button [label]="ctaLabel()!" [icon]="ctaIcon()" severity="primary" [size]="ctaSize()" [routerLink]="ctaRoute()!"></lfx-button>
      } @else if (ctaLabel() && ctaHref()) {
        <lfx-button
          [label]="ctaLabel()!"
          [icon]="ctaIcon()"
          severity="primary"
          [size]="ctaSize()"
          [text]="ctaGhost()"
          [outlined]="!ctaGhost()"
          [href]="ctaHref()!"
          [target]="ctaTarget()"
          [rel]="resolvedRel()"></lfx-button>
      } @else if (ctaLabel()) {
        <lfx-button
          [label]="ctaLabel()!"
          [icon]="ctaIcon()"
          severity="primary"
          [size]="ctaSize()"
          [text]="ctaGhost()"
          [outlined]="!ctaGhost()"
          (onClick)="ctaClick.emit()"></lfx-button>
      }
    </div>
  </div>
</ng-template>

<!-- One projection slot that both layouts render, since Angular projects content into a single ng-content. -->
<ng-template #projected><ng-content /></ng-template>
