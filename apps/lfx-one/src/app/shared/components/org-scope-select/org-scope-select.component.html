<div class="flex flex-col gap-1">
  @if (unavailable()) {
    <lfx-select
      [form]="fallbackForm"
      control="orgScope"
      size="small"
      [options]="options()"
      styleClass="w-full"
      [ariaLabel]="label"
      [tooltip]="tooltip()"
      tooltipPosition="top"
      [dataTest]="dataTest()" />
    <p class="text-xs text-gray-500" role="status" [attr.data-testid]="dataTest() + '-unavailable'">{{ unavailableNote }}</p>
  } @else {
    <lfx-select
      [form]="form()"
      [control]="control()"
      size="small"
      [options]="options()"
      styleClass="w-full"
      [ariaLabel]="label"
      [tooltip]="tooltip()"
      tooltipPosition="top"
      [dataTest]="dataTest()" />
  }
</div>
