<button
  type="button"
  class="inline-flex items-center gap-1.5 whitespace-nowrap rounded text-sm font-medium text-gray-500 underline hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="controls()"
  [attr.data-testid]="dataTest()"
  (click)="toggle()">
  <i class="fa-light fa-sliders" aria-hidden="true"></i>
  {{ label() }}
</button>
