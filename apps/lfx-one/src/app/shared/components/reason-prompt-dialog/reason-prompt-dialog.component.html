<div class="flex flex-col gap-4" data-testid="reason-prompt-dialog">
  <p class="text-sm text-gray-600">{{ data.prompt }}</p>

  <lfx-textarea
    [form]="form"
    control="reason"
    [rows]="4"
    [placeholder]="data.placeholder"
    styleClass="w-full"
    [required]="true"
    dataTest="reason-prompt-dialog-textarea" />

  <div class="flex justify-end gap-2">
    <lfx-button label="Cancel" size="small" severity="secondary" (onClick)="onCancel()" data-testid="reason-prompt-dialog-cancel" />
    <lfx-button
      [label]="data.confirmLabel"
      size="small"
      [severity]="data.confirmSeverity ?? 'danger'"
      [disabled]="!canConfirm()"
      (onClick)="onConfirm()"
      data-testid="reason-prompt-dialog-confirm" />
  </div>
</div>
