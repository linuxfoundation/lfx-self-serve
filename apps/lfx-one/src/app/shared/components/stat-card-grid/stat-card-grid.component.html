<lfx-card styleClass="[&_.p-card-body]:p-0 [&_.p-card-content]:p-0">
  <div class="grid w-full grid-cols-1" [class]="gridColsClass() + ' ' + gridDividerClass()">
    @for (card of cards(); track card.label) {
      <ng-template #cellContent>
        <div class="flex items-center justify-center w-11 h-11 rounded-full flex-shrink-0" [class]="card.iconContainerClass">
          <i [class]="card.icon + ' text-xl'" aria-hidden="true"></i>
        </div>
        <div class="flex flex-col gap-0.5 min-w-0">
          @if (loading()) {
            <p class="text-xl font-medium text-gray-400">&mdash;</p>
          } @else {
            <p class="text-xl font-medium text-gray-900">{{ card.value }}</p>
          }
          <p class="text-sm font-normal text-gray-900">{{ card.label }}</p>
          @if (card.subLine && !loading()) {
            <p class="text-xs text-gray-400">{{ card.subLine }}</p>
          }
          @if (card.delta && !loading()) {
            <p
              class="flex items-center gap-1 text-xs font-medium"
              [class]="(card.delta.inverted ? invertedDeltaTextClass : deltaTextClass)[card.delta.direction]">
              <i [class]="deltaIcon[card.delta.direction]" aria-hidden="true"></i>
              {{ card.delta.label }}
            </p>
          }
        </div>
      </ng-template>
      @if (card.action; as action) {
        <button
          type="button"
          class="flex items-center gap-3 p-4 min-w-0 text-left transition-colors enabled:hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600 focus-visible:-outline-offset-2"
          [class.bg-blue-50]="card.selected"
          [disabled]="loading() || card.disabled"
          [attr.aria-pressed]="!!card.selected"
          [attr.data-testid]="'stat-card-' + action"
          (click)="actionClick.emit(action)">
          <ng-container [ngTemplateOutlet]="cellContent" />
        </button>
      } @else {
        <div class="flex items-center gap-3 p-4" [attr.data-testid]="'stat-card-' + card.label">
          <ng-container [ngTemplateOutlet]="cellContent" />
        </div>
      }
    }
  </div>
</lfx-card>
