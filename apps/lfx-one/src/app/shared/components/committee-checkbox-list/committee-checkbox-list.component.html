<div class="flex flex-col gap-3" [attr.data-testid]="testIdPrefix()">
  <!-- Label -->
  @if (label()) {
    <label class="text-sm font-medium text-gray-700">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <!-- Description -->
  @if (description()) {
    <p class="text-sm text-gray-500">{{ description() }}</p>
  }

  <!-- Dropdown panel: closes on outside click or Escape like every other multi-select -->
  <lfx-multi-select
    [form]="selectionForm"
    control="committeeIds"
    [options]="committeeOptions()"
    optionLabel="name"
    optionValue="id"
    placeholder="Select groups"
    display="chip"
    [ariaLabel]="label() || 'Select groups'"
    [filter]="true"
    [filterPlaceHolder]="searchPlaceholder()"
    [showToggleAll]="true"
    [loading]="committeesLoading()"
    [scrollHeight]="maxHeight()"
    emptyMessage="No groups available"
    emptyFilterMessage="No groups found"
    appendTo="body"
    class="w-full"
    [attr.data-testid]="testIdPrefix() + '-select'">
    <ng-template #item let-option>
      <div class="flex w-full min-w-0 items-center justify-between gap-2">
        <span class="truncate text-sm text-gray-900">{{ option.name }}</span>
        @if (option.memberCount !== undefined) {
          <span class="flex-shrink-0 text-xs text-gray-500">{{ option.memberCount }} participants</span>
        }
      </div>
    </ng-template>
  </lfx-multi-select>

  <!-- Selection Summary -->
  @if (selectedItems().length > 0) {
    <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg" [attr.data-testid]="testIdPrefix() + '-summary'">
      <p class="text-sm text-gray-900">
        This survey will go to <span class="font-semibold">{{ totalParticipants() }} participants</span> in {{ selectedGroupNames() }}.
      </p>
    </div>
  }
</div>
