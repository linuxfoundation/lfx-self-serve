<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" data-testid="document-update-form">
  @if (isRename) {
    <div>
      <label for="document-update-name" class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1"
        >Name <span class="text-red-500">*</span></label
      >
      <lfx-input-text
        size="small"
        [form]="form"
        control="name"
        inputId="document-update-name"
        [maxlength]="nameMaxLength"
        placeholder="Name"
        styleClass="w-full"
        dataTest="document-update-name"></lfx-input-text>
      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <p class="mt-1 text-xs text-red-600">Name is required</p>
      }
      @if (form.controls.name.hasError('maxlength')) {
        <p class="mt-1 text-xs text-red-600">Name must be {{ nameMaxLength }} characters or fewer</p>
      }
    </div>
  } @else {
    <div>
      <label for="document-update-folder" class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wide mb-1">Move to</label>
      <lfx-select
        size="small"
        [form]="form"
        control="parent_uid"
        inputId="document-update-folder"
        [options]="folderOptions"
        styleClass="w-full"
        data-testid="document-update-folder"></lfx-select>
    </div>
  }

  @if (errorMessage(); as message) {
    <p class="text-xs text-red-600" role="alert" data-testid="document-update-error">{{ message }}</p>
  }

  <div class="flex justify-end gap-3 pt-4 border-t">
    <lfx-button label="Cancel" severity="secondary" [outlined]="true" [disabled]="submitting()" (onClick)="onCancel()" size="small" type="button"></lfx-button>
    <lfx-button [label]="submitLabel" [loading]="submitting()" [disabled]="submitting() || form.invalid || unchanged()" type="submit" size="small"></lfx-button>
  </div>
</form>
