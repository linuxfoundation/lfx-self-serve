<div class="flex flex-col gap-3 sm:gap-4 min-w-0" data-testid="recording-modal-container">
  <!-- Meeting Title -->
  <div class="sm:mb-4 min-w-0">
    <h4 class="text-lg font-semibold text-gray-900 mb-1 break-words">{{ meetingTitle }}</h4>
    <p class="text-sm text-gray-600">Share this recording URL with others to view the meeting recording.</p>
  </div>

  <!-- Share URL Display -->
  <div class="bg-gray-50 rounded-lg p-3 sm:p-4 border border-gray-200 min-w-0" data-testid="share-url-container">
    <label class="block text-sm font-medium text-gray-700 mb-2">Recording Share URL</label>
    <div class="flex items-center gap-2 min-w-0">
      <div
        class="flex-1 min-w-0 px-3 py-2 text-sm border border-gray-300 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 overflow-x-auto whitespace-nowrap cursor-text select-all"
        data-testid="share-url-input">
        {{ shareUrl }}
      </div>
      <lfx-button
        label="Copy"
        icon="fa-light fa-copy"
        size="small"
        severity="secondary"
        class="shrink-0"
        data-testid="copy-url-button"
        (click)="copyShareUrl()"></lfx-button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex justify-between gap-2 sm:mt-6">
    <lfx-button
      label="View Recording"
      icon="fa-light fa-external-link"
      size="small"
      severity="info"
      data-testid="open-recording-button"
      [href]="shareUrl"
      target="_blank"
      rel="noopener noreferrer"></lfx-button>
    <lfx-button label="Close" size="small" severity="secondary" data-testid="close-button" (click)="onClose()"></lfx-button>
  </div>
</div>
