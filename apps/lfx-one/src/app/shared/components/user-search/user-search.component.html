<!-- [showClear] is AND-ed with !readonly() below: PrimeNG's clear icon is gated on [disabled] only,
     not [readonly] — so a readonly-but-not-disabled consumer (see formation-item-drawer's
     assignee field) would otherwise still be able to click X and blank the field despite readonly
     meaning "view only, nothing here should change". -->
<lfx-autocomplete
  [form]="userSearchForm"
  control="userSearch"
  [placeholder]="placeholder()"
  [suggestions]="suggestions()"
  [styleClass]="styleClass()"
  [inputStyleClass]="inputStyleClass()"
  [panelStyleClass]="panelStyleClass()"
  [dataTestId]="dataTestId()"
  [inputId]="inputId()"
  [describedBy]="describedBy()"
  [invalid]="invalid()"
  [showClear]="showClear() && !readonly()"
  [readonly]="readonly()"
  optionLabel="displayName"
  optionDisabled="disabled"
  size="small"
  appendTo="body"
  (completeMethod)="onSearchComplete($event)"
  (onSelect)="onUserSelected($event)"
  (onClear)="onSearchClear()"
  (onBlur)="onSearchBlur()">
  <ng-template #item let-user>
    <!-- optionDisabled only styles the row and marks it aria-disabled; a pick on it is refused in onUserSelected. -->
    <div class="w-full flex justify-between items-center gap-2" [class.cursor-not-allowed]="user.disabled">
      <div class="flex flex-col">
        <!-- A row with no name leads with its address instead of repeating it on the line below. -->
        <div class="text-sm flex gap-1 items-center">
          <span>{{ user.fullName || user.email }}</span>
          @if (user.organization?.name) {
            <span class="text-xs text-gray-500"> ({{ user.organization?.name }}) </span>
          }
        </div>
        @if (user.fullName) {
          <span class="text-xs text-gray-500">{{ user.email }}</span>
        }
        @if (user.note) {
          <span class="text-xs text-amber-700" [attr.data-testid]="dataTestId() + '-option-note'">{{ user.note }}</span>
        }
      </div>
    </div>
  </ng-template>
  <!-- Empty template -->
  <ng-template #empty>
    <div class="p-3 text-center">
      <p class="text-sm text-gray-600" [attr.data-testid]="dataTestId() + '-empty'">{{ emptyMessage() }}</p>
    </div>
  </ng-template>

  <!-- Footer template - shown unless the consumer sets showManualEntry to false -->
  @if (showManualEntry()) {
    <ng-template #footer>
      <div class="p-2 border-t border-gray-200 text-center">
        <button type="button" class="text-sm text-primary hover:underline" (click)="onEnterManually()">Enter details manually</button>
      </div>
    </ng-template>
  }
</lfx-autocomplete>
