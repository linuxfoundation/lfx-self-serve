<!-- Exact [Npx] design values throughout: rem undershoots at the 14px root. -->
<section
  class="flex min-w-0 flex-col gap-[16px] rounded-ui-md bg-ui-background-100 p-[24px] shadow-small"
  [attr.aria-labelledby]="headingId"
  [attr.data-testid]="testId()">
  <div class="flex flex-row items-start justify-between gap-[16px]">
    <div class="min-w-0">
      <div class="flex flex-row flex-wrap items-center gap-[8px]">
        <h2 class="m-0 text-[16px] font-semibold leading-[24px] text-ui-neutral-900" [id]="headingId" [attr.data-testid]="testId() + '-title'">
          {{ heading() }}
        </h2>
        <ng-content select="[accountCardTitleSuffix]" />
      </div>
      @if (subtitle()) {
        <p class="m-0 mt-[2px] text-pretty text-[12px] leading-[18px] text-ui-neutral-500" [attr.data-testid]="testId() + '-subtitle'">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex flex-none flex-row items-center gap-[8px] empty:hidden"><ng-content select="[accountCardActions]" /></div>
  </div>
  <ng-content />
</section>
