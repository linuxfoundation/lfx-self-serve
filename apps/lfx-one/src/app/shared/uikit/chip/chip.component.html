<lfx-ui-badge class="max-w-full min-w-0" [tone]="tone()" [variant]="variant()" [size]="size()">
  <ng-content select="[slot=icon]" />
  <span
    #labelElement
    class="min-w-0 truncate focus-visible:shadow-focus focus-visible:outline-none forced-colors:focus-visible:outline forced-colors:focus-visible:outline-2 forced-colors:focus-visible:outline-[color:Highlight]"
    [attr.tabindex]="truncated() ? 0 : null"
    [lfxUiTooltip]="label()"
    [lfxUiTooltipDisabled]="tooltipOff()"
    data-testid="ui-chip-label"
    >{{ label() }}</span
  >
  @if (dismissible()) {
    <button
      type="button"
      [class]="dismissClasses()"
      [attr.aria-label]="removeLabel()"
      (click)="onDismiss($event)"
      (keydown)="onKeydown($event)"
      (mousedown)="onMouseDown($event)"
      (focus)="onFocus()"
      (blur)="onBlur($event)"
      #dismissButton
      data-testid="ui-chip-dismiss">
      <i class="fa-light fa-xmark" aria-hidden="true"></i>
    </button>
  }
</lfx-ui-badge>
