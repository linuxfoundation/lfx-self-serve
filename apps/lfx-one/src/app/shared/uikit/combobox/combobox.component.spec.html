@switch (mode()) {
  @case ('basic') {
    <lfx-ui-combobox
      label="Project"
      placeholder="Search projects"
      emptyText="No projects match"
      [ariaLabel]="ariaLabel()"
      [hint]="hint()"
      [error]="error()"
      [size]="size()"
      [disabled]="disabled()"
      [required]="required()"
      [(value)]="value">
      @for (option of options(); track option.value) {
        <lfx-ui-option [value]="option.value" [label]="option.label" [disabled]="!!option.disabled" />
      }
    </lfx-ui-combobox>
    <button type="button" data-testid="outside">Outside</button>
  }
  @case ('groups') {
    <lfx-ui-combobox ariaLabel="Project" [(value)]="value">
      <lfx-ui-option-group label="Cloud native">
        <lfx-ui-option value="k8s" label="Kubernetes" />
        <lfx-ui-option value="envoy" label="Envoy" />
      </lfx-ui-option-group>
      <lfx-ui-option-separator />
      <lfx-ui-option-group label="Security">
        <lfx-ui-option value="sigstore" label="Sigstore" />
      </lfx-ui-option-group>
      <lfx-ui-option value="rich" label="Rich row">
        <span data-testid="rich-row">Rich content row</span>
      </lfx-ui-option>
    </lfx-ui-combobox>
  }
  @case ('form') {
    <lfx-ui-combobox label="Project" [formControl]="control">
      @for (option of options(); track option.value) {
        <lfx-ui-option [value]="option.value" [label]="option.label" [disabled]="!!option.disabled" />
      }
    </lfx-ui-combobox>
  }
}
