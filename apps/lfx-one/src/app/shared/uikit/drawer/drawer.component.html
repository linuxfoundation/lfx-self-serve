<!-- Exact px, not rem; 14px root. Header, body and footer share a 24px gutter. -->
<!-- Narrow drawers put the actions on their own row under the title and close button; from 560px wide they sit between them. -->
@if (isBare()) {
  <!-- Bare: the title and subtitle still name and describe the dialog, for screen readers only. -->
  <h2 class="sr-only" [id]="titleId" data-testid="ui-drawer-title">{{ heading() }}</h2>
  @if (subtitle()) {
    <p class="sr-only" [id]="subtitleId" data-testid="ui-drawer-subtitle">{{ subtitle() }}</p>
  }
} @else {
  <div
    class="flex shrink-0 flex-wrap items-start gap-[12px] px-[24px] pb-[16px] pt-[20px] shadow-[inset_0_-1px_0_var(--ui-neutral-alpha-100)] forced-colors:border-b forced-colors:border-[color:CanvasText]"
    data-testid="ui-drawer-header">
    <div class="shrink-0 empty:hidden" data-testid="ui-drawer-leading">
      <ng-content select="[drawerLeading]" />
    </div>
    <div class="flex min-w-0 flex-1 flex-col gap-[4px]">
      <!-- Roboto Slab 300 20/28: heading-24 at the library's drawer size. -->
      <h2 class="heading-24 text-[20px] leading-[28px] text-ui-neutral-900" [id]="titleId" data-testid="ui-drawer-title">{{ heading() }}</h2>
      @if (subtitle()) {
        <p class="copy-13 text-ui-neutral-600" [id]="subtitleId" data-testid="ui-drawer-subtitle">{{ subtitle() }}</p>
      }
    </div>
    <div class="order-3 flex basis-full flex-wrap items-center gap-[8px] empty:hidden @[560px]:order-1 @[560px]:basis-auto">
      <ng-content select="[drawerActions]" />
    </div>
    <lfx-ui-button
      class="order-2"
      variant="tertiary"
      [iconOnly]="true"
      icon="fa-light fa-xmark"
      ariaLabel="Close"
      (click)="context.requestClose()"
      data-testid="ui-drawer-close" />
  </div>
}
<!-- cdkScrollable lets overlays opened from the body (Select, Menu) follow its scrolling. The scrollbar is hidden. -->
<div
  class="flex min-h-0 flex-1 flex-col overflow-y-auto copy-14 text-ui-neutral-900 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
  [class]="bodyClasses()"
  cdkScrollable
  data-testid="ui-drawer-body">
  <ng-content />
</div>
@if (!isBare()) {
  <!-- On a phone-width window the footer clears the home indicator: 16px padding plus the bottom inset. -->
  <div
    class="flex shrink-0 items-center justify-end gap-[12px] bg-ui-background-200 px-[24px] py-[16px] shadow-[inset_0_1px_0_var(--ui-neutral-alpha-200)] empty:hidden max-[640px]:pb-[calc(16px+env(safe-area-inset-bottom))] forced-colors:border-t forced-colors:border-[color:CanvasText]"
    [class]="footerClasses()"
    data-testid="ui-drawer-footer">
    <ng-content select="[drawerFooter]" />
  </div>
}
