<!-- Square off the main half's right corners and lift it above its neighbour on hover and focus, so its ring is not clipped. -->
<lfx-ui-button
  class="[&>button]:rounded-r-none [&>button:focus-visible]:z-10 [&>button:hover]:z-10"
  [variant]="variant()"
  [size]="size()"
  [icon]="icon()"
  [disabled]="disabled()"
  (click)="triggered.emit()"
  >{{ label() }}</lfx-ui-button
>
<button
  #chevron
  type="button"
  [class]="chevronClasses()"
  [disabled]="disabled()"
  [attr.aria-label]="chevronName()"
  [cdkMenuTriggerFor]="menu()"
  [cdkMenuPosition]="menuPositions()"
  data-testid="ui-split-button-chevron">
  @if (variant() === 'primary' && !disabled()) {
    <!-- 1px divider: the page background at 30% (no alpha utility for it). -->
    <span class="absolute inset-y-0 left-0 w-px bg-ui-background-100 opacity-30" aria-hidden="true" data-testid="ui-split-button-divider"></span>
  }
  <i class="fa-light fa-chevron-down" aria-hidden="true"></i>
</button>
