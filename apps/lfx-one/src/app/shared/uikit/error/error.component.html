<i [class]="iconClasses()" aria-hidden="true" data-testid="ui-error-icon"></i>
<span data-testid="ui-error-message">
  @if (label()) {
    <strong class="font-medium" data-testid="ui-error-label">{{ label() }}</strong
    >{{ ' ' }}
  }
  <ng-content />
</span>
