<!-- Exact px, not rem; 14px root: 8px gap between the label row and the track. -->
<div class="flex flex-col gap-[8px]">
  <div class="flex justify-between copy-13 tabular-nums text-ui-neutral-600">
    <label [for]="inputId" data-testid="ui-slider-label">{{ label() }}</label>
    <output [for]="inputId" [class.text-ui-neutral-900]="!isDisabled()" data-testid="ui-slider-value">{{ displayValue() }}</output>
  </div>
  <!-- shortcut: [value] is skipped when snapped() is unchanged, so changing min and step in one pass can leave the native value stale. revisit: if a consumer does that. -->
  <input
    type="range"
    class="ui-slider"
    [id]="inputId"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="snapped()"
    [disabled]="isDisabled()"
    [attr.aria-valuetext]="valueText() || null"
    [style.--val]="percent() + '%'"
    (input)="onInput($event)"
    (blur)="onBlur()"
    data-testid="ui-slider" />
</div>
