<label [class]="labelClasses()" data-testid="ui-toggle-label">
  @if (label() && labelPosition() === 'start') {
    <span data-testid="ui-toggle-text">{{ label() }}</span>
  }
  <input
    type="checkbox"
    role="switch"
    [class]="trackClasses()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.name]="name() || null"
    [attr.aria-label]="label() ? null : ariaLabel() || null"
    (change)="onChange($event)"
    (blur)="onBlur()"
    data-testid="ui-toggle-input" />
  @if (label() && labelPosition() === 'end') {
    <span data-testid="ui-toggle-text">{{ label() }}</span>
  }
</label>
