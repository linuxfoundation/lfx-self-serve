@if (showButtons()) {
  <button
    type="button"
    [class]="buttonClasses() + ' -left-[14px]'"
    [disabled]="!canScrollStart()"
    [attr.aria-label]="'Previous ' + label()"
    (click)="scrollByItem(-1)"
    data-testid="ui-scroller-prev">
    <i class="fa-light fa-chevron-left text-[16px] leading-none" aria-hidden="true"></i>
  </button>
}
<div
  #viewport
  [class]="viewportClasses()"
  [style.--fade-start.px]="fadeStart()"
  [style.--fade-end.px]="fadeEnd()"
  [style.max-height.px]="direction() === 'horizontal' ? null : maxHeight()"
  tabindex="0"
  role="region"
  [attr.aria-label]="label()"
  (scroll)="measure()"
  data-testid="ui-scroller-viewport">
  <ng-content />
</div>
@if (showButtons()) {
  <button
    type="button"
    [class]="buttonClasses() + ' -right-[14px]'"
    [disabled]="!canScrollEnd()"
    [attr.aria-label]="'Next ' + label()"
    (click)="scrollByItem(1)"
    data-testid="ui-scroller-next">
    <i class="fa-light fa-chevron-right text-[16px] leading-none" aria-hidden="true"></i>
  </button>
}
