<!-- Exact px, not rem; 14px root: 12px between the legend and the tiles. -->
<fieldset
  class="m-0 min-w-0 border-0 p-0"
  [attr.role]="isRadio() ? 'radiogroup' : null"
  [attr.aria-label]="label() ? null : ariaLabel() || null"
  (focusout)="onFocusOut($event)"
  data-testid="ui-choicebox-group-fieldset">
  @if (label()) {
    <legend class="label-13 mb-[12px] p-0 text-ui-neutral-600" data-testid="ui-choicebox-group-legend">{{ label() }}</legend>
  }
  <div [class]="gridClasses()">
    <ng-content />
  </div>
</fieldset>
