<ng-template #content>
  @if (loading()) {
    <lfx-ui-spinner tone="current" [size]="iconSize()" aria-hidden="true" data-testid="ui-button-spinner" />
  } @else if (icon()) {
    <i [class]="icon()" aria-hidden="true"></i>
  }
  <ng-content />
  @if (trailingIcon() && !iconOnly()) {
    <i [class]="trailingIcon()" aria-hidden="true" data-testid="ui-button-trailing-icon"></i>
  }
</ng-template>

@if (link() !== null) {
  <a
    [routerLink]="disabled() || loading() ? null : link()"
    [class]="classes()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-controls]="ariaControls() || null"
    [attr.role]="disabled() || loading() ? 'link' : null"
    [attr.aria-disabled]="disabled() || null"
    [attr.aria-busy]="loading() || null"
    [attr.tabindex]="linkTabIndex()"
    [lfxUiTooltip]="tooltip()"
    [lfxUiTooltipTitle]="tooltipTitle()"
    [lfxUiTooltipShortcut]="tooltipShortcut()"
    [lfxUiTooltipSide]="tooltipSide()"
    [lfxUiTooltipDelay]="tooltipDelay()"
    [lfxUiTooltipDisabled]="tooltipDisabled()"
    (click)="onClick($event)"
    data-testid="ui-button">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else if (menu(); as menuRef) {
  <!-- Own branch: the CDK trigger sets aria-expanded itself and swallows ArrowUp and ArrowDown on any button it sits on. -->
  <button
    [type]="type()"
    [class]="classes()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-busy]="loading() || null"
    [cdkMenuTriggerFor]="menuRef"
    [lfxUiTooltip]="tooltip()"
    [lfxUiTooltipTitle]="tooltipTitle()"
    [lfxUiTooltipShortcut]="tooltipShortcut()"
    [lfxUiTooltipSide]="tooltipSide()"
    [lfxUiTooltipDelay]="tooltipDelay()"
    [lfxUiTooltipDisabled]="tooltipDisabled()"
    (click)="onClick($event)"
    data-testid="ui-button">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
} @else {
  <button
    [type]="type()"
    [class]="classes()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-busy]="loading() || null"
    [lfxUiTooltip]="tooltip()"
    [lfxUiTooltipTitle]="tooltipTitle()"
    [lfxUiTooltipShortcut]="tooltipShortcut()"
    [lfxUiTooltipSide]="tooltipSide()"
    [lfxUiTooltipDelay]="tooltipDelay()"
    [lfxUiTooltipDisabled]="tooltipDisabled()"
    (click)="onClick($event)"
    data-testid="ui-button">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
