<!-- Exact px, not rem: the app root font is 14px, so rem utilities undershoot the design. -->
<div class="relative">
  <i class="fa-light fa-magnifying-glass pointer-events-none absolute left-[12px] top-1/2 -translate-y-1/2 text-[12px] text-gray-400" aria-hidden="true"></i>
  <input
    type="search"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    (input)="onInput($event)"
    class="h-[34px] w-full rounded-full border border-gray-200 bg-white pl-[32px] pr-[12px] text-[13px] text-gray-900 placeholder:text-gray-500 transition duration-150 hover:border-gray-300 focus-visible:border-blue-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none"
    data-testid="ui-search-input" />
</div>
