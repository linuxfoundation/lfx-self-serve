@if (heading()) {
  <span data-testid="ui-tooltip-title">{{ heading() }}</span>
  <!-- shortcut: literal white at 65% for the description ink. revisit: when the library ships a white-alpha token. -->
  <span class="font-normal text-[rgba(255,255,255,0.65)]" data-testid="ui-tooltip-text">{{ text() }}</span>
} @else {
  <span data-testid="ui-tooltip-text">{{ text() }}</span>
}
@if (shortcut().length) {
  <span class="inline-flex items-center gap-[4px]" data-testid="ui-tooltip-shortcut">
    @for (key of shortcut(); track $index) {
      <!-- shortcut: literal white at 25% for the key ring. revisit: when the library ships a white-alpha token. -->
      <kbd
        class="inline-flex h-[20px] min-w-[20px] items-center justify-center rounded-ui-xs px-[4px] label-12 font-normal tabular-nums shadow-[0_0_0_1px_rgba(255,255,255,0.25)]"
        >{{ key }}</kbd
      >
    }
  </span>
}
