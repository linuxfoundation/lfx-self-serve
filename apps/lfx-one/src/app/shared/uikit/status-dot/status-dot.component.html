@if (dotOnly()) {
  <span
    class="inline-flex rounded-ui-full focus-visible:shadow-focus focus-visible:outline-none"
    role="img"
    tabindex="0"
    [attr.aria-label]="text()"
    [lfxUiTooltip]="text()"
    data-testid="ui-status-dot-image">
    <span [class]="dotClasses()" aria-hidden="true" data-testid="ui-status-dot-marker"></span>
  </span>
} @else {
  <span [class]="dotClasses()" aria-hidden="true" data-testid="ui-status-dot-marker"></span>
  <span data-testid="ui-status-dot-label">{{ text() }}</span>
}
