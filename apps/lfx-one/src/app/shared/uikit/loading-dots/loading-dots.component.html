@if (label()) {
  <span class="sr-only" data-testid="ui-loading-dots-label">{{ label() }}</span>
}
@for (dot of dots; track dot) {
  <i [class]="dotClasses()" [style.animation-delay.s]="dot * 0.2" aria-hidden="true" data-testid="ui-loading-dots-dot"></i>
}
