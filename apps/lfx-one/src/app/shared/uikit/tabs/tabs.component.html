<div role="tablist" [attr.aria-label]="ariaLabel() || null" class="flex items-end gap-6 border-b border-gray-200">
  @for (tab of tabs(); track tab.value; let i = $index) {
    <button
      #tab
      type="button"
      role="tab"
      [attr.aria-selected]="value() === tab.value"
      [attr.tabindex]="value() === tab.value ? 0 : -1"
      [disabled]="tab.disabled"
      (click)="select(tab)"
      (keydown)="onKeydown($event, i)"
      class="-mb-px inline-flex items-center gap-1.5 whitespace-nowrap border-b-2 px-0.5 pb-2.5 pt-1 text-sm transition duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none"
      [class]="value() === tab.value ? 'border-blue-500 font-medium text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700'"
      [attr.data-testid]="'ui-tab-' + tab.value">
      {{ tab.label }}
      @if (tab.count !== undefined) {
        <span class="text-gray-400" [attr.data-testid]="'ui-tab-count-' + tab.value">{{ tab.count }}</span>
      }
    </button>
  }
</div>
