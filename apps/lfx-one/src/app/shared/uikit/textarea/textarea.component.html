<!-- Exact px, not rem; 14px root: 8px gap between label, field and message. -->
<div class="flex min-w-0 flex-col gap-[8px]">
  @if (label()) {
    <label class="label-13 text-ui-neutral-600" [for]="textareaId" data-testid="ui-textarea-label">{{ label() }}</label>
  }
  <textarea
    [id]="textareaId"
    [class]="textareaClasses()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.maxlength]="limit()"
    [attr.autocomplete]="autocomplete() || null"
    [attr.aria-label]="label() ? null : ariaLabel() || null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (compositionstart)="onCompositionStart()"
    (compositionend)="onCompositionEnd($event)"
    (blur)="onBlur()"
    data-testid="ui-textarea"></textarea>
  @if (error()) {
    <lfx-ui-error size="small" [id]="errorId" data-testid="ui-textarea-error">{{ error() }}</lfx-ui-error>
  } @else if (hint()) {
    <p [id]="hintId" class="copy-13 text-ui-neutral-600" data-testid="ui-textarea-hint">{{ hint() }}</p>
  }
</div>
