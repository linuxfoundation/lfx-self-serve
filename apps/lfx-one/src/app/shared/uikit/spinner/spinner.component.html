<span class="sr-only" data-testid="ui-spinner-label">{{ label() }}</span>
<!-- Bar geometry is proportional to the host size; 2px radius is below the smallest rounded-ui-* step. -->
@for (bar of bars; track bar) {
  <i
    class="spinner-bar absolute left-[46%] top-0 h-[26%] w-[8%] rounded-[2px] bg-current opacity-50"
    [style.transform]="'rotate(' + bar * 30 + 'deg)'"
    [style.animation-delay.s]="(bar - 11) / 10"
    aria-hidden="true"></i>
}
