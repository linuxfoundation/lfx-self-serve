<lfx-linked-email-support-toast />

<!-- Exact [Npx] design values throughout: rem undershoots at the 14px root. -->
<div class="min-h-full bg-white" data-testid="account-layout">
  <div class="mx-auto flex w-full max-w-[1200px] flex-col gap-[20px] px-[40px] pb-[56px] pt-[28px] max-[640px]:px-[20px] max-[640px]:pt-[20px]">
    <!-- Sticky page header; its negative margins cancel the padding above so it spans the column. -->
    <div
      #header
      class="sticky z-10 -mx-[40px] -mt-[28px] flex flex-col gap-[4px] bg-white px-[40px] pb-[18px] pt-[28px] max-[640px]:-mx-[20px] max-[640px]:-mt-[20px] max-[640px]:px-[20px] max-[640px]:pt-[20px]"
      [style.top.px]="headerTopPx()"
      data-testid="account-layout-header">
      <h1 class="m-0 font-display text-[24px] font-light leading-[1.2] text-gray-900" data-testid="account-layout-title">{{ title }}</h1>
      <p class="m-0 text-[12px] leading-[16px] text-gray-500" data-testid="account-layout-description">{{ description }}</p>
      <!-- The rule under the header, inset to the content edges. -->
      <span
        class="pointer-events-none absolute bottom-0 left-[40px] right-[40px] h-px bg-gray-200 max-[640px]:left-[20px] max-[640px]:right-[20px]"
        aria-hidden="true"></span>
      <span
        class="pointer-events-none absolute inset-x-0 top-full h-[32px] bg-gradient-to-b from-white via-white/85 via-35% to-white/0 transition-opacity duration-200 motion-reduce:transition-none"
        [class.opacity-0]="!scrolled()"
        aria-hidden="true"
        data-testid="account-layout-header-fade"></span>
    </div>

    <!-- Read-only notice while impersonating — editing acts on the real account and is disabled. -->
    @if (impersonating()) {
      <div
        class="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800"
        role="status"
        data-testid="account-layout-readonly-notice">
        <i class="fa-light fa-eye"></i>
        <span>You are viewing this account while impersonating another user. Editing is disabled.</span>
      </div>
    }

    <!-- Left nav beside the page; at 860px and below it stacks above the page. -->
    <div class="flex flex-row items-start gap-[24px] max-[860px]:flex-col">
      <nav
        class="min-w-0 flex-[0_0_240px] self-stretch pr-[20px] shadow-[inset_-1px_0_0] shadow-gray-200 max-[860px]:w-full max-[860px]:flex-none max-[860px]:pr-0 max-[860px]:shadow-none"
        aria-label="Account and settings"
        data-testid="account-layout-nav">
        <div class="sticky flex flex-col gap-[2px] max-[860px]:static" [style.top.px]="navTopPx()">
          @for (group of navGroups; track group.id; let first = $first) {
            <span
              class="px-[10px] pb-[6px] text-[11px] font-semibold uppercase leading-[16px] tracking-[.08em] text-gray-600"
              [class.pt-[14px]]="!first"
              [attr.data-testid]="'account-layout-nav-group-' + group.id"
              >{{ group.label }}</span
            >
            @for (item of group.items; track item.route) {
              <a
                [routerLink]="item.route"
                routerLinkActive="!bg-gray-100 !font-medium !text-gray-900 [&>i]:!text-gray-900"
                ariaCurrentWhenActive="page"
                class="flex h-[32px] flex-row items-center gap-[9px] rounded-[6px] px-[10px] text-[13px] leading-[18px] text-gray-700 hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                [attr.data-testid]="'account-layout-nav-' + item.route">
                <i class="w-[16px] text-center text-[13px] text-gray-500 {{ item.icon }}" aria-hidden="true"></i>{{ item.label }}
              </a>
            }
          }
        </div>
      </nav>

      <div class="flex min-w-0 flex-1 flex-col gap-[20px] max-[860px]:w-full" data-testid="account-layout-content">
        <router-outlet />
      </div>
    </div>
  </div>
</div>
