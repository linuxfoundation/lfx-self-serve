<!-- Impersonation Banner — a fixed 36px bar; every top-[36px] / pt-[36px] offset below must match IMPERSONATION_BANNER_HEIGHT_PX -->
<lfx-impersonation-banner />

<div class="flex min-h-screen" [ngClass]="{ 'pt-[36px]': userService.impersonating() }">
  <!-- Navbar - Desktop: floating 280px panel, 8px inset (288px gutter) -->
  <div
    class="hidden lg:flex flex-shrink-0 fixed left-0 bottom-0 z-40"
    [ngClass]="{
      'top-[36px]': userService.impersonating(),
      'top-0': !userService.impersonating(),
    }"
    data-testid="navbar-column">
    <lfx-navbar
      [items]="sidebarItems()"
      [showMeSelector]="activeLens() === 'me'"
      [showProjectSelector]="activeLens() === 'project' || activeLens() === 'foundation'"
      [showOrgSelector]="activeLens() === 'org'"
      [bannerOffset]="userService.impersonating()"
      [(selectorPanelOpen)]="selectorPanelOpen"></lfx-navbar>
  </div>

  <!-- Navbar - Mobile Drawer. A layout-owned panel, not PrimeNG's p-drawer: its Angular-animation lifecycle (re-parenting
       the panel to <body> on enter, tearing down on leave) could leave the panel invisible or stripped on iOS WebKit while
       the state said open. The panel always exists and slides with a CSS transition bound to the state, so what is shown
       can't drift from it. The navbar mounts on first open and then stays. -->
  @if (showMobileSidebar()) {
    <div
      class="lg:hidden fixed inset-0 z-[998] bg-black/40 touch-none mobile-navbar-backdrop"
      (click)="closeMobileSidebar()"
      aria-hidden="true"
      data-testid="mobile-sidebar-backdrop"></div>
  }
  <div
    #mobileDrawer
    class="lg:hidden fixed top-0 left-0 z-[999] flex h-full w-[296px] flex-col outline-none mobile-navbar-drawer"
    [class.is-open]="showMobileSidebar()"
    [attr.inert]="showMobileSidebar() ? null : ''"
    role="dialog"
    aria-modal="true"
    aria-label="Navigation"
    tabindex="-1"
    pFocusTrap
    [pFocusTrapDisabled]="!showMobileSidebar()"
    data-testid="mobile-sidebar-drawer">
    @if (mobileNavbarMounted()) {
      <lfx-navbar
        [items]="sidebarItems()"
        [showMeSelector]="activeLens() === 'me'"
        [showProjectSelector]="activeLens() === 'project' || activeLens() === 'foundation'"
        [showOrgSelector]="activeLens() === 'org'"
        [(selectorPanelOpen)]="selectorPanelOpen"
        [mobile]="true"></lfx-navbar>
    }
  </div>

  <!-- Selector backdrop — covers main content area when project/foundation selector is open -->
  @if (selectorPanelOpen()) {
    <div
      class="hidden lg:block fixed inset-0 bg-black/10 z-30"
      [ngClass]="{
        'top-[36px]': userService.impersonating(),
        'top-0': !userService.impersonating(),
      }"
      (click)="selectorPanelOpen.set(false)"
      data-testid="selector-backdrop"></div>
  }

  <!-- Main Content Area -->
  <!-- On the profile hub, reserve a right gutter (2xl:pr-[300px]) so content and the footer clear the fixed profile rail at 2xl and up; below 2xl the panel renders inline instead. -->
  <main class="flex-1 min-w-0 lg:ml-[288px] flex flex-col" [ngClass]="{ '2xl:pr-[300px]': isProfileHub() }" data-testid="main-content">
    <!-- Mobile Menu Button -->
    <div
      class="lg:hidden sticky z-30 bg-white border-b border-gray-200 px-5 py-3"
      [ngClass]="{ 'top-[36px]': userService.impersonating(), 'top-0': !userService.impersonating() }">
      <button
        #mobileMenuButton
        type="button"
        class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100 transition-colors"
        (click)="openMobileSidebar()"
        aria-label="Open menu"
        [attr.aria-expanded]="showMobileSidebar()"
        data-testid="mobile-menu-button">
        <i class="fa-light fa-bars text-gray-600 text-xl"></i>
      </button>
    </div>
    <div class="flex-grow px-5 md:px-8 py-6">
      <router-outlet />
    </div>
    <!-- Footer Component -->
    <lfx-app-footer class="block mt-auto px-5 md:ml-8 md:px-8" data-testid="main-layout-footer"></lfx-app-footer>
  </main>
</div>
