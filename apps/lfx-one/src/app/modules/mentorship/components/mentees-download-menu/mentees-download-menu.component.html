<lfx-button
  label="Download By Status"
  icon="fa-light fa-download"
  iconPos="left"
  severity="secondary"
  size="small"
  [outlined]="true"
  ariaHaspopup="menu"
  [ariaExpanded]="menuOpen()"
  [loading]="inFlight()"
  [disabled]="inFlight()"
  styleClass="whitespace-nowrap !py-2.5"
  (onClick)="onToggle($event)"
  [attr.data-testid]="dataTest()" />
<lfx-menu
  #menu
  [model]="menuItems()"
  [popup]="true"
  appendTo="body"
  styleClass="w-48"
  [ariaLabel]="menuAriaLabel()"
  (onShow)="menuOpen.set(true)"
  (onHide)="menuOpen.set(false)">
  <!-- A button so the menu's Enter and Space reach the row; PrimeNG's wrapper runs the command, so no handler here. -->
  <ng-template #item let-item>
    <button
      type="button"
      tabindex="-1"
      class="flex w-full items-center justify-between gap-2 px-3 py-2 text-left text-sm text-gray-800 transition-colors hover:bg-gray-50"
      [attr.data-testid]="dataTest() + '-' + item.id">
      {{ item.label }}
      <i class="fa-light fa-download text-gray-500" aria-hidden="true"></i>
    </button>
  </ng-template>
</lfx-menu>
