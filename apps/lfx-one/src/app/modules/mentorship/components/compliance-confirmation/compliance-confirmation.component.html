<div class="flex items-start gap-3">
  <lfx-checkbox
    [form]="form()"
    [control]="control()"
    [inputId]="idPrefix() + '-compliance'"
    [ariaLabelledBy]="idPrefix() + '-compliance-text'"
    [attr.data-testid]="idPrefix() + '-compliance-checkbox'" />
  <div [id]="idPrefix() + '-compliance-text'" class="min-w-0 flex-1 flex flex-col gap-2">
    <span class="text-sm text-gray-800 leading-5">
      @if (markRequired()) {
        <span class="text-red-500">*</span>
      }
      {{ lead }}
    </span>
    <ul class="list-disc pl-5 flex flex-col gap-2 text-sm text-gray-600 leading-5">
      @for (item of items; track item) {
        <li>{{ item }}</li>
      }
    </ul>
  </div>
</div>
@if (error()) {
  <p role="alert" class="text-xs text-red-600" [attr.data-testid]="idPrefix() + '-compliance-error'">{{ error() }}</p>
}
