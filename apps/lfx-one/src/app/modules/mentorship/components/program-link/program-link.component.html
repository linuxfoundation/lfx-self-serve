@if (programId() | mentorshipPublicUrl: 'programs'; as url) {
  <a
    class="text-blue-600 transition-colors hover:text-blue-700 hover:underline"
    [href]="url"
    target="_blank"
    rel="noopener noreferrer"
    [attr.data-testid]="testId()"
    >{{ programName() }}</a
  >
} @else {
  {{ programName() }}
}
