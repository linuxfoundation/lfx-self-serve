<p-drawer
  [visible]="drawer.isOpen()"
  (visibleChange)="onVisibleChange($event)"
  position="right"
  [modal]="true"
  [closable]="!saving()"
  [dismissible]="!saving()"
  [closeOnEscape]="!saving()"
  styleClass="lg:w-[620px] md:w-[70%] sm:w-[90%] w-full"
  data-testid="mentor-profile-edit-drawer">
  <ng-template #header>
    <h2 class="text-lg font-semibold text-gray-900" data-testid="mentor-profile-edit-drawer-header">{{ title }}</h2>
  </ng-template>

  <div class="flex flex-col gap-6 h-full" data-testid="mentor-profile-edit-drawer-body">
    <!-- Projected content is created even while the drawer is hidden, so the section waits for the first open to read programs. -->
    @if (opened()) {
      <lfx-mentorship-mentor-programs-section
        [requests]="requests()"
        [invitedProgramIds]="invitedProgramIds()"
        [requestsLoading]="requestsLoading()"
        [requestsFailed]="requestsFailed()"
        [requesting]="requesting()"
        [withdrawingId]="withdrawingId()"
        [bordered]="false"
        (add)="onAddProgram($event)"
        (withdraw)="onWithdraw($event)"
        (retry)="onRetryRequests()" />
    }

    <hr class="border-gray-200" />

    <!-- `inert` for the length of the save, and only over the profile fields: onSave() snapshots them before the request
         goes out and closes on that response, so an edit typed mid-save would be silently dropped. Program requests
         are their own writes, and the actions stay outside it. -->
    <div class="flex flex-col gap-6" data-testid="mentor-profile-edit-drawer-fields" [attr.inert]="saving() ? '' : null">
      <div class="flex flex-col gap-4" data-testid="mentor-profile-edit-introduction">
        <div class="flex flex-col gap-1">
          <h2 class="text-base font-semibold text-gray-900">Introduction</h2>
          <p class="text-sm text-gray-600">{{ introductionIntro }}</p>
        </div>

        <div class="flex flex-col gap-1">
          <label id="mentor-profile-edit-introduction-label" class="text-sm font-medium text-gray-700">
            Tell us a little bit about yourself. <span class="text-red-500">*</span>
          </label>
          <lfx-rich-editor
            [form]="form"
            control="introduction"
            [placeholder]="introductionPlaceholder"
            [editorStyle]="{ minHeight: '200px' }"
            ariaLabelledBy="mentor-profile-edit-introduction-label"
            dataTest="mentor-profile-edit-introduction" />
          @if (errors().introduction) {
            <p role="alert" class="text-xs text-red-600" data-testid="mentor-profile-edit-introduction-error">{{ errors().introduction }}</p>
          }
        </div>
      </div>

      <hr class="border-gray-200" />

      <div class="flex flex-col gap-4" data-testid="mentor-profile-edit-skills">
        <div class="flex flex-col gap-1">
          <h2 class="text-base font-semibold text-gray-900">Skills</h2>
          <p class="text-sm text-gray-600">{{ skillsIntro }}</p>
        </div>

        <lfx-mentorship-skills-picker [form]="form" label="Which of your skills should we feature?" idPrefix="mentor-profile-edit" [error]="errors().skills" />
      </div>
    </div>

    <!-- Kept next to the actions, not at the top of the body: Save sits below a long scrolling form, so an error at the top would render off-screen. -->
    @if (errorMessage(); as message) {
      <div
        #errorRef
        role="alert"
        tabindex="-1"
        class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 focus:outline-none"
        data-testid="mentor-profile-edit-drawer-error">
        {{ message }}
      </div>
    }

    <div class="flex justify-end gap-3 border-t border-gray-200 pt-4 mt-auto" data-testid="mentor-profile-edit-drawer-actions">
      <lfx-button
        type="button"
        variant="outlined"
        [label]="cancelLabel"
        [disabled]="saving()"
        (onClick)="onCancel()"
        size="small"
        data-testid="mentor-profile-edit-drawer-cancel" />

      <lfx-button
        type="button"
        severity="info"
        [label]="saveLabel"
        [loading]="saving()"
        [disabled]="saving()"
        (onClick)="onSave()"
        size="small"
        data-testid="mentor-profile-edit-drawer-save" />
    </div>
  </div>
</p-drawer>

<p-confirmDialog />
