<div
  class="flex flex-col gap-4 p-5 cursor-pointer hover:bg-gray-50 transition-colors sm:flex-row sm:items-center"
  role="button"
  tabindex="0"
  [attr.aria-label]="program().name"
  [attr.data-testid]="'mentorship-mentor-program-card-' + program().id"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick(); $event.preventDefault()">
  <div class="flex items-center gap-4 min-w-0 flex-1">
    <lfx-avatar
      [image]="program().logoUrl"
      [label]="initials()"
      shape="square"
      size="large"
      [styleClass]="avatarStyleClass()"
      [ariaLabel]="program().name + ' avatar'" />

    <div class="flex flex-col gap-1 min-w-0 flex-1">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-medium text-gray-500">{{ seasonLine() }}</span>
        <span class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full" [class]="termStatusBadgeClass()">
          {{ termStatusLabel() }}
        </span>
      </div>
      <span class="text-base font-bold text-gray-900">{{ program().name }}</span>
    </div>

    <div class="flex-shrink-0 text-gray-300 sm:hidden" aria-hidden="true">
      <i class="fa-light fa-chevron-right text-sm"></i>
    </div>
  </div>

  <div class="flex items-center justify-between sm:justify-end sm:gap-8 sm:flex-shrink-0" data-testid="mentorship-mentor-program-card-metrics">
    <div class="flex flex-col items-start sm:items-end">
      <span class="text-xs font-semibold tracking-wider text-gray-400 uppercase">Mentees</span>
      <span class="text-lg font-bold text-gray-900">{{ program().stats.mentees }}</span>
    </div>
    <div class="flex flex-col items-start sm:items-end">
      <span class="text-xs font-semibold tracking-wider text-gray-400 uppercase">Tasks to Review</span>
      <span class="text-lg font-bold text-amber-600">{{ program().stats.tasksToReview }}</span>
    </div>
    <div class="flex flex-col items-start sm:items-end">
      <span class="text-xs font-semibold tracking-wider text-gray-400 uppercase">Applicants</span>
      <span class="text-lg font-bold text-gray-900">{{ program().stats.applicants }}</span>
    </div>
  </div>

  <div class="hidden flex-shrink-0 text-gray-300 sm:block" aria-hidden="true">
    <i class="fa-light fa-chevron-right text-sm"></i>
  </div>
</div>
