<section class="rounded-2xl border border-gray-200 bg-white flex flex-col" data-testid="mentorship-mentee-apply-before">
  <div class="p-6 md:p-8 flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
      <p class="text-sm text-gray-500">{{ intro }}</p>
    </div>

    <lfx-mentorship-mentee-eligibility-checks [form]="form" idPrefix="mentorship-mentee-apply" />

    <div class="rounded-xl border border-gray-200 p-4" data-testid="mentorship-mentee-apply-compliance">
      <lfx-mentorship-compliance-confirmation [form]="form" idPrefix="mentorship-mentee-apply" />
    </div>

    <div data-testid="mentorship-mentee-apply-terms">
      <lfx-mentorship-terms-acknowledgement [form]="form" [intro]="publicityNote" idPrefix="mentorship-mentee" />
    </div>
  </div>
</section>
