<section class="rounded-2xl border border-gray-200 bg-white p-6 md:p-8 flex flex-col gap-6" data-testid="mentorship-mentee-demographics">
  <div class="flex flex-col gap-2">
    <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
    <p class="text-sm text-gray-600">{{ intro }}</p>
  </div>

  <hr class="border-gray-200" />

  <p class="text-sm text-gray-600">
    {{ removalNotePrefix }}<a [href]="'mailto:' + removalEmail" class="text-blue-600 hover:underline">{{ removalEmail }}</a
    >.
  </p>

  <div class="flex flex-col gap-6">
    @for (row of rows; track row.answerControl) {
      <div class="flex flex-col gap-2" [attr.data-testid]="idFor(row)">
        <label [id]="idFor(row) + '-question'" class="text-sm font-semibold text-gray-900">{{ row.question }}</label>
        <lfx-checkbox
          [form]="form()"
          [control]="row.consentControl"
          [inputId]="idFor(row) + '-consent'"
          [ariaDescribedBy]="idFor(row) + '-question'"
          [label]="consentLabel"
          [attr.data-testid]="idFor(row) + '-consent'" />
        <div class="max-w-lg">
          <lfx-select
            [form]="form()"
            [control]="row.answerControl"
            [options]="row.options"
            optionLabel="text"
            optionValue="value"
            placeholder="Select"
            styleClass="w-full"
            [ariaLabelledBy]="idFor(row) + '-question'"
            [dataTest]="idFor(row) + '-answer'" />
        </div>
      </div>
    }
  </div>
</section>
