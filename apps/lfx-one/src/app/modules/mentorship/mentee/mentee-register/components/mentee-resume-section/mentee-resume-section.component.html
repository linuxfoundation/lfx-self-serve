<section class="rounded-2xl border border-gray-200 bg-white p-6 md:p-8 flex flex-col gap-6" data-testid="mentorship-mentee-resume">
  <div class="flex flex-col gap-2">
    <h2 class="text-lg font-semibold text-gray-900">Resume</h2>
    <p class="text-sm text-gray-600">{{ intro }}</p>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700" for="mentorship-mentee-resume-input">Upload Resume</label>
    <div class="flex items-stretch overflow-hidden rounded-lg border border-gray-200 bg-white">
      <span
        class="flex flex-1 min-w-0 items-center truncate px-3 py-2 text-sm"
        [class]="resumeFileName() ? 'text-gray-900' : 'text-gray-500'"
        [attr.tabindex]="resumeFileName() ? 0 : null"
        [attr.role]="resumeFileName() ? 'status' : null"
        [pTooltip]="resumeFileName()"
        [tooltipDisabled]="!resumeFileName()"
        tooltipEvent="both"
        tooltipPosition="top"
        data-testid="mentorship-mentee-resume-name">
        {{ resumeFileName() || emptyLabel }}
      </span>
      @if (resumeFileName()) {
        <lfx-button
          icon="fa-light fa-xmark"
          severity="secondary"
          size="small"
          [text]="true"
          styleClass="!rounded-none shrink-0"
          [ariaLabel]="'Remove ' + resumeFileName()"
          (onClick)="onClear()"
          data-testid="mentorship-mentee-resume-clear" />
      }
      <lfx-button
        label="Browse"
        severity="primary"
        size="small"
        styleClass="!rounded-none shrink-0 whitespace-nowrap !py-2.5"
        (onClick)="onBrowse()"
        data-testid="mentorship-mentee-resume-browse" />
    </div>
    <input
      #fileInput
      id="mentorship-mentee-resume-input"
      type="file"
      class="hidden"
      [accept]="accept"
      (change)="onFileChange($event)"
      data-testid="mentorship-mentee-resume-file" />
    <p class="text-xs text-gray-500 mt-1">{{ helper }}</p>
    @if (fileError()) {
      <p role="alert" class="text-xs text-red-600" data-testid="mentorship-mentee-resume-error">{{ fileError() }}</p>
    }
  </div>
</section>
