<section class="rounded-2xl border border-gray-200 bg-white p-6 md:p-8 flex flex-col gap-4" data-testid="mentorship-mentee-country">
  <div class="flex flex-col gap-2">
    <h2 class="text-lg font-semibold text-gray-900">{{ title }}</h2>
    <p class="text-sm text-gray-600">{{ intro }}</p>
  </div>

  <div class="flex flex-col gap-1">
    <label for="mentorship-mentee-country" class="text-sm font-medium text-gray-700">{{ label }} <span class="text-red-500">*</span></label>
    <lfx-select
      size="small"
      [form]="form()"
      control="country"
      [options]="countryOptions"
      inputId="mentorship-mentee-country"
      [placeholder]="placeholder"
      styleClass="w-full md:w-1/2"
      [filter]="true"
      data-testid="mentorship-mentee-country-select" />
    @if (error()) {
      <p role="alert" class="text-xs text-red-600" data-testid="mentorship-mentee-country-error">{{ error() }}</p>
    }
  </div>
</section>
