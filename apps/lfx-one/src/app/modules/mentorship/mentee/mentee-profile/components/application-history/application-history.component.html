<section class="rounded-2xl border border-gray-200 bg-white p-6 md:p-8 flex flex-col gap-4" data-testid="mentorship-application-history">
  <header>
    <h2 class="text-lg font-semibold text-gray-900" data-testid="mentorship-application-history-title">{{ title }}</h2>
  </header>

  @if (rows().length > 0) {
    <div class="overflow-x-auto" data-testid="mentorship-application-history-list">
      <table class="w-full border-collapse">
        <thead>
          <tr class="border-b border-gray-100 text-left">
            <th class="pb-3 pr-4 text-sm font-medium text-gray-500">Program</th>
            <th class="pb-3 pr-4 text-sm font-medium text-gray-500">Submitted</th>
            <th class="pb-3 pr-4 text-sm font-medium text-gray-500">Status</th>
            <th class="pb-3 text-sm font-medium text-gray-500">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (row of rows(); track row.id) {
            <tr [attr.data-testid]="'mentorship-application-history-row-' + row.id">
              <td class="py-4 pr-4">
                <div class="flex flex-col min-w-0">
                  <span class="text-sm font-medium text-gray-900" [attr.data-testid]="'mentorship-application-history-name-' + row.id">
                    {{ row.programName }}
                  </span>
                  <span class="text-xs text-gray-500" [attr.data-testid]="'mentorship-application-history-term-' + row.id">
                    {{ row.termName }}
                  </span>
                </div>
              </td>
              <td class="py-4 pr-4 text-sm text-gray-600 whitespace-nowrap" [attr.data-testid]="'mentorship-application-history-submitted-' + row.id">
                {{ row.submittedOn }}
              </td>
              <td class="py-4 pr-4">
                <span
                  class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium"
                  [class]="row.statusBadgeClass"
                  [attr.data-testid]="'mentorship-application-history-status-' + row.id">
                  {{ row.statusLabel }}
                </span>
              </td>
              <td class="py-4">
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-md text-gray-400 hover:bg-gray-50 hover:text-gray-600"
                    [attr.aria-label]="viewLabel"
                    [attr.data-testid]="'mentorship-application-history-view-' + row.id"
                    (click)="onView(row)">
                    <i class="fa-light fa-eye" aria-hidden="true"></i>
                  </button>
                  @if (row.canWithdraw) {
                    <button
                      type="button"
                      class="inline-flex h-8 w-8 items-center justify-center rounded-md text-gray-400 hover:bg-gray-50 hover:text-gray-600"
                      [attr.aria-label]="withdrawLabel"
                      [attr.data-testid]="'mentorship-application-history-withdraw-' + row.id"
                      (click)="onWithdraw(row)">
                      <i class="fa-light fa-trash-can" aria-hidden="true"></i>
                    </button>
                  }
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <div class="flex flex-col items-center gap-2 py-6 text-center" data-testid="mentorship-application-history-empty">
      <p class="text-sm font-medium text-gray-900">{{ emptyTitle }}</p>
      <p class="text-xs text-gray-500 max-w-sm">{{ emptySubtitle }}</p>
    </div>
  }
</section>
