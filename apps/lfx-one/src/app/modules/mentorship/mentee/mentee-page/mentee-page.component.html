<div class="container mx-auto px-4 sm:px-6 lg:px-8">
  <!-- Header row: fixed H1 + optional "Find a Program" button -->
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-gray-900">{{ title }}</h1>
    @if (showFindProgram()) {
      <a
        [href]="findProgramUrl"
        target="_blank"
        rel="noopener noreferrer"
        data-testid="mentee-page-find-program"
        class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2">
        <i class="fa-light fa-magnifying-glass text-sm" aria-hidden="true"></i>
        {{ findProgramLabel }}
      </a>
    }
  </div>

  <!-- Underline tab bar -->
  <div role="tablist" class="flex gap-6 border-b border-gray-200 pt-5 mb-5">
    @for (tab of tabs(); track tab.value) {
      <button
        #tabBtn
        type="button"
        role="tab"
        [attr.data-testid]="'mentee-page-tab-' + tab.value"
        [attr.aria-selected]="activeTab() === tab.value"
        class="relative pb-3 text-sm font-medium transition-colors hover:text-gray-900 focus-visible:outline-none"
        [class.text-primary-700]="activeTab() === tab.value"
        [class.text-gray-500]="activeTab() !== tab.value"
        (click)="onTabClick(tab.value)"
        (keydown)="onTabKeydown($event)">
        {{ tab.label }}
        @if (tabWithCount() === tab.value) {
          <span class="ml-1 text-xs font-normal text-gray-400">{{ openTaskCount() }} open</span>
        }
        @if (activeTab() === tab.value) {
          <span class="absolute inset-x-0 -bottom-px h-0.5 bg-primary-700"></span>
        }
      </button>
    }
  </div>

  <!-- Routed child content -->
  <router-outlet (activate)="onChildActivate($event)" />
</div>
