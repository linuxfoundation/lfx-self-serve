<div class="flex flex-col gap-3 rounded-xl border border-gray-200 p-4" [attr.data-testid]="idPrefix() + '-age-eligible'">
  <div class="flex items-start gap-3">
    <lfx-checkbox
      [form]="form()"
      control="ageEligible"
      [inputId]="idPrefix() + '-age-eligible'"
      [ariaLabelledBy]="idPrefix() + '-age-eligible-text'"
      [attr.data-testid]="idPrefix() + '-age-eligible-checkbox'" />
    <span [id]="idPrefix() + '-age-eligible-text'" class="min-w-0 flex-1 text-sm text-gray-800 leading-5">
      <span class="text-red-500">*</span> {{ ageLabel }}
    </span>
  </div>
  @if (errors().ageEligible) {
    <p role="alert" class="text-xs text-red-600" [attr.data-testid]="idPrefix() + '-age-eligible-error'">{{ errors().ageEligible }}</p>
  }
</div>
