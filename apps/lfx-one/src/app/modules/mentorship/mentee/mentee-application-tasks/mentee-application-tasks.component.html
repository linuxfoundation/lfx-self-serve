@if (phase() === 'applicant') {
  <lfx-mentee-applicant-tasks />
} @else if (phase() === 'accepted') {
  <lfx-mentee-accepted-tasks />
} @else if (phase() === 'empty') {
  <!-- No tasks tab in the empty phase — redirecting to the overview. -->
  <lfx-route-loading data-testid="mentee-tasks-redirecting" />
}
