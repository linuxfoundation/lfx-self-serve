<div class="flex flex-col gap-5" data-testid="mentorship-programs-list">
  <!-- Search + Status filter row -->
  <div class="flex flex-col sm:flex-row gap-3">
    <div class="flex-1">
      <lfx-input-text [form]="form" control="search" placeholder="Search" icon="fa-light fa-magnifying-glass" dataTest="mentorship-programs-search" />
    </div>
    <div class="w-full sm:w-56">
      <lfx-select
        [form]="form"
        control="status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Filter By Status"
        [showClear]="true"
        [styleClass]="'w-full'"
        data-testid="mentorship-programs-status-filter" />
    </div>
  </div>

  <!-- Card list / empty state -->
  @if (programs().length > 0) {
    @for (program of programs(); track program.id) {
      <lfx-card
        styleClass="flex flex-col gap-3 [&_.p-card-body]:p-0 [&_.p-card-content]:p-0 overflow-hidden hover:!border-gray-200"
        data-testid="mentorship-programs-cards">
        <lfx-mentorship-program-card [program]="program" (cardClick)="onCardClick($event)" />
      </lfx-card>
    }
  } @else {
    <lfx-empty-state icon="fa-light fa-user-group" [title]="emptyTitle()" [subtitle]="emptySubtitle()" data-testid="mentorship-programs-empty-state" />
  }
</div>
