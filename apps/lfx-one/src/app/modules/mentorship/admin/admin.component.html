<div class="container mx-auto px-4 sm:px-6 lg:px-8" data-testid="mentorship-admin">
  <div class="flex flex-col gap-6">
    <!-- Page header -->
    <div class="flex items-center justify-between mt-3">
      <div>
        <h1 class="font-display font-light text-2xl" data-testid="mentorship-admin-title">Admin</h1>
      </div>
      <div class="flex items-center gap-6">
        <lfx-button
          label="Enroll a Program"
          icon="fa-light fa-plus"
          iconPos="left"
          severity="primary"
          size="small"
          (onClick)="onEnrollProgram()"
          data-testid="mentorship-admin-enroll-button" />
      </div>
    </div>

    @if (isLoading() && programs().length === 0) {
      <lfx-route-loading data-testid="mentorship-admin-loading" />
    } @else {
      <lfx-mentorship-programs-list
        [programs]="programs()"
        [searchTerm]="searchTerm()"
        [statusFilter]="statusFilter()"
        (searchChange)="onSearchChange($event)"
        (statusChange)="onStatusChange($event)"
        (programClick)="onProgramClick()" />
    }
  </div>
</div>
