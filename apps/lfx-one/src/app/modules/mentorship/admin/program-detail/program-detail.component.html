<div class="container mx-auto px-4 sm:px-6 lg:px-8" data-testid="mentorship-program-detail">
  <div class="flex flex-col gap-6 pb-8">
    <lfx-button
      label="Programs"
      icon="fa-light fa-chevron-left"
      iconPos="left"
      [text]="true"
      size="small"
      styleClass="!text-blue-600 !px-0 self-start mt-3"
      routerLink="/mentorship/admin"
      data-testid="mentorship-program-detail-back" />

    @if (isLoading()) {
      <lfx-route-loading data-testid="mentorship-program-detail-loading" />
    } @else if (detail(); as programDetail) {
      <lfx-mentorship-program-detail-header
        [program]="programDetail.program"
        [tabCounts]="tabCounts()"
        [activeTab]="activeTab()"
        (tabChange)="onTabChange($event)"
        (editClick)="onEditProgram()" />

      <div
        role="tabpanel"
        [id]="'mentorship-program-detail-tab-panel-' + activeTab()"
        [attr.aria-labelledby]="'mentorship-program-detail-tab-trigger-' + activeTab()">
        @switch (activeTab()) {
          @case ('mentees') {
            @if (isCompleted()) {
              <lfx-mentorship-past-mentees-tab [mentees]="mentees()" />
            } @else {
              <lfx-mentorship-current-mentees-tab [mentees]="mentees()" />
            }
          }
          @case ('applicants') {
            <lfx-mentorship-applicants-tab [applicants]="applicants()" />
          }
          @case ('mentors') {
            <lfx-mentorship-mentors-tab [mentors]="mentors()" />
          }
          @case ('terms') {
            <lfx-mentorship-terms-tab [terms]="terms()" />
          }
        }
      </div>
    } @else {
      <lfx-empty-state
        icon="fa-light fa-folder-open"
        title="Program not found"
        subtitle="This program is unavailable or the link is incorrect."
        ctaLabel="Back to programs"
        [ctaRoute]="['/mentorship/admin']"
        data-testid="mentorship-program-detail-not-found" />
    }
  </div>
</div>
