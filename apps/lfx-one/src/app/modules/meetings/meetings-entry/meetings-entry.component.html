@switch (view()) {
  @case ('redesign') {
    @defer (on immediate) {
      <lfx-meetings-redesign />
    }
  }
  @case ('v1') {
    @defer (on immediate) {
      <lfx-meetings-dashboard />
    }
  }
  @default {
    <div class="flex min-h-[320px] items-center justify-center text-gray-400" role="status" aria-label="Loading meetings" data-testid="meetings-entry-loading">
      <i class="fa-light fa-spinner-third fa-spin text-2xl" aria-hidden="true"></i>
    </div>
  }
}
