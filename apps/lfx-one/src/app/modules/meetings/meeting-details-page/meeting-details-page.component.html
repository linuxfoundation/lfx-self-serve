<lfx-impersonation-banner />

<div [ngClass]="{ 'pt-12': userService.impersonating() }">
  <lfx-header />

  <!-- The token layer's scope class sits on a wrapper inside this template; see the tokens file. -->
  <div class="meeting-details-v2 min-h-screen bg-[var(--md-surface-page)] text-[var(--md-text-body)]">
    <!-- Prototype geometry in exact px (the app's 14px root would shrink rem utilities): 1120px
         max width, 40px gutters (16px at 640px and below), 56px above the header, 96px below. -->
    <main class="mx-auto max-w-[1120px] px-[16px] pb-[96px] pt-[56px] min-[641px]:px-[40px]" data-testid="meeting-page-shell">
      @switch (state.status()) {
        @case ('error') {
          <!-- A 5xx or network failure. 400 / 403 / 404 never get here: the state service sends them to
               /meetings/not-found. A later background refresh failing on a working page does not either. -->
          <div class="flex flex-col items-center gap-3 py-24 text-center" role="alert" data-testid="meeting-error-state">
            <i class="fa-light fa-triangle-exclamation text-4xl text-[var(--md-text-muted)]" aria-hidden="true"></i>
            <p class="text-lg text-[var(--md-text-heading)]">Something went wrong loading this meeting.</p>
            <p class="text-sm text-[var(--md-text-muted)]">Check your connection and try again.</p>
            <lfx-button label="Try again" icon="fa-light fa-arrows-rotate" [outlined]="true" size="small" (onClick)="state.refresh()" />
          </div>
        }
        @case ('ready') {
          @if (state.meeting(); as meeting) {
            <!-- E1-03 replaces this region's body with the full header and badge row. -->
            <section class="flex flex-col gap-3" data-testid="meeting-header-section">
              <h1 class="text-[34px] font-bold leading-[1.15] tracking-[-0.022em] text-[var(--md-text-heading)]">{{ meeting.title }}</h1>
            </section>
            <ng-container [ngTemplateOutlet]="columns" />
          }
        }
        @default {
          <div role="status" aria-live="polite" data-testid="meeting-skeleton">
            <span class="sr-only">Loading meeting details…</span>
            <div class="flex flex-col gap-3" aria-hidden="true">
              <div class="md-skeleton h-[16px] w-[160px]"></div>
              <div class="md-skeleton h-[39px] w-3/5"></div>
              <div class="md-skeleton h-[26px] w-[320px] max-w-full"></div>
            </div>
            <ng-container [ngTemplateOutlet]="columns" />
          </div>
        }
      }
    </main>
  </div>
</div>

<!-- The two columns. Each placeholder stands in for a section a later Phase 1 issue builds; the
     section replaces its placeholder, keeping this order and these gaps. Stacked at 920px and below
     (32px apart); side by side above that (44px apart), the rail 344px wide and sticky at 115px,
     the height of E1-02's identity bar plus 32px. -->
<ng-template #columns>
  <div class="mt-[56px] flex flex-col gap-[32px] min-[921px]:flex-row min-[921px]:items-start min-[921px]:gap-[44px]">
    <div class="flex min-w-0 flex-col gap-[64px] min-[921px]:flex-[1.7_1_0%]" data-testid="meeting-content-column">
      <div class="md-skeleton h-[109px]" aria-hidden="true" data-testid="meeting-section-placeholder-occurrences"></div>
      <div class="md-skeleton h-[220px]" aria-hidden="true" data-testid="meeting-section-placeholder-agenda"></div>
      <div class="md-skeleton h-[280px]" aria-hidden="true" data-testid="meeting-section-placeholder-materials"></div>
      <div class="md-skeleton h-[280px]" aria-hidden="true" data-testid="meeting-section-placeholder-discover"></div>
    </div>
    <aside
      class="flex w-full flex-col gap-[20px] min-[921px]:sticky min-[921px]:top-[115px] min-[921px]:w-[344px] min-[921px]:flex-none"
      aria-label="Meeting actions"
      data-testid="meeting-rail">
      <div class="md-skeleton h-[320px]" aria-hidden="true" data-testid="meeting-section-placeholder-rail"></div>
    </aside>
  </div>
</ng-template>
