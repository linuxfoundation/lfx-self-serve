<!-- Prototype geometry in exact px (the app's 14px root would shrink rem utilities): a 16px bold
     heading 12px above 15px body copy, at most 660px wide; Edit agenda is a 30px pill. -->
<section class="flex flex-col gap-[12px]" aria-labelledby="meeting-agenda-heading" data-testid="agenda-section">
  <div class="flex items-center justify-between gap-[12px]">
    <div class="flex items-center gap-[9px]">
      <i class="fa-light fa-list-check text-[var(--md-text-muted)]" aria-hidden="true"></i>
      <h2 id="meeting-agenda-heading" class="m-0 text-[16px] font-bold text-[var(--md-text-heading)]">Agenda</h2>
    </div>
    @if (organizer()) {
      <a
        class="inline-flex h-[30px] flex-none items-center gap-[6px] rounded-full border border-[var(--md-border-strong)] bg-[var(--md-surface-card)] px-[12px] text-[12.5px] font-semibold text-[var(--md-text-heading)] no-underline hover:bg-[var(--md-surface-hover)] focus-visible:shadow-[var(--md-shadow-focus)] focus-visible:outline-none"
        [routerLink]="editCommands()"
        [queryParams]="editQueryParams()"
        data-testid="agenda-section-edit">
        <i class="fa-light fa-pen" aria-hidden="true"></i>
        Edit agenda
      </a>
    }
  </div>

  @if (description(); as description) {
    <div class="max-w-[660px] text-[15px] leading-[1.65] text-[var(--md-text-body)]" data-testid="agenda-section-description">
      <lfx-expandable-text [maxHeight]="collapsedHeight">
        <div
          class="text-[15px] leading-[1.65] text-[var(--md-text-body)] [&_a]:text-[var(--md-accent-ink)] [&_a]:underline"
          [innerHTML]="description | linkify"></div>
      </lfx-expandable-text>
    </div>
  } @else {
    <p class="m-0 text-[14px] text-[var(--md-text-muted)]" data-testid="agenda-section-empty">No agenda has been added for this meeting yet.</p>
  }
</section>
