<!-- V1's attendance figures (attended, absent, rate) in the V2 section style: a 16px bold heading 14px
     above the figures, each a pill-shaped card in exact px (the app's 14px root would shrink rem utilities). -->
@if (hasAttendanceData()) {
  <section class="flex flex-col gap-[14px]" aria-labelledby="meeting-attendance-heading" data-testid="attendance-section">
    <div class="flex items-center gap-[9px]">
      <i class="fa-light fa-chart-pie text-[var(--md-text-muted)]" aria-hidden="true"></i>
      <h2 id="meeting-attendance-heading" class="m-0 text-[16px] font-bold text-[var(--md-text-heading)]">Attendance</h2>
    </div>
    <ul class="m-0 flex list-none flex-wrap items-center gap-[10px] p-0">
      <li
        class="flex items-center gap-[8px] rounded-[var(--md-radius-md)] border border-[var(--md-border)] bg-[var(--md-surface-card)] px-[14px] py-[9px] text-[13.5px]"
        data-testid="attendance-section-attended">
        <i class="fa-light fa-circle-check text-[var(--md-status-good)]" aria-hidden="true"></i>
        <span class="text-[var(--md-text-muted)]"
          ><span class="font-semibold tabular-nums text-[var(--md-status-good)]">{{ attendedCount() }}</span> attended</span
        >
      </li>
      <li
        class="flex items-center gap-[8px] rounded-[var(--md-radius-md)] border border-[var(--md-border)] bg-[var(--md-surface-card)] px-[14px] py-[9px] text-[13.5px]"
        data-testid="attendance-section-absent">
        <i class="fa-light fa-circle-xmark text-[var(--md-text-muted)]" aria-hidden="true"></i>
        <span class="text-[var(--md-text-muted)]"
          ><span class="font-semibold tabular-nums text-[var(--md-text-body)]">{{ absentCount() }}</span> absent</span
        >
      </li>
      <li
        class="flex items-center gap-[8px] rounded-[var(--md-radius-md)] border border-[var(--md-border)] bg-[var(--md-surface-card)] px-[14px] py-[9px] text-[13.5px]"
        data-testid="attendance-section-rate">
        <i class="fa-light fa-chart-pie text-[var(--md-accent)]" aria-hidden="true"></i>
        <span class="text-[var(--md-text-muted)]"
          ><span class="font-semibold tabular-nums text-[var(--md-text-heading)]">{{ attendancePercentage() }}%</span> rate</span
        >
      </li>
    </ul>
  </section>
}
