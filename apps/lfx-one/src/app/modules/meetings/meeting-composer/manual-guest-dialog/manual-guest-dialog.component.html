<div class="flex flex-col gap-4" data-testid="composer-guest-manual-dialog">
  <lfx-registrant-form [form]="form" [registrant]="null" [manualOnly]="true" />

  <div class="flex justify-end gap-2">
    <lfx-button size="small" label="Cancel" severity="secondary" [outlined]="true" (click)="onCancel()" data-testid="composer-guest-manual-cancel" />
    <lfx-button size="small" label="Add guest" severity="info" [disabled]="!form.valid" (click)="onSubmit()" data-testid="composer-guest-manual-submit" />
  </div>
</div>
