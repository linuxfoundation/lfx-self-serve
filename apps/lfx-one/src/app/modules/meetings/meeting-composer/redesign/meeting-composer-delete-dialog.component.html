<!-- Exact px from the design: the 14px root shrinks the rem scale. The warning is the subtitle so the alert dialog announces it. -->
<lfx-ui-modal
  heading="Delete meeting?"
  subtitle="This permanently deletes the meeting. This can’t be undone."
  [width]="560"
  data-testid="meeting-composer-delete-dialog">
  <div
    class="-mx-[24px] flex flex-col gap-[6px] border-y border-gray-200 px-[24px] py-[14px] text-[14px] leading-[20px]"
    data-testid="meeting-composer-delete-details">
    <span class="font-semibold text-gray-900">Meeting details</span>
    <span class="flex gap-[8px]"
      ><span class="w-[64px] shrink-0 font-medium text-gray-600">Title:</span><span>{{ title }}</span></span
    >
    <span class="flex gap-[8px]"
      ><span class="w-[64px] shrink-0 font-medium text-gray-600">Date:</span><span>{{ date }}</span></span
    >
    <span class="flex gap-[8px]"
      ><span class="w-[64px] shrink-0 font-medium text-gray-600">Time:</span><span>{{ time }}</span></span
    >
    @if (guests) {
      <span class="flex gap-[8px]"
        ><span class="w-[64px] shrink-0 font-medium text-gray-600">Guests:</span><span>{{ guests }}</span></span
      >
    }
  </div>

  <ng-container modalActions>
    <lfx-ui-button data-autofocus variant="secondary" [disabled]="busy()" data-testid="meeting-composer-delete-keep" (click)="keep()"
      >Keep meeting</lfx-ui-button
    >
    <lfx-ui-button variant="danger" icon="fa-light fa-trash" [loading]="busy()" data-testid="meeting-composer-delete-confirm" (click)="confirm()">
      Delete meeting
    </lfx-ui-button>
  </ng-container>
</lfx-ui-modal>
