<!-- Composer section rail (GH-1459), with the collapsed chip row for narrow viewports (GH-1462) -->
<nav [ngClass]="navClass()" aria-label="Composer sections" [attr.data-testid]="testIdPrefix()">
  @for (row of rows(); track row.section.id) {
    @if (compact()) {
      <button
        type="button"
        class="flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-medium transition-colors"
        [ngClass]="{
          'border-blue-700 bg-blue-700 text-white cursor-pointer': row.active,
          'border-blue-200 bg-white text-blue-700 cursor-pointer': row.complete,
          'border-gray-200 bg-white text-gray-600 cursor-pointer': !row.active && !row.complete && row.reachable,
          'border-gray-200 bg-white text-gray-400 cursor-default': !row.active && !row.complete && !row.reachable,
        }"
        [attr.aria-current]="row.active ? activeChipAriaCurrent() : null"
        [attr.aria-disabled]="row.reachable ? null : 'true'"
        [attr.data-active-chip]="row.active ? 'true' : null"
        [attr.data-testid]="testIdPrefix() + '-' + row.section.id"
        (click)="onSelect(row)">
        <i [ngClass]="row.section.icon" aria-hidden="true"></i>
        <span class="whitespace-nowrap">{{ row.section.label }}</span>
        @if (row.needsAttention) {
          <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-red-500" [attr.data-testid]="testIdPrefix() + '-attention-' + row.section.id"></span>
          <span class="sr-only">Required fields still missing</span>
        }
      </button>
    } @else if (isEditMode()) {
      <button
        type="button"
        class="flex items-center gap-3 rounded-md px-3 py-2.5 text-left text-sm font-medium transition-colors"
        [ngClass]="row.active ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'"
        [attr.aria-current]="row.active ? 'true' : null"
        [attr.data-testid]="'meeting-composer-rail-' + row.section.id"
        (click)="onSelect(row)">
        <i class="w-4 text-center" [ngClass]="row.section.icon" aria-hidden="true"></i>
        <span class="truncate">{{ row.section.label }}</span>
        @if (row.needsAttention) {
          <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-red-500" [attr.data-testid]="'meeting-composer-rail-attention-' + row.section.id"></span>
          <span class="sr-only">Required fields still missing</span>
        }
      </button>
    } @else {
      <!-- Create-mode stepper. Five states, each with its own marker so none can be mistaken for another:
           done (solid blue check), current (white ring on a tinted row), needs attention (red), available
           (solid gray outline that darkens on hover) and locked (dashed outline, faded label).
           Sections past the frontier are inert, matching the footer's ordering. -->
      @let locked = !row.active && !row.reachable;
      @let attention = row.needsAttention && !row.active;
      <!-- The states are exclusive: a section that is done but sits past a required one that was emptied
           again is not reachable, and reads as locked rather than done (attention beats both). -->
      @let done = row.complete && !attention && !locked;
      <!-- Geometry is in exact px because the 14px root shrinks Tailwind's rem scale: 8px vertical row
           padding around a 24px marker, with the label centred on it. The side padding is `px-3.5` on purpose,
           not px: it matches the preview card's `p-3.5` below, so the rail and the card share one inset. -->
      <button
        type="button"
        class="group flex w-full items-center gap-[12px] rounded-lg px-3.5 py-[8px] text-left transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40"
        [ngClass]="{
          'bg-blue-50': row.active,
          'cursor-pointer hover:bg-gray-50': !row.active && row.reachable,
          'cursor-not-allowed': locked,
        }"
        [attr.aria-current]="row.active ? 'step' : null"
        [attr.aria-disabled]="row.reachable ? null : 'true'"
        [attr.data-testid]="'meeting-composer-rail-' + row.section.id"
        (click)="onSelect(row)">
        <!-- Marker column: the connector hangs off the marker inside this column, so it is centred under
             the circle by layout rather than by offset. It runs 4px below this marker to 4px above the next
             one: through this row's 8px bottom padding, the 2px row gap and the next row's 8px top padding. -->
        <span class="relative flex w-[24px] shrink-0 justify-center self-stretch">
          @if (!row.isLast) {
            <span
              class="pointer-events-none absolute bottom-[-14px] left-1/2 top-[28px] w-[2px] -translate-x-1/2 rounded-full transition-colors duration-150"
              [ngClass]="done ? 'bg-blue-600' : 'bg-gray-200'"
              aria-hidden="true"></span>
          }
          <span
            class="relative z-10 flex h-[24px] w-[24px] items-center justify-center rounded-full border-[1.5px] text-[11px] transition-colors duration-150"
            [ngClass]="{
              'border-blue-600 bg-white text-blue-600 shadow-[0_0_0_4px] shadow-blue-100': row.active,
              'border-blue-600 bg-blue-600 text-white': done,
              'border-red-300 bg-red-50 text-red-500': attention,
              'border-gray-300 bg-white text-gray-500 group-hover:border-gray-400 group-hover:text-gray-700':
                !row.active && !done && !attention && row.reachable,
              'border-dashed border-gray-200 bg-gray-50 text-gray-300': locked && !attention,
            }">
            @if (done) {
              <i class="fa-solid fa-check text-[10px]" aria-hidden="true"></i>
            } @else {
              <i [ngClass]="row.section.icon" aria-hidden="true"></i>
            }
            @if (row.needsAttention) {
              <span
                class="absolute -right-[2px] -top-[2px] h-[8px] w-[8px] rounded-full bg-red-500 ring-2 ring-white"
                [attr.data-testid]="'meeting-composer-rail-attention-' + row.section.id"></span>
              <span class="sr-only">Required fields still missing</span>
            }
          </span>
        </span>

        <span class="flex min-w-0 flex-1">
          <span
            class="truncate text-[13px] leading-[20px]"
            [ngClass]="{
              'font-semibold text-blue-700': row.active,
              'font-medium text-gray-900': done,
              'font-medium text-gray-700 group-hover:text-gray-900': !row.active && !done && row.reachable,
              'font-medium text-gray-400': locked,
            }">
            {{ row.section.label }}
          </span>
        </span>
      </button>
    }
  }
</nav>
