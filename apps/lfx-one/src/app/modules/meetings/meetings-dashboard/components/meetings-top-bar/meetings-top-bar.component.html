<div class="flex flex-col md:flex-row md:items-center gap-3 md:gap-4">
  <!-- Time range: one either/or control, kept visually apart from the on/off filters beside it -->
  <lfx-filter-pills
    variant="segmented"
    ariaLabel="Time range"
    [options]="timeTabOptions"
    [selectedFilter]="timeFilter()"
    (filterChange)="onTimeTabChange($event)"
    data-testid="time-filter-tabs" />

  @if (showPendingRsvpFilter() || showOrganizerFilter() || showDeclinedFilter()) {
    <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Filters">
      <!-- Pending RSVP (Me lens, upcoming only) -->
      @if (showPendingRsvpFilter()) {
        <div data-testid="pending-rsvp-filter-pills">
          <ng-container
            *ngTemplateOutlet="toggleChip; context: { id: 'pending', label: 'Pending RSVP', count: pendingRsvpCount(), active: pendingRsvpOnly() }" />
        </div>
      }

      <!-- Organized by me (Me lens, upcoming + past) -->
      @if (showOrganizerFilter()) {
        <div data-testid="organizer-filter-pills">
          <ng-container
            *ngTemplateOutlet="toggleChip; context: { id: 'organizer', label: 'Organized by me', count: organizerCount(), active: organizerOnly() }" />
        </div>
      }

      <!-- Show declined (Me lens, upcoming only): meetings declined for every date are hidden by default -->
      @if (showDeclinedFilter()) {
        <div data-testid="declined-filter-pills">
          <ng-container *ngTemplateOutlet="toggleChip; context: { id: 'declined', label: 'Show declined', count: declinedCount(), active: showDeclined() }" />
        </div>
      }
    </div>
  }

  <ng-template #toggleChip let-id="id" let-label="label" let-count="count" let-active="active">
    <button
      type="button"
      class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm border transition-colors"
      [class]="active ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-100'"
      [attr.aria-pressed]="active"
      [attr.aria-label]="label + ', ' + count"
      [attr.data-testid]="'filter-pill-' + id"
      (click)="onToggleChip(id)">
      <i class="fa-light text-xs" [class]="active ? 'fa-square-check' : 'fa-square'" aria-hidden="true"></i>
      <span>{{ label }}</span>
      <span class="text-xs" [class]="active ? 'text-blue-600' : 'text-gray-500'" [attr.data-testid]="'filter-pill-count-' + id">{{ count }}</span>
    </button>
  </ng-template>

  <!-- Search Input -->
  <div class="flex-1">
    <lfx-input-text
      [form]="searchForm"
      control="search"
      placeholder="Search meetings..."
      icon="fa-light fa-search"
      styleClass="w-full"
      size="small"
      data-testid="meetings-search-input"></lfx-input-text>
  </div>

  <!-- Foundation Filter Dropdown -->
  @if (showFoundationFilter()) {
    <div class="w-full sm:w-48">
      <lfx-select
        [form]="searchForm"
        control="foundationFilter"
        size="small"
        [options]="foundationOptions()"
        styleClass="w-full"
        (onChange)="onFoundationFilterChange($event.value)"
        data-testid="foundation-filter-dropdown"></lfx-select>
    </div>
  }

  <!-- Project Filter Dropdown -->
  @if (showProjectFilter()) {
    <div class="w-full sm:w-48">
      <lfx-select
        [form]="searchForm"
        control="projectFilter"
        size="small"
        [options]="projectOptions()"
        styleClass="w-full"
        (onChange)="onProjectFilterChange($event.value)"
        data-testid="project-filter-dropdown"></lfx-select>
    </div>
  }

  <!-- Meeting Type Filter Dropdown -->
  <div class="w-full sm:w-64">
    <lfx-select
      [form]="searchForm"
      control="meetingType"
      size="small"
      [options]="meetingTypeOptions()"
      placeholder="Select Type"
      [showClear]="true"
      styleClass="w-full"
      (onChange)="onMeetingTypeChange($event.value)"
      data-testid="meeting-type-filter"></lfx-select>
  </div>
</div>
