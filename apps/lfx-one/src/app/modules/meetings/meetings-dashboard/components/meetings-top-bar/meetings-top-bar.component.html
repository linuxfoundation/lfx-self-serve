<div class="flex min-w-0 flex-col gap-3">
  <div class="flex min-w-0 flex-wrap items-center gap-2" role="group" aria-label="Meeting views" data-testid="meeting-view-pills">
    <lfx-filter-pills
      class="min-w-0 max-w-full"
      [options]="meetingViewOptions()"
      [selectedFilter]="meetingView()"
      (filterChange)="onMeetingViewChange($event)" />
    @if (showAcceptedFilter()) {
      <button
        type="button"
        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm border transition-colors"
        [class]="acceptedOnly() ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-100'"
        [attr.aria-pressed]="acceptedOnly()"
        [attr.aria-label]="'Accepted, ' + acceptedCount()"
        data-testid="filter-pill-accepted"
        (click)="onToggleChip('accepted')">
        <span>Accepted</span>
        <span class="text-xs" data-testid="filter-pill-count-accepted">{{ acceptedCount() }}</span>
      </button>
    }
  </div>

  <div class="flex min-w-0 flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
    <div class="min-w-0 w-full sm:w-auto sm:flex-1 sm:basis-48">
      <lfx-input-text
        [form]="searchForm"
        control="search"
        placeholder="Search meetings..."
        icon="fa-light fa-search"
        styleClass="w-full"
        size="small"
        data-testid="meetings-search-input"></lfx-input-text>
    </div>

    @if (showFoundationFilter()) {
      <div class="min-w-0 w-full sm:w-48 sm:max-w-full">
        <lfx-select
          [form]="searchForm"
          control="foundationFilter"
          size="small"
          [options]="foundationOptions()"
          styleClass="w-full"
          (onChange)="onFoundationFilterChange($event.value)"
          data-testid="foundation-filter-dropdown"></lfx-select>
      </div>
    }

    @if (showProjectFilter()) {
      <div class="min-w-0 w-full sm:w-48 sm:max-w-full">
        <lfx-select
          [form]="searchForm"
          control="projectFilter"
          size="small"
          [options]="projectOptions()"
          styleClass="w-full"
          (onChange)="onProjectFilterChange($event.value)"
          data-testid="project-filter-dropdown"></lfx-select>
      </div>
    }

    <div class="min-w-0 w-full sm:w-64 sm:max-w-full">
      <lfx-select
        [form]="searchForm"
        control="meetingType"
        size="small"
        [options]="meetingTypeOptions()"
        placeholder="Select Type"
        [showClear]="true"
        styleClass="w-full"
        (onChange)="onMeetingTypeChange($event.value)"
        data-testid="meeting-type-filter"></lfx-select>
    </div>

    @if (showDeclinedFilter()) {
      <div class="min-w-0 max-w-full" data-testid="declined-filter-pills">
        <button
          type="button"
          class="inline-flex max-w-full items-center gap-1.5 px-3 py-1 rounded-full text-sm border transition-colors"
          [class]="showDeclined() ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-100'"
          [attr.aria-pressed]="showDeclined()"
          [attr.aria-label]="'Show declined, ' + declinedCount()"
          data-testid="filter-pill-declined"
          (click)="onShowDeclinedChange()">
          <i class="fa-light text-xs" [class]="showDeclined() ? 'fa-square-check' : 'fa-square'" aria-hidden="true"></i>
          <span>Show declined</span>
          <span class="text-xs" [class]="showDeclined() ? 'text-blue-600' : 'text-gray-500'" data-testid="filter-pill-count-declined">
            {{ declinedCount() }}
          </span>
        </button>
      </div>
    }
  </div>
</div>
