<div role="group" aria-label="Meeting time" data-testid="meeting-view-pills">
  <lfx-card-tabs-bar [options]="meetingViewOptions" [selectedFilter]="meetingView()" (filterChange)="onMeetingViewChange($event)" />
</div>

<div class="flex min-w-0 flex-col gap-4 px-5 py-4">
  @if (showPersonalFilters()) {
    <div class="flex min-w-0 flex-col gap-4" data-testid="personal-meeting-filters">
      <div class="flex min-w-0 flex-wrap items-center gap-3" role="group" aria-label="Meeting response filters" data-testid="meeting-response-pills">
        <lfx-filter-pills
          class="min-w-0 max-w-full"
          [options]="responseFilterOptions()"
          [selectedFilter]="responseFilter()"
          (filterChange)="onResponseFilterChange($event)" />
      </div>
      <div class="flex flex-wrap items-center gap-x-6 gap-y-3" role="group" aria-label="Additional meeting filters">
        <lfx-checkbox
          [form]="personalFiltersForm"
          control="organizedByMe"
          inputId="meetings-organized-by-me"
          [label]="organizerLabel()"
          data-testid="organized-by-me-checkbox" />
        @if (responseFilter() !== 'declined') {
          <lfx-checkbox
            [form]="personalFiltersForm"
            control="hideDeclined"
            inputId="meetings-hide-declined"
            label="Hide meetings declined for all dates"
            data-testid="hide-declined-checkbox" />
        }
      </div>
    </div>
  }

  <div class="flex min-w-0 flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
    <div class="min-w-0 w-full sm:w-auto sm:flex-1 sm:basis-48">
      <lfx-input-text
        [form]="searchForm"
        control="search"
        placeholder="Search meetings..."
        icon="fa-light fa-search"
        styleClass="w-full"
        size="small"
        data-testid="meetings-search-input"></lfx-input-text>
    </div>

    @if (showFoundationFilter()) {
      <div class="min-w-0 w-full sm:w-48 sm:max-w-full">
        <lfx-select
          [form]="searchForm"
          control="foundationFilter"
          size="small"
          [options]="foundationOptions()"
          styleClass="w-full"
          (onChange)="onFoundationFilterChange($event.value)"
          data-testid="foundation-filter-dropdown"></lfx-select>
      </div>
    }

    @if (showProjectFilter()) {
      <div class="min-w-0 w-full sm:w-48 sm:max-w-full">
        <lfx-select
          [form]="searchForm"
          control="projectFilter"
          size="small"
          [options]="projectOptions()"
          styleClass="w-full"
          (onChange)="onProjectFilterChange($event.value)"
          data-testid="project-filter-dropdown"></lfx-select>
      </div>
    }

    <div class="min-w-0 w-full sm:w-64 sm:max-w-full">
      <lfx-select
        [form]="searchForm"
        control="meetingType"
        size="small"
        [options]="meetingTypeOptions()"
        placeholder="Select Type"
        [showClear]="true"
        styleClass="w-full"
        (onChange)="onMeetingTypeChange($event.value)"
        data-testid="meeting-type-filter"></lfx-select>
    </div>
  </div>
</div>
