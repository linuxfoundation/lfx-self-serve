<!--
  The branch markers sit on wrappers of their own, outside anything that depends on the meeting
  payload, so an e2e assertion can tell the two trees apart on a real `/meetings/:id` navigation
  even when the BFF has no such meeting and the tree renders its own error state.
-->
@if (v2Enabled()) {
  <div data-testid="meeting-details-gate-v2">
    <!-- Deferred so the v1 majority never downloads the v2 tree; see the component's doc comment. -->
    @defer (on immediate) {
      <lfx-meeting-details-page />
    } @error {
      <!-- The v2 chunk failed to load (a deploy mid-session, a dropped connection). v1 is in the
           eager chunk, so falling back to it never leaves the viewer on an empty page. -->
      <lfx-meeting-join />
    }
  </div>
} @else {
  <div data-testid="meeting-details-gate-v1">
    <lfx-meeting-join />
  </div>
}
