@if (visiblePeople().length > 0) {
  <div class="flex items-center justify-between gap-2 h-7" data-testid="attendee-preview">
    <div class="flex items-center min-w-0" role="img" [attr.aria-label]="accessibleSummary()">
      @for (person of visiblePeople(); track person.key; let first = $first) {
        <span class="inline-flex rounded-full ring-2 ring-white" [class.-ml-2]="!first" [pTooltip]="person.name" tooltipPosition="top" aria-hidden="true">
          <lfx-avatar [label]="person.name" [image]="person.avatarUrl || ''" shape="circle" styleClass="!w-6 !h-6 !text-[10px] bg-blue-50 text-blue-700" />
        </span>
      }
      @if (overflowCount() > 0) {
        <span class="ml-1.5 text-xs text-gray-600" aria-hidden="true" data-testid="attendee-preview-overflow">+{{ overflowCount() }}</span>
      }
    </div>
    <button
      type="button"
      class="text-xs text-blue-600 hover:text-blue-800 font-medium transition-colors whitespace-nowrap"
      (click)="onViewAll($event)"
      data-testid="attendee-preview-view-all">
      View all
    </button>
  </div>
}
