@if (!suppressed()) {
  <div
    class="fixed inset-x-0 bottom-0 z-40 flex flex-col gap-2 border-t border-gray-200 bg-white px-4 pt-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:hidden"
    role="region"
    aria-label="Meeting actions"
    data-testid="meeting-join-sticky-bar">
    @if (primaryAction() === 'resend') {
      <lfx-button
        class="w-full"
        styleClass="w-full"
        icon="fa-light fa-paper-plane"
        label="Resend Invite"
        severity="primary"
        [loading]="resending()"
        (onClick)="resendInvite.emit()"
        data-testid="sticky-resend-invite" />
    } @else if (primaryAction() === 'subscribe') {
      <lfx-button
        class="w-full"
        styleClass="w-full"
        icon="fa-light fa-calendar-plus"
        label="Subscribe to calendar"
        severity="primary"
        (onClick)="subscribeCalendar.emit()"
        data-testid="sticky-subscribe-calendar" />
    }
    @if (canJoin() && safeJoinHref()) {
      <lfx-button
        styleClass="w-full"
        label="Join Meeting"
        icon="fa-light fa-video"
        severity="success"
        [href]="safeJoinHref()"
        target="_blank"
        rel="noopener noreferrer"
        data-testid="sticky-join" />
    } @else if (canJoin() && joinUnavailable()) {
      <lfx-button styleClass="w-full" label="Join Meeting" icon="fa-light fa-video" severity="secondary" [disabled]="true" data-testid="sticky-join" />
    } @else if (canJoin()) {
      <lfx-button
        styleClass="w-full"
        label="Join Meeting"
        icon="fa-light fa-video"
        severity="success"
        [loading]="true"
        [disabled]="true"
        data-testid="sticky-join" />
    } @else {
      <lfx-button styleClass="w-full" [label]="unlockLabel()" icon="fa-light fa-clock" severity="secondary" [disabled]="true" data-testid="sticky-join" />
    }
  </div>
}
