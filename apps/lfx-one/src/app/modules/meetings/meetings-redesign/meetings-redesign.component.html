<!-- Exact [Npx] design values: rem undershoots at the 14px root; host rem margins cancel main-layout padding. -->
<!-- shortcut: no Create meeting in Me lens. revisit: when a project picker for create lands -->
<div class="flex bg-white min-[1025px]:min-h-[480px] min-[1025px]:overflow-hidden" [style.height.px]="columnHeight()" data-testid="meetings-redesign">
  <!-- Centre column -->
  <div
    #centre
    class="min-w-0 flex-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-600 min-[1025px]:overflow-y-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
    [attr.tabindex]="columnHeight() !== null ? 0 : null"
    (scroll)="updateScroll()"
    data-testid="meetings-redesign-centre">
    <!-- 28/40/56 centre padding; 16 at 640px and below -->
    <div
      class="mx-auto flex w-full max-w-[1440px] flex-col gap-[20px] px-[16px] pb-[16px] pt-[16px] min-[641px]:px-[40px] min-[641px]:pb-[56px] min-[641px]:pt-[28px]">
      <!-- Sticky page header; its negative margins cancel the padding above so it spans the column -->
      <div
        #header
        class="sticky z-10 -mx-[16px] -mb-[8px] -mt-[16px] flex flex-wrap items-start justify-between gap-[20px] bg-white px-[16px] pb-[12px] pt-[16px] min-[641px]:-mx-[40px] min-[641px]:-mt-[28px] min-[641px]:px-[40px] min-[641px]:pt-[28px]"
        [style.top.px]="stickyTop()"
        data-testid="meetings-redesign-header">
        <span
          class="pointer-events-none absolute inset-x-0 top-full h-[32px] bg-gradient-to-b from-white via-white/85 to-white/0 transition-opacity duration-200 motion-reduce:transition-none"
          [class.opacity-0]="!scrolled() || tabsStuck()"
          aria-hidden="true"
          data-testid="meetings-redesign-header-fade"></span>
        <div class="flex min-w-0 flex-col gap-[4px]">
          <h1 class="font-display text-[24px] font-light leading-tight text-gray-900" data-testid="meetings-redesign-title">Meetings</h1>
          <p class="text-[13px] text-gray-600" data-testid="meetings-redesign-description">
            Meetings you're invited to or organizing, across all your projects.
          </p>
        </div>
      </div>

      <!-- Right column content, folded into the centre at 1024px and below -->
      <div class="flex flex-col gap-[24px] min-[1025px]:hidden" data-testid="meetings-redesign-folded-rail">
        <ng-container [ngTemplateOutlet]="railTemplate" [ngTemplateOutletContext]="{ $implicit: 'folded' }" />
      </div>

      <!-- Sticky tabs bar; the fade moves here from the header once it is stuck -->
      <div
        #tabsBar
        class="sticky z-[5] -mt-[4px] flex flex-wrap items-end justify-between gap-x-[16px] gap-y-[12px] bg-white pb-[12px] pt-[4px]"
        [style.top.px]="stickyTop() + headerHeight()"
        data-testid="meetings-redesign-tabs-bar">
        <span
          class="pointer-events-none absolute inset-x-0 top-full h-[32px] bg-gradient-to-b from-white via-white/85 to-white/0 transition-opacity duration-200 motion-reduce:transition-none"
          [class.opacity-0]="!tabsStuck()"
          aria-hidden="true"
          data-testid="meetings-redesign-tabs-fade"></span>
        <lfx-ui-tabs
          class="min-w-[200px] flex-1"
          ariaLabel="Meetings"
          [idPrefix]="idPrefix"
          [tabs]="tabs"
          [(value)]="activeTab"
          data-testid="meetings-redesign-tabs" />
        <lfx-ui-search-input
          class="w-full min-[641px]:w-auto"
          placeholder="Search meetings"
          ariaLabel="Search meetings"
          [(value)]="search"
          data-testid="meetings-redesign-search" />
      </div>

      <!-- List area -->
      <div
        role="tabpanel"
        class="min-h-[240px] rounded-[12px] border border-dashed border-gray-200"
        [attr.id]="idPrefix + '-panel-' + activeTab()"
        [attr.aria-labelledby]="idPrefix + '-tab-' + activeTab()"
        data-testid="meetings-redesign-list"></div>
    </div>
  </div>

  <!-- Right column: fixed 360px, 24px padding -->
  <aside
    class="hidden w-[360px] flex-none flex-col gap-[24px] border-l border-gray-200 p-[24px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-600 min-[1025px]:flex min-[1025px]:overflow-y-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
    tabindex="0"
    aria-label="Meeting highlights"
    data-testid="meetings-redesign-right-column">
    <ng-container [ngTemplateOutlet]="railTemplate" [ngTemplateOutletContext]="{ $implicit: 'rail' }" />
  </aside>
</div>

<ng-template #railTemplate let-scope>
  @for (block of railBlocks; track block.key) {
    <section class="flex min-w-0 flex-col gap-[8px]" [attr.data-testid]="'meetings-redesign-' + scope + '-' + block.key">
      <h2 class="text-[11px] font-semibold uppercase leading-[16px] tracking-[.08em] text-gray-600">{{ block.label }}</h2>
      <div class="h-[112px] rounded-[12px] border border-gray-200 bg-gray-50"></div>
    </section>
  }
</ng-template>
