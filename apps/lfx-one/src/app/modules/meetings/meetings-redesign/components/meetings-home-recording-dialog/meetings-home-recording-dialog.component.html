<!-- Exact [Npx] values: rem undershoots at the 14px root. -->
<lfx-ui-modal heading="Meeting Recording" [subtitle]="title" data-testid="meetings-home-dialog-recording">
  <p class="text-[14px] leading-[20px] text-gray-700">Share this recording URL with others to view the meeting recording.</p>
  <div class="flex flex-col gap-[6px]">
    <span class="text-[13px] font-medium leading-[18px] text-gray-900">Recording Share URL</span>
    <div class="flex items-center gap-[8px]">
      <span
        class="min-w-0 flex-1 select-all truncate rounded-[6px] border border-gray-200 bg-gray-50 px-[12px] py-[6px] text-[14px] leading-[20px] text-gray-900"
        [title]="shareUrl"
        data-testid="meetings-home-dialog-recording-url"
        >{{ shareUrl }}</span
      >
      <lfx-ui-button variant="secondary" icon="fa-light fa-copy" (click)="copy()" data-testid="meetings-home-dialog-recording-copy">Copy</lfx-ui-button>
    </div>
  </div>

  <ng-container modalActions>
    <lfx-ui-button variant="secondary" (click)="close()" data-testid="meetings-home-dialog-recording-close">Close</lfx-ui-button>
    <lfx-ui-button icon="fa-light fa-arrow-up-right-from-square" (click)="view()" data-testid="meetings-home-dialog-recording-view"
      >View Recording</lfx-ui-button
    >
  </ng-container>
</lfx-ui-modal>
