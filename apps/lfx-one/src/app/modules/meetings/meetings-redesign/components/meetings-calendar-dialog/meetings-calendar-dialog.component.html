<!-- Exact [Npx] design values: rem undershoots at the 14px root. -->
<div class="flex-none bg-white px-[24px] pt-[24px]" data-testid="meetings-calendar-dialog-header">
  <div class="flex items-start justify-between gap-[12px]">
    <div class="flex min-w-0 flex-col gap-[6px]">
      <span class="inline-flex min-w-0 items-center gap-[6px] text-[12px] leading-[16px] text-gray-500" data-testid="meetings-calendar-dialog-context">
        <lfx-meeting-project-logo [src]="data.logoUrl" />
        <span class="min-w-0 break-words">{{ data.name }}</span>
      </span>
      <h2 class="m-0 font-display text-[24px] font-light leading-[1.2] text-gray-900" [id]="titleId" data-testid="meetings-calendar-dialog-title">Calendar</h2>
    </div>
    <lfx-ui-button
      class="-mr-[8px] -mt-[4px]"
      variant="tertiary"
      icon="fa-light fa-xmark"
      iconOnly
      ariaLabel="Close"
      (click)="close()"
      data-testid="meetings-calendar-dialog-close" />
  </div>
</div>

<lfx-meetings-calendar-grid
  class="flex min-h-0 flex-auto flex-col"
  [entries]="gridEntries()"
  [now]="data.now()"
  [(view)]="view"
  [(focus)]="focus"
  testIdPrefix="meetings-calendar-dialog"
  (entryClick)="open($event)">
  @if (upcomingFailed()) {
    <div
      class="mb-[8px] flex items-center gap-[8px] text-[12px] leading-[16px] text-gray-600"
      role="status"
      data-testid="meetings-calendar-dialog-upcoming-failed">
      <span>Couldn't load upcoming meetings.</span>
      <lfx-ui-button variant="tertiary" size="tiny" label="Retry" (click)="data.retryUpcoming()" data-testid="meetings-calendar-dialog-upcoming-retry" />
    </div>
  }
  @if (pastFailed()) {
    <div class="mb-[8px] flex items-center gap-[8px] text-[12px] leading-[16px] text-gray-600" role="status" data-testid="meetings-calendar-dialog-past-failed">
      <span>Couldn't load older meetings.</span>
      <lfx-ui-button variant="tertiary" size="tiny" label="Retry" (click)="retryPast()" data-testid="meetings-calendar-dialog-past-retry" />
    </div>
  }
</lfx-meetings-calendar-grid>
