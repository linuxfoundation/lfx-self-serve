<!-- Exact [Npx] design values: a 256px block, 74px in a centre column of 900px or less; the page's centre is the @container. -->
@if (hasRecording() || hasSummary()) {
  <div class="-mr-[4px] flex w-[74px] flex-none items-center justify-end gap-[10px] @[901px]:w-[256px]" data-testid="meetings-home-row-artifacts">
    @if (hasRecording()) {
      <lfx-ui-button
        class="hidden @[901px]:inline-block"
        variant="secondary"
        icon="fa-light fa-circle-play"
        [loading]="loadingRecording()"
        (click)="openRecording()"
        data-testid="meetings-home-row-recording">
        Recording
      </lfx-ui-button>
      <lfx-ui-button
        class="@[901px]:hidden"
        variant="secondary"
        icon="fa-light fa-circle-play"
        ariaLabel="Recording"
        lfxUiTooltip="Recording"
        iconOnly
        [loading]="loadingRecording()"
        (click)="openRecording()"
        data-testid="meetings-home-row-recording-icon" />
    }
    @if (hasSummary()) {
      <lfx-ui-button
        class="hidden @[901px]:inline-block"
        variant="secondary"
        icon="fa-light fa-sparkles"
        [loading]="loadingSummary()"
        (click)="openSummary()"
        data-testid="meetings-home-row-summary">
        AI Summary
      </lfx-ui-button>
      <lfx-ui-button
        class="@[901px]:hidden"
        variant="secondary"
        icon="fa-light fa-sparkles"
        ariaLabel="AI Summary"
        lfxUiTooltip="AI Summary"
        iconOnly
        [loading]="loadingSummary()"
        (click)="openSummary()"
        data-testid="meetings-home-row-summary-icon" />
    }
  </div>
}
