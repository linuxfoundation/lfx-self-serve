<span
  class="flex flex-none items-center justify-center font-semibold uppercase leading-none tracking-[.08em]"
  [class]="monthClasses()"
  [attr.data-testid]="testIdPrefix() + '-date-month'"
  >{{ date() | date: 'MMM' }}</span
>
<span class="flex flex-auto items-center justify-center leading-none text-gray-900" [class]="dayClasses()" [attr.data-testid]="testIdPrefix() + '-date-day'">{{
  date() | date: 'd'
}}</span>
<!-- Restricted and Private together: two stacked 8px dots, no icons -->
@let stacked = badges().length > 1;
<span class="absolute flex" [class]="stacked ? '-right-[7px] -top-[7px] flex-col gap-[2px]' : '-right-[11px] -top-[11px]'">
  @for (badge of badges(); track badge.kind) {
    <span
      role="img"
      tabindex="0"
      class="box-content inline-flex cursor-default items-center justify-center rounded-full border-2 border-white leading-none text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
      [class]="visibilityBg[badge.kind] + (stacked ? ' h-[8px] w-[8px]' : ' h-[17px] w-[17px]')"
      [attr.aria-label]="badge.title"
      [lfxUiTooltip]="badge.description ?? ''"
      [lfxUiTooltipTitle]="badge.title"
      [attr.data-testid]="testIdPrefix() + '-visibility-' + badge.kind">
      @if (!stacked) {
        <i class="text-[9px]" [class]="badge.icon" aria-hidden="true"></i>
      }
    </span>
  }
</span>
