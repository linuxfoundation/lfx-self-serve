<!-- Exact [Npx] values: rem undershoots at the 14px root. -->
<lfx-ui-modal heading="Meeting Summary" [subtitle]="title" sticky data-testid="meetings-home-dialog-summary">
  <span class="flex flex-wrap items-center gap-[6px]">
    <lfx-ui-badge tone="feature" size="sm"><i class="fa-light fa-sparkles" aria-hidden="true"></i>AI Summary</lfx-ui-badge>
    @if (awaitingReview()) {
      <lfx-ui-badge tone="warning" size="sm" data-testid="meetings-home-dialog-summary-pending">Awaiting your review</lfx-ui-badge>
    }
  </span>

  @if (editing()) {
    <!-- The library textarea is 80px tall by default; a summary needs room. -->
    <lfx-ui-textarea
      class="[&_textarea]:min-h-[320px] [&_textarea]:font-mono"
      label="Edit Summary"
      placeholder="Edit the meeting summary..."
      [(value)]="draft"
      [disabled]="saving()"
      data-testid="meetings-home-dialog-summary-editor" />
  } @else if (content()) {
    <lfx-markdown-renderer class="text-[14px] leading-[21px] text-gray-700" [content]="content()" data-testid="meetings-home-dialog-summary-content" />
  } @else {
    <p class="py-[16px] text-center text-[14px] leading-[20px] text-gray-500" data-testid="meetings-home-dialog-summary-empty">No summary content available.</p>
  }

  <ng-container modalActions>
    @if (editing()) {
      <lfx-ui-button variant="secondary" [disabled]="saving()" (click)="cancelEdit()" data-testid="meetings-home-dialog-summary-cancel">Cancel</lfx-ui-button>
      <lfx-ui-button [loading]="saving()" (click)="save()" data-testid="meetings-home-dialog-summary-save">Save</lfx-ui-button>
    } @else {
      @if (!readOnly) {
        <span class="mr-auto flex items-center gap-[12px]">
          <lfx-ui-button variant="secondary" icon="fa-light fa-pen" [disabled]="approving()" (click)="edit()" data-testid="meetings-home-dialog-summary-edit"
            >Edit</lfx-ui-button
          >
          @if (summary().approved) {
            <lfx-ui-badge tone="success" data-testid="meetings-home-dialog-summary-approved"
              ><i class="fa-light fa-circle-check" aria-hidden="true"></i>Approved</lfx-ui-badge
            >
          } @else {
            <lfx-ui-button icon="fa-light fa-check" [loading]="approving()" (click)="approve()" data-testid="meetings-home-dialog-summary-approve"
              >Approve</lfx-ui-button
            >
          }
        </span>
      }
      <lfx-ui-button variant="secondary" (click)="close()" data-testid="meetings-home-dialog-summary-close">Close</lfx-ui-button>
    }
  </ng-container>
</lfx-ui-modal>
