<!-- Exact [Npx] design values: rem undershoots at the 14px root. -->
@if (visible()) {
  <span class="inline-flex flex-none items-center gap-[6px]" [attr.aria-busy]="!!saving() || null" data-testid="meetings-home-rsvp">
    @if (current(); as answer) {
      <!-- lfx-ui-badge has no trigger mode, so a plain button opens the menu through the CDK trigger, as lfx-ui-button does. -->
      <button
        #statusTrigger
        type="button"
        class="inline-flex rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 disabled:cursor-wait"
        [cdkMenuTriggerFor]="busy() ? null : rsvpMenu"
        [cdkMenuPosition]="menuPositions"
        [disabled]="busy()"
        [attr.aria-label]="'Your RSVP: ' + answer.label + '. Change'"
        data-testid="meetings-home-rsvp-status">
        <!-- 112×28 per the design, matching the small RSVP buttons across answers; chevron at the right edge. -->
        <lfx-ui-badge class="w-[112px] !h-ui-xsmall" [tone]="answer.tone">
          @if (saving()) {
            <lfx-ui-spinner tone="current" [size]="12" label="Saving RSVP" />
          } @else {
            <i [class]="answer.icon + ' ' + iconColor[answer.response]" aria-hidden="true"></i>
          }
          {{ answer.label }}
          <i class="fa-light fa-chevron-down ml-auto opacity-70" aria-hidden="true"></i>
        </lfx-ui-badge>
      </button>
    } @else {
      @for (choice of choices; track choice.response) {
        <lfx-ui-button
          variant="secondary"
          [size]="size()"
          [icon]="choice.buttonIcon + ' ' + iconColor[choice.response]"
          [ariaLabel]="'RSVP ' + choice.action + ' to ' + row().title"
          [loading]="saving() === choice.response"
          [disabled]="busy() && saving() !== choice.response"
          (click)="choose(choice.response)"
          [attr.data-testid]="'meetings-home-rsvp-' + choice.response">
          {{ choice.action }}
        </lfx-ui-button>
      }
    }
  </span>
}

<ng-template #rsvpMenu>
  <lfx-ui-menu ariaLabel="Change RSVP" data-testid="meetings-home-rsvp-menu">
    @for (choice of choices; track choice.response) {
      <lfx-ui-menu-item
        [icon]="choice.icon + ' ' + iconColor[choice.response]"
        [trailingIcon]="choice.response === current()?.response ? 'fa-light fa-check text-blue-600' : ''"
        (triggered)="choose(choice.response)"
        [attr.data-testid]="'meetings-home-rsvp-menu-' + choice.response">
        {{ choice.label }}
      </lfx-ui-menu-item>
    }
  </lfx-ui-menu>
</ng-template>
