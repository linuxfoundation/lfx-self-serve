<div data-testid="vote-permalink">
  @if (state().notFound) {
    <!-- Missing or not viewable — identical on purpose, so the page never confirms a vote exists. -->
    <lfx-not-found />
  } @else if (state().error) {
    <!-- Transient failure (non-404) — not rendered as a 404 -->
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="mt-6 rounded-xl border border-gray-200 bg-white" data-testid="vote-permalink-error">
        <div class="flex flex-col items-center gap-3 py-16 text-center">
          <div class="flex h-24 w-24 items-center justify-center rounded-full bg-red-50">
            <i class="fa-light fa-triangle-exclamation text-4xl text-red-400" aria-hidden="true"></i>
          </div>
          <h1 class="text-gray-900">Something went wrong</h1>
          <p class="max-w-lg text-gray-600">We couldn't load this vote right now. Please try again.</p>
          <lfx-button label="Retry" icon="fa-light fa-arrow-rotate-left" size="small" (onClick)="retry()" data-testid="vote-permalink-retry" />
        </div>
      </div>
    </div>
  } @else if (state().target; as target) {
    <lfx-votes-dashboard [permalinkTarget]="target" (permalinkClosed)="onPermalinkClosed()" />
  } @else {
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="mt-3 flex flex-col gap-4" data-testid="vote-permalink-loading">
        <p-skeleton width="12rem" height="2rem" />
        <p-skeleton width="min(28rem, 100%)" height="1rem" />
      </div>
    </div>
  }
</div>
