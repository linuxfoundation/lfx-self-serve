<div class="p-4 bg-slate-50 rounded-lg border border-slate-200 flex flex-col gap-3" [attr.data-testid]="testId()">
  <div class="flex items-center justify-between text-sm text-slate-600">
    <div class="text-center flex-1">
      <p class="text-xs text-slate-500">Total Participants</p>
      <p class="font-semibold text-slate-900 text-lg">{{ stats().eligibleVoters }}</p>
    </div>
    <div class="text-center flex-1">
      <p class="text-xs text-slate-500">Total Responses</p>
      <p class="font-semibold text-slate-900 text-lg">{{ stats().totalResponses }}</p>
    </div>
    <div class="text-center flex-1">
      <p class="text-xs text-slate-500">Response Rate</p>
      <p class="font-semibold text-blue-600 text-lg">{{ stats().participationRate }}%</p>
    </div>
    @if (showAbstained()) {
      <!-- Abstentions count as cast responses upstream but are excluded from choice tallies; shown when the vote allows abstain or results report abstentions. -->
      <div class="text-center flex-1" data-testid="vote-results-abstained-stat">
        <p class="text-xs text-slate-500">Abstained</p>
        <p class="font-semibold text-slate-900 text-lg" data-testid="vote-results-abstained-value">{{ abstainedHeld() ? '—' : stats().abstainedVoters }}</p>
      </div>
    }
  </div>

  <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
    <div class="h-full bg-blue-500 transition-all" [style.width.%]="stats().participationRate"></div>
  </div>
</div>
