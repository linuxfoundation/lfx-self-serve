<div class="flex flex-col items-center gap-2" data-testid="vote-send-ballots">
  <lfx-button
    label="Send ballots now"
    icon="fa-light fa-paper-plane"
    severity="secondary"
    [size]="buttonSize()"
    [outlined]="compact()"
    [styleClass]="buttonStyleClass()"
    [loading]="busy()"
    [disabled]="busy() || cooling() || everyoneVoted()"
    [tooltip]="everyoneVoted() ? 'Everyone has voted' : undefined"
    (onClick)="onClick()"
    data-testid="vote-send-ballots-button" />
  @if (everyoneVoted()) {
    <span class="sr-only" data-testid="vote-send-ballots-everyone-voted">Everyone has voted</span>
  }
  @if (compact()) {
    <!-- The header row shares one baseline, so the status is announced here and shown by the success toast instead. -->
    <span class="sr-only" role="status" data-testid="vote-send-ballots-live">{{ sentMessage() }}</span>
  } @else if (sent(); as result) {
    <p class="m-0 text-sm text-gray-600 text-center" role="status" data-testid="vote-send-ballots-success">
      {{ sentMessage() }} · {{ result.at | date: 'HH:mm' }}
    </p>
  }
</div>
<p-confirmDialog (onHide)="onConfirmHidden()" />
