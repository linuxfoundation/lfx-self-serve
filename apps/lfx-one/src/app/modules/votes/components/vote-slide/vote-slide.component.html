<div class="flex flex-col justify-between bg-white text-slate-900 p-24 box-border" [style.width.px]="width" [style.height.px]="height" data-testid="vote-slide">
  <div class="flex items-center gap-4 self-start">
    <img src="/images/lfx-one-logo.svg" alt="LFX" class="h-14 w-auto" />
    <p class="text-3xl font-semibold text-slate-600">Board vote · LFX Self Serve</p>
  </div>

  <div class="flex items-center justify-between gap-24">
    <div class="flex flex-col gap-10 min-w-0">
      <h1 class="text-7xl font-semibold leading-tight break-words">{{ title() }}</h1>
      <p class="text-4xl text-slate-600">Scan the code or open the link to cast your ballot. Voting closes when the chair calls it.</p>
      <div class="flex flex-col gap-2">
        <p class="text-2xl uppercase tracking-wide text-slate-500">Vote link</p>
        <p class="text-4xl font-semibold break-all text-blue-700">{{ link() }}</p>
      </div>
    </div>
    <lfx-vote-qr [value]="link()" [label]="'QR code for ' + link()" class="shrink-0 w-[520px]" />
  </div>

  <p class="text-3xl text-slate-500">Only eligible voters can cast. Sign in with your LF account.</p>
</div>
