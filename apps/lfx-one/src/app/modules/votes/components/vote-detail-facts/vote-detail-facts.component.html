<div class="flex flex-col gap-6" data-testid="vote-detail-facts">
  <lfx-card data-testid="vote-detail-facts-details">
    <div class="flex flex-col gap-3">
      <h2 class="text-base font-semibold text-gray-900">Vote details</h2>
      <dl class="flex flex-col divide-y divide-gray-100 text-sm">
        <div class="flex items-start justify-between gap-4 py-2" data-testid="vote-detail-facts-created">
          <dt class="text-gray-500">Created</dt>
          <dd class="text-right font-medium text-gray-900">{{ createdText() }}</dd>
        </div>
        <div class="flex items-start justify-between gap-4 py-2" data-testid="vote-detail-facts-comments">
          <dt class="text-gray-500">Comments</dt>
          <dd class="text-right font-medium text-gray-900">{{ commentsText() }}</dd>
        </div>
      </dl>
    </div>
  </lfx-card>

  <lfx-card data-testid="vote-detail-facts-visibility">
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <i class="fa-light fa-lock text-gray-500" aria-hidden="true"></i>
        <h2 class="text-base font-semibold text-gray-900">Visibility at a glance</h2>
      </div>
      <p class="text-sm text-gray-600" data-testid="vote-detail-facts-visibility-summary">{{ visibilityHeadline() }}</p>
      <div class="relative w-fit">
        <lfx-button
          label="More about visibility"
          [text]="true"
          size="small"
          (onClick)="toggleVisibilityRules($event, visibilityPopover)"
          [ariaExpanded]="visibilityOpen()"
          ariaHaspopup="dialog"
          ariaControls="vote-detail-facts-visibility-rules"
          data-testid="vote-detail-facts-visibility-more" />
        <p-popover
          #visibilityPopover
          ariaLabel="Visibility rules"
          [style]="{ width: '320px' }"
          (onShow)="visibilityOpen.set(true)"
          (onHide)="visibilityOpen.set(false)"
          data-testid="vote-detail-facts-visibility-popover">
          <ul
            id="vote-detail-facts-visibility-rules"
            class="flex flex-col gap-2 text-sm text-gray-600"
            tabindex="-1"
            autofocus
            (keydown.escape)="closeVisibilityRules(visibilityPopover)">
            @for (rule of visibilityRules(); track rule) {
              <li data-testid="vote-detail-facts-visibility-rule">{{ rule }}</li>
            }
          </ul>
        </p-popover>
      </div>
    </div>
  </lfx-card>
</div>
