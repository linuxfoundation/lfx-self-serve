<!-- Mirrors `meeting-create-menu.component.html`, which explains each class: `mt-1.5` offsets the
     body-appended panel off its trigger, the paddings give the heading and rows one shared left edge,
     and `max-w-[calc(100vw-16px)]` keeps the fixed-width panel inside the 8px gutter on a phone. -->
<lfx-menu
  #menu
  [model]="menuItems"
  [popup]="true"
  appendTo="body"
  (onShow)="onShow()"
  (onHide)="onHide()"
  styleClass="mt-1.5 w-[22rem] max-w-[calc(100vw-16px)] p-1.5 [&_.p-menu-list]:gap-0 [&_.p-menu-list]:p-0 [&_.p-menu-submenu-label]:p-2">
  <ng-template #submenuheader let-item>
    <span class="text-[0.6875rem] font-semibold uppercase tracking-wide text-gray-500">{{ item.label }}</span>
  </ng-template>
  <ng-template #item let-item>
    <!-- A `<button>` so PrimeNG's Enter handling finds something to click (see the meeting menu);
         no `(click)` of our own, since the wrapper PrimeNG renders already runs `item.command`. -->
    <button type="button" tabindex="-1" class="flex w-full cursor-pointer items-start gap-3 p-2 text-left" [attr.data-testid]="item.testId">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg" [class]="item.tileClass">
        <i class="text-sm" [class]="item.icon" aria-hidden="true"></i>
      </span>
      <span class="flex min-w-0 flex-col gap-0.5">
        <span class="text-sm font-medium text-gray-900">{{ item.label }}</span>
        <span class="whitespace-normal text-xs leading-snug text-gray-500">{{ item.description }}</span>
      </span>
    </button>
  </ng-template>
</lfx-menu>
