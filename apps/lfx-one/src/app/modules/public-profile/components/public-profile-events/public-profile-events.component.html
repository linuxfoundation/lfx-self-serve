<lfx-card>
  <div class="flex items-center gap-2 mb-4">
    <i class="fa-light fa-calendar-days text-gray-500 text-xs"></i>
    <h2 class="text-gray-600 text-sm font-normal">Events</h2>
  </div>

  <div class="flex flex-col gap-3" data-testid="events-list">
    @for (event of events(); track event.ID) {
      <div class="flex items-start gap-3" data-testid="event-item">
        <div class="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center flex-shrink-0 mt-0.5">
          <i class="fa-light fa-calendar-days text-emerald-500 text-sm"></i>
        </div>
        <div class="flex flex-col gap-0.5 min-w-0">
          @if (event.EventURL) {
            <a
              [href]="event.EventURL"
              target="_blank"
              rel="noopener noreferrer"
              class="text-sm font-medium text-blue-600 hover:underline break-words"
              data-testid="event-link"
              >{{ event.Name }}</a
            >
          } @else {
            <p class="text-sm font-medium text-gray-900 break-words">{{ event.Name }}</p>
          }
          @if (event.StartDate || event.EndDate) {
            <p class="text-xs text-gray-400">{{ event.StartDate | publicProfileDateRange: event.EndDate }}</p>
          }
          @if (event.LocationName) {
            <p class="text-xs text-gray-500 flex items-center gap-1">
              <i class="fa-light fa-location-dot"></i>
              <span class="break-words">{{ event.LocationName }}</span>
            </p>
          }
        </div>
      </div>
    }
  </div>
</lfx-card>
