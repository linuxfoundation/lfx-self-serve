<div class="bg-white rounded-[12px] border border-gray-200 overflow-hidden" data-testid="hero-card">
  <!-- Banner -->
  <div class="h-24 sm:h-32 bg-gradient-to-r from-blue-500 to-violet-500"></div>

  <div class="px-4 sm:px-8 pb-6">
    <!-- Avatar overlapping the banner -->
    <div class="-mt-12 sm:-mt-16 mb-4">
      <lfx-avatar
        [image]="avatarImage()"
        [label]="name()"
        shape="circle"
        [style]="{ width: '112px', height: '112px', fontSize: '2.5rem' }"
        styleClass="border-4 border-white bg-gray-100 text-gray-600 shadow-sm"
        data-testid="hero-avatar"></lfx-avatar>
    </div>

    <!-- Name + headline -->
    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-semibold text-gray-900" data-testid="hero-name">{{ name() }}</h1>
      @if (headline()) {
        <p class="text-sm text-gray-500 font-medium" data-testid="hero-headline">{{ headline() }}</p>
      }
    </div>

    <!-- Social links -->
    @if (socials().length) {
      <div class="flex items-center gap-3 mt-4" data-testid="hero-socials">
        @for (social of socials(); track social.label) {
          <a
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="social.label"
            [attr.data-testid]="'hero-social-' + social.label"
            class="w-9 h-9 rounded-full border border-gray-200 flex items-center justify-center text-gray-500 hover:text-blue-600 hover:border-blue-300 transition-colors">
            <i [class]="social.icon"></i>
          </a>
        }
      </div>
    }

    <!-- Bio -->
    @if (bio()) {
      <div class="mt-4 text-sm text-gray-700" data-testid="hero-bio">
        <lfx-expandable-text [maxHeight]="120">{{ bio() }}</lfx-expandable-text>
      </div>
    }

    <!-- Visitor sign-in CTA -->
    @if (!authenticated()) {
      <div
        class="mt-6 bg-blue-50 border border-blue-500/40 rounded px-3 py-2 flex flex-wrap items-center justify-between gap-3"
        data-testid="hero-sign-in-banner">
        <div class="flex items-center gap-3">
          <i class="fa-light fa-arrow-right-to-bracket text-blue-600 text-xl"></i>
          <div>
            <p class="font-semibold text-sm text-blue-900">Sign in with your LFX account</p>
            <p class="text-xs text-gray-600">Manage your own public profile and connect across the Linux Foundation.</p>
          </div>
        </div>
        <lfx-button
          class="w-full md:w-auto"
          styleClass="w-full md:w-auto"
          size="small"
          label="Sign In"
          icon="fa-light fa-arrow-right-to-bracket"
          severity="info"
          (onClick)="signIn.emit()"
          data-testid="hero-sign-in-cta"></lfx-button>
      </div>
    }
  </div>
</div>
