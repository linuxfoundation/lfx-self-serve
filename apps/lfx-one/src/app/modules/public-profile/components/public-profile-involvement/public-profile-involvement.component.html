<!-- Exact [Npx] design values throughout: rem undershoots at the 14px root. -->
<lfx-profile-grid [total]="items().length" [(expanded)]="expanded" testId="public-profile-involvement-grid">
  @for (item of shown(); track item.id) {
    <lfx-profile-pill
      [name]="item.name"
      [imageUrl]="item.logo"
      [hoverCard]="card"
      [hoverCardWidth]="340"
      hoverCardPadding="none"
      [testId]="'public-profile-project-' + item.id">
      <ng-container *ngTemplateOutlet="roleBadge" />
      @if (item.years) {
        <span class="whitespace-nowrap" data-testid="public-profile-involvement-years">{{ item.years }}</span>
      }
    </lfx-profile-pill>

    <ng-template #card>
      <!-- In the page's theme, since the card opens outside it. -->
      <div
        class="flex flex-col items-start gap-[14px] bg-ui-background-100 p-[16px] text-ui-neutral-900"
        [attr.data-theme]="theme()"
        [attr.data-testid]="'public-profile-project-card-' + item.id">
        <div class="flex min-w-0 flex-row items-center gap-[12px]">
          <span class="flex size-[40px] flex-none items-center justify-center overflow-hidden rounded-[12px] border border-ui-neutral-200">
            @if (item.logo) {
              <img class="size-[40px] object-contain" [src]="item.logo" alt="" referrerpolicy="no-referrer" />
            }
          </span>
          <span class="flex min-w-0 flex-col items-start gap-[4px]">
            <!-- Wraps rather than cutting off: the card is not focusable, so a tooltip couldn't show the rest. -->
            <span class="max-w-full break-words text-[15px] font-semibold leading-[20px]">{{ item.name }}</span>
            <ng-container *ngTemplateOutlet="roleBadge" />
          </span>
        </div>
        <dl class="m-0 grid w-full grid-cols-3 gap-[8px]">
          <ng-container *ngTemplateOutlet="stat; context: { label: copy.commits, value: item.commits, key: 'commits' }" />
          <ng-container *ngTemplateOutlet="stat; context: { label: copy.prs, value: item.prs, key: 'prs' }" />
          <ng-container *ngTemplateOutlet="stat; context: { label: copy.issues, value: item.issues, key: 'issues' }" />
        </dl>
        @if (item.years) {
          <span class="flex flex-row items-center gap-[6px] text-[12px] leading-[16px] text-ui-neutral-500">
            <i class="fa-light fa-clock" aria-hidden="true"></i>
            <span>{{ item.years }}</span>
          </span>
        }
      </div>
    </ng-template>
  }
</lfx-profile-grid>

<!-- Every project reads Contributor until the profile carries real roles. -->
<ng-template #roleBadge>
  <lfx-ui-badge variant="line" size="sm"><i slot="icon" class="fa-light fa-code" aria-hidden="true"></i>{{ copy.contributor }}</lfx-ui-badge>
</ng-template>

<!-- The number reads above its label. -->
<ng-template #stat let-label="label" let-value="value" let-key="key">
  <div class="flex flex-col-reverse gap-[2px] rounded-[10px] bg-ui-neutral-50 px-[10px] py-[8px]" [attr.data-testid]="'public-profile-project-stat-' + key">
    <dt class="text-[12px] leading-[16px] text-ui-neutral-500">{{ label }}</dt>
    <dd class="m-0 text-[15px] font-semibold leading-[20px]">{{ value | number }}</dd>
  </div>
</ng-template>
