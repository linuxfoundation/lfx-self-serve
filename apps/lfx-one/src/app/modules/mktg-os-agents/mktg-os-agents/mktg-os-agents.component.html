<div class="container mx-auto px-4 sm:px-6 lg:px-8" data-testid="mktg-os-agents-page">
  <div class="flex flex-col gap-5">
    <!-- Page Header -->
    <div class="flex items-start justify-between mt-3">
      <div>
        <h1 class="font-display font-light text-2xl" data-testid="mktg-os-agents-title">{{ labels.marketplaceTitle }}</h1>
        <p class="mt-1 text-sm text-gray-500" data-testid="mktg-os-agents-description">{{ labels.marketplaceDescription }}</p>
      </div>
    </div>

    <!-- Search -->
    <div class="max-w-md" data-testid="mktg-os-agents-search">
      <lfx-input-text
        id="mktg-os-agents-search-input"
        [form]="searchForm"
        control="search"
        placeholder="Search agents"
        icon="fa-light fa-magnifying-glass"
        dataTest="mktg-os-agents-search-input" />
    </div>

    <!-- Agent grid -->
    @if (tiles().length > 0) {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" data-testid="mktg-os-agents-results">
        @for (tile of tiles(); track tile.agent.id) {
          <button
            type="button"
            class="flex flex-col gap-3 text-left p-4 bg-white border border-gray-200 border-l-4 rounded-lg transition hover:border-gray-300 hover:shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:border-gray-200 disabled:hover:shadow-none"
            [ngClass]="tile.borderClass"
            [disabled]="tile.disabled"
            [attr.aria-disabled]="tile.disabled"
            [attr.data-testid]="'mktg-os-agents-tile-' + tile.agent.id"
            [attr.aria-label]="tile.ariaLabel"
            (click)="onSelectAgent(tile)">
            <div class="flex items-center gap-3">
              <span class="flex items-center justify-center w-10 h-10 rounded-lg" [ngClass]="tile.iconClass">
                <i [class]="tile.agent.icon + ' text-lg'" aria-hidden="true"></i>
              </span>
              <div class="flex flex-col">
                <span class="text-xs text-gray-400">Agent {{ tile.agent.number }}</span>
                <span class="font-medium text-sm text-gray-900">{{ tile.agent.name }}</span>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5">
              @for (tag of tile.agent.tags; track tag) {
                <lfx-tag [value]="tag" severity="secondary" [outlined]="true" />
              }
              @if (tile.agent.status !== 'active') {
                <lfx-tag value="Coming soon" severity="secondary" [attr.data-testid]="'mktg-os-agents-coming-soon-' + tile.agent.id" />
              }
              <!-- Dependency gating (dec-agent-dependency-gating): honest tag on cards disabled until their dependency's stored output exists. -->
              @for (dependencyName of tile.missingDependencyNames; track dependencyName) {
                <lfx-tag [value]="'Requires ' + dependencyName" severity="secondary" [attr.data-testid]="'mktg-os-agents-requires-' + tile.agent.id" />
              }
              @if (storedVersions()[tile.agent.id]; as version) {
                <lfx-tag
                  [value]="'v' + version + ' generated'"
                  severity="success"
                  [outlined]="true"
                  icon="fa-light fa-check"
                  [attr.data-testid]="'mktg-os-agents-generated-' + tile.agent.id" />
              }
            </div>

            <p class="text-xs text-gray-500 line-clamp-3">{{ tile.agent.description }}</p>
          </button>
        }
      </div>
    } @else {
      <lfx-empty-state
        icon="fa-light fa-magnifying-glass"
        title="No agents match your search"
        subtitle="Try a different name, tag, or capability."
        [withCard]="true"
        data-testid="mktg-os-agents-empty" />
    }
  </div>
</div>
