<div class="mx-auto flex max-w-screen-2xl flex-col gap-6 px-4 sm:px-6 lg:px-8" data-testid="mktg-kit-placeholder-page">
  <lfx-mktg-breadcrumb [page]="{ kind: 'kit-tab', tab: title === 'Requests' ? 'requests' : 'access' }" />
  <lfx-mktg-kit-header [projectName]="projectName()" titleTestId="mktg-kit-placeholder-title" />
  <lfx-mktg-kit-tabs />
  <section class="flex flex-col gap-2 rounded-lg border border-dashed border-gray-300 bg-white p-6" data-testid="mktg-kit-placeholder-empty">
    <h2 class="text-lg font-semibold">{{ title }} · Coming soon</h2>
    <p class="text-sm text-gray-500">{{ title }} comes with its own item. There is nothing to manage here yet.</p>
  </section>
</div>
