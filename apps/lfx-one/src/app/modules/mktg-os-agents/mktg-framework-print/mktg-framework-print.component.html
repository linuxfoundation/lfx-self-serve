@let v = view();
@let c = cover();
<!-- The deck's frames are block children of a plain block root, outside the portrait prints' `.lfx-framework-print`
     (its side padding would push a page frame off the sheet): each frame names its own page (mktg-deck). -->
<div class="lfx-framework-pages" [attr.data-brand]="v.brand.source" [attr.data-pages]="pageCount()" data-testid="mktg-framework-print">
  <!-- The cover: the deck's (framework-print.ts coverSlide) — the title at the framework's size over the tagline, the project's
       eyebrow, the version top right, the accent bar, the rule and the line of sections. No logo: the deck's cover draws none. -->
  <lfx-mktg-print-cover
    [look]="look()"
    [title]="c.title"
    [titleSize]="coverTitleSize"
    [subtitle]="c.subtitle"
    [eyebrow]="c.eyebrow"
    [topRight]="c.topRight"
    [els]="c.els"
    data-testid="framework-print-cover" />
  <!-- The content pages from the shared page plan, each in its section's running head, with its number in the footer. -->
  @for (page of pages(); track $index) {
    <lfx-mktg-print-page
      [page]="page"
      [look]="look()"
      [logo]="v.brand.logoOnLight"
      [attr.data-page]="page.footer?.number"
      [attr.data-section]="sectionOf(page)"
      data-testid="framework-print-page" />
  }
</div>
