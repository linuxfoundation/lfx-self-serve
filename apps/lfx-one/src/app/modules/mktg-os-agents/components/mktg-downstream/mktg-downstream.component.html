@if (loading()) {
  <p role="status" class="text-sm text-gray-500" data-testid="mktg-downstream-loading">Checking downstream assets…</p>
} @else if (stale().length || failed()) {
  <section
    class="flex flex-col gap-3 rounded-xl border p-4"
    [class.border-amber-200]="stale().length > 0"
    [class.bg-amber-50]="stale().length > 0"
    [class.border-gray-200]="failed()"
    data-testid="mktg-downstream-card"
    aria-label="Downstream">
    <h2 class="text-base font-bold text-gray-900">Downstream</h2>
    @if (failed()) {
      <p role="alert" class="text-sm" data-testid="mktg-downstream-error">Downstream assets could not be checked.</p>
      <lfx-button label="Try again" [outlined]="true" (onClick)="retry()" data-testid="mktg-downstream-retry" />
    } @else {
      <p class="text-sm leading-relaxed" data-testid="mktg-downstream-copy">{{ copy() }}</p>
      <lfx-button
        [label]="buttonLabel()"
        [outlined]="true"
        styleClass="border-amber-700 text-amber-700 bg-white"
        (onClick)="rebuild()"
        [disabled]="!writer() || user.impersonating()"
        data-testid="mktg-downstream-rebuild" />
    }
  </section>
}
