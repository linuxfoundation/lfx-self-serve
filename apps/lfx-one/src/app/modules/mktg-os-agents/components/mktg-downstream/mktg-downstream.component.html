@if (loading() || failed() || stale().length) {
  <section
    class="flex flex-col gap-3 rounded-xl border p-4"
    [class.min-h-56]="loading()"
    [class.bg-white]="!stale().length"
    [class.border-amber-200]="stale().length > 0"
    [class.bg-amber-50]="stale().length > 0"
    [class.border-gray-200]="!stale().length"
    data-testid="mktg-downstream-card"
    aria-label="Downstream">
    @if (retrying()) {
      <!-- One quiet connection-state line: over the skeleton on a first read, above a listing that is already loaded. -->
      <p role="status" class="text-xs text-gray-500" data-testid="mktg-downstream-retrying">{{ retryingText }}</p>
    }
    @if (loading()) {
      <lfx-mktg-skeleton variant="card" [rows]="2" data-testid="mktg-downstream-loading" />
    } @else {
      <h2 class="text-base font-bold text-gray-900">Downstream</h2>
      @if (failed()) {
        <p role="alert" class="text-sm text-red-700" data-testid="mktg-downstream-error">{{ failedText }}</p>
      } @else if (stale().length) {
        <p class="text-sm leading-relaxed" data-testid="mktg-downstream-copy">{{ copy() }}</p>
        <lfx-button
          [label]="buttonLabel()"
          [outlined]="true"
          styleClass="border-amber-700 text-amber-700 bg-white"
          (onClick)="rebuild()"
          [disabled]="!writer() || user.impersonating()"
          data-testid="mktg-downstream-rebuild" />
      }
    }
  </section>
}
