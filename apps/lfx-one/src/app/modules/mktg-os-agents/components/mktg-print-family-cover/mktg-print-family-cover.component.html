@let c = cover();
<lfx-mktg-print-cover
  [look]="look()"
  [logo]="view().brand.logoOnDark"
  [eyebrow]="c.eyebrow"
  [topRight]="c.date"
  [title]="c.title"
  [titleSize]="titleSize"
  [titleBox]="boxes.title"
  [subtitle]="c.subtitle"
  [subtitleBox]="boxes.subtitle"
  [footerLeft]="c.footerLeft"
  [footerRight]="c.footerRight"
  data-testid="family-export-print-cover" />
