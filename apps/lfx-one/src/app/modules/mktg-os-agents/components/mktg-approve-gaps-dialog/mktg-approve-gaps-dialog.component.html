<div class="flex flex-col gap-4" data-testid="mktg-document-view-approve-confirm">
  @if (report; as data) {
    <ul class="flex list-disc flex-col gap-2 pl-5 text-sm text-gray-700">
      @for (source of data.sources_failed; track $index) {
        <li>{{ source.name }} — {{ source.reason }}</li>
      }
      @for (gap of data.gaps; track $index) {
        <li>{{ gap }}</li>
      }
    </ul>
  }
  <div class="flex justify-end gap-2">
    <lfx-button label="Cancel" severity="secondary" [outlined]="true" data-testid="mktg-document-view-approve-cancel" (onClick)="close(false)" />
    <lfx-button label="Approve anyway" severity="primary" data-testid="mktg-document-view-approve-anyway" (onClick)="close(true)" />
  </div>
</div>
