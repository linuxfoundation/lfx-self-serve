<span
  class="text-sm font-semibold"
  [class.text-emerald-700]="row().state === 'approved'"
  [class.text-blue-700]="row().state === 'draft'"
  [class.text-amber-700]="row().state === 'needs-rebuild'"
  [class.text-gray-500]="row().state === 'missing' || row().state === 'coming-soon' || row().state === null"
  data-testid="mktg-kit-asset-status"
  >{{ label() }}</span
>
