<!-- Match the Family header's 800px content threshold: laptop host minus gutters leaves ~60px headroom. -->
<div
  class="grid grid-cols-1 items-end gap-6"
  [class]="withDescription() ? '@[800px]:grid-cols-[minmax(0,1fr)_minmax(0,1.3fr)]' : ''"
  data-testid="mktg-kit-header">
  <lfx-page-header
    class="min-w-0"
    data-testid="mktg-kit-title-block"
    [eyebrow]="labels.title"
    [title]="projectName()"
    [description]="withDescription() ? labels.description : null"
    [titleTestId]="titleTestId()" />
  <ng-content />
</div>
