<!-- One sample icon: the shared shapes on the 24-unit grid, one stroke in the current colour, no fill. Decorative: the label beside it is the text. -->
<ng-template #iconTpl let-icon let-size="size">
  <svg
    [attr.width]="size"
    [attr.height]="size"
    [attr.viewBox]="viewBox"
    fill="none"
    stroke="currentColor"
    [attr.stroke-width]="strokeWidth"
    [attr.stroke-linecap]="linecap"
    [attr.stroke-linejoin]="linejoin"
    class="mx-auto block shrink-0"
    aria-hidden="true"
    focusable="false">
    @for (shape of icon.shapes; track $index) {
      @if (shape.kind === 'path') {
        <svg:path [attr.d]="shape.d" />
      } @else if (shape.kind === 'circle') {
        <svg:circle [attr.cx]="shape.cx" [attr.cy]="shape.cy" [attr.r]="shape.r" />
      } @else if (shape.kind === 'rect') {
        <svg:rect [attr.x]="shape.x" [attr.y]="shape.y" [attr.width]="shape.width" [attr.height]="shape.height" [attr.rx]="shape.rx" />
      }
    }
  </svg>
</ng-template>

@if (compact()) {
  <!--
    The print sheet's compact rows: plain block flow only. Inside the sheet's paginated table, Chromium fragments a
    grid or flex item's contents away from its box (QA round 1: empty tiles on one page, their icons on the next), so
    the tiles are inline blocks, four to a line, and the strip is a line of inline blocks; no grid, no flex. Sized to
    sit beside the rules in the Iconography row (≈ 98 px tall: 30 px tiles, 18 px icons, 8 px labels, a 30 px strip).
  -->
  <ul class="block" data-testid="brand-kit-icon-tiles">
    @for (icon of icons; track icon.id) {
      <li
        class="inline-block h-[30px] w-[23%] rounded-[6px] border border-gray-200 pt-[1px] text-center align-top [&:not(:nth-child(4n))]:mr-[2.5%] [&:nth-child(-n+4)]:mb-1"
        [style.color]="colours().tileInk"
        [attr.data-testid]="'brand-kit-icon-tile-' + icon.id">
        <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: icon, size: iconSize() }" />
        <span class="block text-[8px] leading-[10px] text-gray-500">{{ icon.label }}</span>
      </li>
    }
  </ul>
  <!-- The strip: the eight icons on the kit's dark, white, the third in the highlight; the board's left-aligned row. -->
  <div
    class="mt-1 block h-[30px] whitespace-nowrap rounded-[6px] px-3 py-[6px] [print-color-adjust:exact]"
    [style.background-color]="colours().stripGround"
    role="img"
    [attr.aria-label]="stripLabel"
    data-testid="brand-kit-icon-strip">
    @for (item of strip(); track item.icon.id) {
      <span
        class="inline-block align-top [&:not(:last-child)]:mr-4"
        [style.color]="item.ink"
        [attr.data-highlight]="item.highlight ? 'true' : null"
        [attr.data-testid]="'brand-kit-icon-strip-' + item.icon.id">
        <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: item.icon, size: iconSize() }" />
      </span>
    }
  </div>
} @else {
  <!--
    The web card: the board's 4 × 2 tiles (book.js L91: gap 12 px, height 110 px, radius 10 px, icon 32 px, label 11 px,
    10 px between them), two to a row under the sm breakpoint so a label never breaks mid-word in a narrow card.
  -->
  <ul class="grid grid-cols-2 gap-[12px] sm:grid-cols-4" data-testid="brand-kit-icon-tiles">
    @for (icon of icons; track icon.id) {
      <li
        class="flex h-[110px] flex-col items-center justify-center gap-[10px] rounded-[10px] border border-gray-200"
        [style.color]="colours().tileInk"
        [attr.data-testid]="'brand-kit-icon-tile-' + icon.id">
        <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: icon, size: iconSize() }" />
        <span class="text-[11px] leading-[1.4] text-gray-500">{{ icon.label }}</span>
      </li>
    }
  </ul>
  <!--
    The strip: the eight icons on the kit's dark, white, the third in the highlight. The board's 30 px icons and fixed
    26 px gap are for its 624 px card; in the half-width card (a 334 px strip at 1440) and the 390 card the eight are
    24 px, spread evenly (space-between) with an 8 px minimum gap inside 12 px of padding: one row of eight from a
    272 px strip up (the host is the container queried), and 4 + 4 below that, never 7 + 1 or 5 + 3.
  -->
  <div
    class="mt-[14px] grid min-h-[110px] grid-cols-[repeat(4,max-content)] content-center items-center justify-between gap-x-2 gap-y-3 rounded-[10px] px-3 py-4 [print-color-adjust:exact] @[272px]:grid-cols-[repeat(8,max-content)]"
    [style.background-color]="colours().stripGround"
    role="img"
    [attr.aria-label]="stripLabel"
    data-testid="brand-kit-icon-strip">
    @for (item of strip(); track item.icon.id) {
      <span
        class="flex"
        [style.color]="item.ink"
        [attr.data-highlight]="item.highlight ? 'true' : null"
        [attr.data-testid]="'brand-kit-icon-strip-' + item.icon.id">
        <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: item.icon, size: stripIconSize }" />
      </span>
    }
  </div>
}
