<svg
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.viewBox]="viewBox"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth"
  [attr.stroke-linecap]="linecap"
  [attr.stroke-linejoin]="linejoin"
  class="mx-auto block shrink-0"
  aria-hidden="true"
  focusable="false">
  @for (shape of icon().shapes; track $index) {
    @if (shape.kind === 'path') {
      <svg:path [attr.d]="shape.d" />
    } @else if (shape.kind === 'circle') {
      <svg:circle [attr.cx]="shape.cx" [attr.cy]="shape.cy" [attr.r]="shape.r" />
    } @else if (shape.kind === 'rect') {
      <svg:rect [attr.x]="shape.x" [attr.y]="shape.y" [attr.width]="shape.width" [attr.height]="shape.height" [attr.rx]="shape.rx" />
    }
  }
</svg>
