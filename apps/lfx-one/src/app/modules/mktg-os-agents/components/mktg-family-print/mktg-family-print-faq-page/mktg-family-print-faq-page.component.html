<p class="fp-col fp-intro fp-body" data-testid="family-print-faq-intro">{{ intro() }}</p>
<div class="fp-col fpq-grid" style="top: 200px" data-testid="family-print-faq-grid">
  @for (group of shown(); track group.path) {
    <section class="fpq-group" data-testid="family-print-faq-group">
      <h2 class="fp-eyebrow fp-eyebrow--dark">{{ group.name }}</h2>
      <div class="fpq-group__list">
        @for (entry of group.questions; track entry.path) {
          <article class="fpq-entry" data-testid="family-print-faq-entry">
            <h3 class="fpq-entry__question">{{ entry.question }}</h3>
            @if (entry.answer) {
              <p class="fpq-entry__answer">{{ entry.answer }}</p>
            }
            @if (entry.source) {
              <p class="fpq-entry__source">
                <span class="fp-chip">{{ entry.source }}</span>
              </p>
            }
          </article>
        }
      </div>
    </section>
  }
</div>
