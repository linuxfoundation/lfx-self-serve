<p class="pp-body pp-body--wide" [lfxPpRect]="[column[0], geometry.bodyTop, column[1]]" data-testid="family-print-faq-intro">{{ intro() }}</p>
<div class="fpq-grid" [lfxPpRect]="[column[0], layout.top, column[1]]" data-testid="family-print-faq-grid">
  @for (entries of shown(); track $index) {
    <div class="fpq-column" data-testid="family-print-faq-column">
      @for (shown of entries; track shown.key) {
        @if (shown.heading) {
          <h2 class="pp-lab pp-lab--dark fpq-heading" data-testid="family-print-faq-group">
            {{ shown.heading }}
            @if (shown.continued) {
              <span class="fpq-heading__continued" data-testid="family-print-faq-continued">{{ labels.faqContinued }}</span>
            }
          </h2>
        }
        <article class="fpq-entry" data-testid="family-print-faq-entry">
          <h3 class="fpq-entry__question" data-testid="family-print-faq-question">{{ shown.entry.question }}</h3>
          <!-- The answer is the agent's restricted Markdown, as on the FAQ tab: a plain answer is one paragraph, a lead-in
               and its "- " lines a paragraph and a bulleted list; markup an answer carries never becomes an element. The
               plan measures the same blocks (mktgFamilyPrintFaqAnswerParas). -->
          <lfx-markdown-renderer class="fpq-entry__answer" [content]="shown.entry.answer" [restricted]="true" data-testid="family-print-faq-answer" />
          @if (shown.source) {
            <p class="fpq-entry__source" data-testid="family-print-faq-source">
              <span class="pp-chip">{{ shown.source }}</span>
            </p>
          }
        </article>
      }
    </div>
  }
</div>
