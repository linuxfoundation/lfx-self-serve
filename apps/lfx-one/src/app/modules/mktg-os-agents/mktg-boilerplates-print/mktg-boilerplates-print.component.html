@let v = view();
@let c = chrome();
@let l = look();
@for (page of pages(); track $index) {
  <lfx-mktg-print-page
    [look]="l"
    [logo]="v.brand.logoOnLight"
    [eyebrowLeft]="c.eyebrowLeft"
    [eyebrowRight]="c.eyebrowRight"
    [title]="page.title"
    [number]="page.number"
    [footerLine]="c.footerLine"
    aria-label="Boilerplates"
    data-testid="mktg-boilerplates-print-page">
    <!-- Two columns of cards, the rows at the heights the pagination measured them at (a row grows for a line the
         estimate missed, never shrinks under it; a page keeps one body line free for it), the card's border, padding,
         label gap and tracking the numbers the measure used, so the PDF lays the cards the pagination counted. -->
    <div
      class="mbp-grid"
      [style.--mbp-ink]="l.ink"
      [style.--mbp-muted]="l.muted"
      [style.--mbp-rule]="l.rule"
      [style.--mbp-head-tracking]="headTracking"
      [style.grid-template-rows]="page.rowsTemplate"
      data-testid="mktg-boilerplates-print-grid">
      @for (row of page.rows; track $index) {
        @for (card of row.cards; track card.index) {
          <article class="mbp-card" data-testid="mktg-boilerplates-print-card">
            <p class="mbp-head" data-testid="mktg-boilerplates-print-card-head">{{ card.head }}</p>
            <p class="mbp-body" [style.font-size]="card.bodySize" data-testid="mktg-boilerplates-print-card-body">
              {{ card.text }}
            </p>
          </article>
        }
      }
    </div>
  </lfx-mktg-print-page>
}
