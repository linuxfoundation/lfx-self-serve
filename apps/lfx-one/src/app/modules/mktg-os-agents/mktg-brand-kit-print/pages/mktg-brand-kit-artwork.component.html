@if (image(); as image) {
  <img
    class="block w-auto"
    [style.height.px]="height()"
    [src]="image.src"
    [alt]="image.alt"
    [style.filter]="image.filter || null"
    [attr.data-testid]="'brand-kit-artwork-' + kind()" />
}
