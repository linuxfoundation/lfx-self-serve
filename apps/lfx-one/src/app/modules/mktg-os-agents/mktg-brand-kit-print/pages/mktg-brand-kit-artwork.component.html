@if (image(); as image) {
  <span [lfxPpPlate]="image.plate ? height() : null">
    <img
      class="block w-auto"
      [style.height.px]="fit().height"
      [src]="image.src"
      [alt]="image.alt"
      [style.filter]="image.filter || null"
      [attr.data-testid]="'brand-kit-artwork-' + kind()" />
  </span>
}
