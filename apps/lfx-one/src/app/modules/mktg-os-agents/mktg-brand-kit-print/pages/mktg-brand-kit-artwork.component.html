@if (image(); as image) {
  <span [class.pp-plate]="image.plate" [style.padding.px]="image.plate ? height() : null" [attr.data-testid]="image.plate ? 'mktg-portrait-plate' : null">
    <img
      class="block w-auto"
      [style.height.px]="height()"
      [src]="image.src"
      [alt]="image.alt"
      [style.filter]="image.filter || null"
      [attr.data-testid]="'brand-kit-artwork-' + kind()" />
  </span>
}
