@let v = view();
@let c = cover();
<div class="lfx-brand-kit-pages" [attr.data-revision]="v.versionLabel" [attr.data-pages]="pageCount()" data-testid="mktg-brand-kit-print">
  <!-- The cover: the deck's (kit-book.ts coverSlide) — the title over the brand line, the project's eyebrow, the version top right, the footer line and host · version · month. -->
  <lfx-mktg-print-cover
    [look]="look()"
    [title]="c.title"
    [subtitle]="c.subtitle"
    [eyebrow]="c.eyebrow"
    [topRight]="c.topRight"
    [footerLeft]="c.footerLeft"
    [footerRight]="c.footerRight"
    data-testid="kit-print-cover" />
  <!-- The contents and the chapter pages, each from the shared page plan; the Iconography page's icons fill its slots. -->
  @for (page of pages(); track $index) {
    <lfx-mktg-print-page [page]="page" [look]="look()" [logo]="brand().logoOnLight" [attr.data-page]="page.footer?.number" data-testid="kit-print-page">
      <ng-template [lfxMktgPrintPageSlot]="iconSlot" let-icon>
        <span class="lfx-brand-kit-pages__icon" [style.color]="icon.color" [attr.data-index]="icon.index" data-testid="kit-print-icon">
          <lfx-mktg-brand-kit-icon [icon]="icons[icon.index]" size="100%" />
        </span>
      </ng-template>
    </lfx-mktg-print-page>
  }
  @if (backCover()) {
    <lfx-mktg-print-back-cover [look]="look()" [title]="backTitle()" [host]="v.host" [notice]="v.backCoverNotice" data-testid="kit-print-back-cover" />
  }
</div>
