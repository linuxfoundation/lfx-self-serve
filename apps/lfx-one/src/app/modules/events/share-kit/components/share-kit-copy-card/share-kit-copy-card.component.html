<!-- data-dd-privacy="mask" keeps sensitive text (a member code) out of Datadog Session Replay, which records page text by default. -->
<!-- Exact px sizes follow the share kit design (the root font is 14px, so rem sizes undershoot). -->
<article
  class="flex min-w-0 flex-col gap-3 rounded-[14px] border border-gray-200 bg-white p-4 text-gray-900 sm:p-5"
  [attr.data-dd-privacy]="sensitive() ? 'mask' : null"
  [attr.data-testid]="testId()">
  @if (heading()) {
    <h3 class="text-base font-bold text-gray-900" [attr.data-testid]="testId() + '-heading'">{{ heading() }}</h3>
  }
  <!-- Pre-wrap sits on the spans, not the paragraph, so template indentation never shows as leading spaces. -->
  <p
    #textElement
    class="flex-1 break-words rounded-[10px] bg-gray-50 p-3 text-[14px] sm:p-[14px] leading-[1.6] text-gray-700"
    [attr.data-testid]="testId() + '-text'">
    <span class="whitespace-pre-wrap">{{ textParts().body }}</span>
    @if (textParts().link) {
      <span class="whitespace-pre-wrap text-ui-accent-700" [attr.data-testid]="testId() + '-link'">{{ textParts().link }}</span>
    }
  </p>
  <div class="flex flex-wrap items-center justify-between gap-3">
    @if (length() !== null && limit() !== null) {
      <span
        class="text-xs tabular-nums"
        [class.text-gray-500]="!overLimit()"
        [class.text-red-700]="overLimit()"
        [class.font-semibold]="overLimit()"
        [attr.data-testid]="testId() + '-count'">
        {{ countLabel() }}
      </span>
    }
    <div class="ml-auto flex flex-wrap items-center gap-3">
      <span class="text-sm text-gray-600" role="status" aria-live="polite" [attr.data-testid]="testId() + '-status'">{{ status() }}</span>
      <lfx-ui-button
        [variant]="buttonVariant()"
        [ariaLabel]="heading() ? copyLabel() + ': ' + heading() : copyLabel()"
        (click)="copy(textElement)"
        [attr.data-testid]="testId() + '-copy'"
        >{{ copyLabel() }}</lfx-ui-button
      >
    </div>
  </div>
</article>
