<!-- Exact [Npx] design values throughout: rem undershoots at the 14px root. -->
<lfx-ui-modal [heading]="copy.revokeTitle" [width]="480" closable data-testid="account-revoke-token-dialog">
  <p [id]="dialogRef.id + '-subtitle'" class="m-0 text-[14px] leading-[1.6] text-ui-neutral-700" data-testid="account-revoke-token-text">
    {{ copy.revokeTextBefore }} <strong class="font-semibold text-ui-neutral-900">{{ name }}</strong> {{ copy.revokeTextAfter }}
  </p>
  <ng-container modalActions>
    <lfx-ui-button data-autofocus variant="secondary" (click)="dialogRef.close(false)" data-testid="account-revoke-token-cancel">Cancel</lfx-ui-button>
    <lfx-ui-button variant="danger" (click)="dialogRef.close(true)" data-testid="account-revoke-token-confirm">{{ copy.revokeConfirm }}</lfx-ui-button>
  </ng-container>
</lfx-ui-modal>
