<!-- Exact [Npx] design values throughout: rem undershoots at the 14px root. Each step draws its own action row. -->
<lfx-ui-modal [heading]="heading()" [width]="560" [closable]="closable()" data-testid="account-sign-cla-dialog">
  @if (host.step(); as step) {
    <div class="contents" data-testid="account-sign-cla-step">
      <ng-container *ngComponentOutlet="step.component; injector: stepInjector()" />
    </div>
  } @else {
    <p class="m-0 flex flex-row items-center gap-[8px] text-[14px] leading-[20px] text-ui-neutral-600" data-testid="account-sign-cla-busy">
      <lfx-ui-spinner [size]="16" label="Checking your linked accounts" />
      Checking your linked accounts…
    </p>
  }
</lfx-ui-modal>
