<div class="flex flex-col gap-4">
  <!-- Host-owned navigation. The embed renders no admin shell of its own, so without this its
       sends and templates pages have no route into them. -->
  <nav class="flex flex-wrap items-center gap-1 border-b border-gray-200" aria-label="Gatewaze admin">
    @for (item of navItems; track item.path) {
      <button
        type="button"
        class="border-b-2 px-4 py-2 text-sm font-medium transition-colors"
        [class.border-blue-600]="isActiveNav(item.path)"
        [class.text-blue-700]="isActiveNav(item.path)"
        [class.border-transparent]="!isActiveNav(item.path)"
        [class.text-gray-600]="!isActiveNav(item.path)"
        [attr.aria-current]="isActiveNav(item.path) ? 'page' : null"
        (click)="navigateEmbed(item.path)">
        {{ item.label }}
      </button>
    }
  </nav>

  <!-- Unconditional siblings: the embed mounts into #embedRoot and renders portals (dialogs,
       toasts, etc.) into #embedPortals. Both must exist in the DOM before mount() runs. -->
  <div #embedRoot id="gw-embed-root"></div>
  <div #embedPortals id="gw-embed-portals"></div>

  @if (signInRequired()) {
    <div class="flex flex-col items-start gap-3 rounded border border-gray-300 bg-gray-50 p-4">
      <p class="font-semibold">Sign in to Gatewaze</p>
      <p>Your LFX session doesn't yet include access to the embedded admin module.</p>
      <button type="button" class="rounded bg-blue-600 px-4 py-2 text-white" (click)="startSignIn()">Sign in with LFID</button>
    </div>
  }

  @if (mountError()) {
    <div class="flex flex-col gap-2 rounded border border-red-300 bg-red-50 p-4 text-red-700" role="alert">
      <p class="font-semibold">The embedded admin module couldn't be loaded.</p>
      <p>{{ mountError() }}</p>
    </div>
  }
</div>
