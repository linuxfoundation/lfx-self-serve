<!-- Same page container every other LFX route uses, so the embed's title and content line up with
     the rest of the app rather than sitting flush against the shell — this is what supplies the
     horizontal gutter, since the embed's own layout goes full-bleed via --margin-x.
     No top padding: the embed's hero already contributes LFX's 21px, and adding the container's
     own would double it. The bottom padding is ours because the embed has none. -->
<div class="container mx-auto flex flex-col gap-4 px-4 pb-6 sm:px-6 lg:px-8">
  <!-- The embed is a large React bundle fetched on demand; without this the container sits empty
       for the length of the import and of React's first render. Up until the embed has painted
       (see waitForRendered and waitForFirstPaint). A sibling so the mount points below keep their stable references,
       and above them so a hidden root that already takes up space never pushes it down. -->
  @if (mounting()) {
    <div class="flex flex-col gap-3" data-testid="gw-embed-loading" aria-busy="true">
      <p-skeleton height="2rem" width="14rem" />
      <p-skeleton height="1rem" width="24rem" />
      <p-skeleton height="12rem" />
    </div>
  }

  <!-- Unconditional siblings: the embed mounts into #embedRoot and renders portals (dialogs,
       toasts, etc.) into #embedPortals. Both must exist in the DOM before mount() runs. -->
  <!-- Hidden, NOT removed, when the host's error panel is showing. The embed at a dead end still
       renders a full-height empty region, which pushed the host's panel below the fold — the user
       saw a blank page with the message 769px down. An inline style rather than `[hidden]` or a class:
       the embed's contained stylesheet also targets these ids, and an inline declaration wins over
       it without needing !important. The element stays in the DOM for viewChild.required and
       mount().
       Also hidden with `visibility` while `mounting`, until the embed has painted: unlike
       `display: none` it still lays out, so the outlet can measure when content arrives, and the
       skeleton above hands over to whatever the embed draws first, its spinner included. -->
  <div
    #embedRoot
    id="gw-embed-root"
    [style.display]="hostPanelShowing() ? 'none' : null"
    [style.visibility]="mounting() ? 'hidden' : null"
    [attr.aria-hidden]="mounting() ? 'true' : null"></div>
  <div #embedPortals id="gw-embed-portals" [style.display]="hostPanelShowing() ? 'none' : null"></div>

  @if (mountError()) {
    <div class="flex flex-col gap-2 rounded border border-red-300 bg-red-50 p-4 text-red-700" role="alert">
      <p class="font-semibold">The embedded admin module couldn't be loaded.</p>
      <p>{{ mountError() }}</p>
    </div>
  }
</div>
