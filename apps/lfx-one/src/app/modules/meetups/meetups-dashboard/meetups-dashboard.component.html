<div class="container mx-auto px-4 sm:px-6 lg:px-8" data-testid="meetups-dashboard">
  <div class="flex flex-col gap-6">
    <!-- Page Header -->
    <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between mt-3">
      <div>
        <h1 class="font-display font-light text-2xl" data-testid="meetups-page-title">My Meetups</h1>
        <p class="mt-1 text-sm text-gray-500" data-testid="meetups-description">
          Community meetups you're registered for, plus upcoming meetups from Open Community Groups.
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-6">
        <span
          class="flex items-center gap-1.5 text-sm text-gray-600 cursor-help"
          tabindex="0"
          pTooltip="Just RSVP'd on ocgroups.dev? It can take a while to show up here."
          tooltipEvent="both"
          tooltipPosition="bottom"
          appendTo="body"
          data-testid="meetups-registration-delay-hint">
          <i class="fa-light fa-face-monocle text-lg" aria-hidden="true"></i>
          <span class="underline decoration-dotted">Can't see your meetup?</span>
        </span>
        <lfx-button
          label="Discover Meetups"
          icon="fa-light fa-arrow-up-right-from-square"
          [text]="true"
          severity="primary"
          [href]="discoverUrl"
          target="_blank"
          rel="noopener noreferrer"
          data-testid="meetups-discover-button" />
      </div>
    </div>

    <!-- Meetups Card: tabs + search + list all in one -->
    <lfx-card styleClass="[&_.p-card-body]:p-0 [&_.p-card-content]:p-0" data-testid="meetups-main-card">
      <!-- Tab Pills Bar -->
      <lfx-card-tabs-bar [options]="tabOptions" [selectedFilter]="activeTab()" (filterChange)="onActiveTabChange($event)" data-testid="meetups-tab-pills" />

      <!-- Search and Filters (hidden on true empty state - no data and no active filters) -->
      @if (showFiltersBar()) {
        <div class="px-5 pt-4 pb-3">
          <lfx-meetups-top-bar
            [isPast]="isPast()"
            [registeredOnly]="upcomingRegisteredOnly()"
            [searchQuery]="selectedSearchQuery()"
            [community]="selectedCommunity()"
            [role]="selectedRole()"
            (searchQueryChange)="onSearchQueryChange($event)"
            (communityChange)="onCommunityChange($event)"
            (roleChange)="onRoleChange($event)" />
        </div>
      }

      <!-- Meetups List -->
      <div class="px-5 pb-5">
        <lfx-meetups-list
          [activeTab]="activeTab()"
          [community]="selectedCommunity()"
          [searchQuery]="selectedSearchQuery()"
          [role]="selectedRole()"
          (resetFilters)="resetFilters()" />
      </div>
    </lfx-card>
  </div>
</div>
