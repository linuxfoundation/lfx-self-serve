<!-- Rendered inside MainLayout's padded content area (left nav stays visible) — no page-level background/padding here. -->
<div class="max-w-4xl mx-auto" data-testid="org-not-found">
  <lfx-card data-testid="org-not-found-card">
    <div class="text-center py-12">
      <div class="flex justify-center mb-6">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center">
          <i class="fa-light fa-building-circle-xmark text-4xl text-gray-400" aria-hidden="true"></i>
        </div>
      </div>

      <h1 class="mb-3" data-testid="org-not-found-title">Organization not found</h1>

      <p class="text-gray-600 mb-8 max-w-lg mx-auto" data-testid="org-not-found-description">It may not exist, or you may not have access to it.</p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <lfx-button routerLink="/" icon="fa-light fa-house" label="Go to Dashboard" size="small" data-testid="org-not-found-dashboard-button"></lfx-button>
      </div>
    </div>
  </lfx-card>
</div>
