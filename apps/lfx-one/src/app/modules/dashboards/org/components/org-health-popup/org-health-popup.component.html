<!-- Exact Figma px via [Npx]: the app's 14px root font makes rem utilities undershoot (see .claude/rules/styling.md). -->
<p-popover
  #popover
  [dismissable]="true"
  appendTo="body"
  styleClass="org-health-popover"
  ariaLabel="Health score details"
  hideTransitionOptions="0ms"
  [focusOnShow]="false"
  (onShow)="onShow()"
  (onHide)="onHide()"
  data-testid="org-health-popup">
  <div
    #content
    class="flex w-[320px] flex-col gap-[16px] rounded-[12px] border border-gray-200 bg-white p-[12px] text-[12px] shadow-xl focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none"
    tabindex="0"
    role="group"
    aria-label="Health score details"
    data-testid="org-health-popup-content"
    (mouseenter)="cancelHide()"
    (mouseleave)="scheduleHide()"
    (focusin)="cancelHide()"
    (focusout)="scheduleHide()">
    @if (available()) {
      <div class="flex flex-col gap-[8px]">
        <div class="flex items-center gap-[8px] text-[14px] leading-[20px]" data-testid="org-health-popup-headline">
          <span class="flex size-[12px] shrink-0 items-center justify-center">
            <span class="size-[8px] rounded-full" [style.backgroundColor]="barFillColor()"></span>
          </span>
          <span
            ><span class="font-semibold text-gray-900">{{ labelText() }}</span
            ><span class="text-gray-500"> {{ scoreText() }}</span></span
          >
        </div>
        <div class="flex h-[4px] w-full items-center overflow-hidden rounded-full" aria-hidden="true" data-testid="org-health-popup-bar">
          <div class="h-full shrink-0" [style.width.%]="barFillPercent()" [style.backgroundColor]="barFillColor()"></div>
          <div class="h-full grow bg-gray-200"></div>
          @if (barMissingPercent() > 0) {
            <div
              class="h-full shrink-0 bg-[length:8px_100%] bg-repeat-x bg-[radial-gradient(circle_closest-side,theme(colors.gray.200)_95%,transparent)]"
              [style.width.%]="barMissingPercent()"
              data-testid="org-health-popup-bar-missing"></div>
          }
        </div>
        @if (description(); as text) {
          <p class="leading-[16px] text-gray-600" data-testid="org-health-popup-description">{{ text }}</p>
        }
      </div>
      <div class="flex flex-col gap-[8px]">
        @for (row of rows(); track row.key) {
          <div class="flex items-center gap-[8px] leading-[16px]" [attr.data-testid]="'org-health-popup-row-' + row.key">
            <span class="flex size-[20px] shrink-0 items-center justify-center rounded-full bg-white">
              <i [class]="'fa-light fa-' + row.icon + ' text-[12px] text-gray-600'" aria-hidden="true"></i>
            </span>
            <span class="font-medium text-gray-900">{{ row.name }}</span>
            <span class="ml-auto shrink-0">
              @if (row.score === null) {
                <span class="mr-[3px] font-semibold text-gray-900">—</span>
              } @else {
                <span class="font-semibold text-gray-900">{{ row.score }}</span>
              }
              <span class="text-gray-400">/{{ row.max }}</span>
            </span>
          </div>
        }
      </div>
    } @else {
      <p class="text-gray-500 leading-[16px]" data-testid="org-health-popup-unavailable">{{ unavailableText }}</p>
    }
  </div>
</p-popover>
