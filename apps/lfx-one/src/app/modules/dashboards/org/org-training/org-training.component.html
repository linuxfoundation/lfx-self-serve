<div class="container mx-auto flex flex-col gap-6 px-4 sm:px-6 lg:px-8" data-testid="org-training-page">
  <!-- The header names the selected organization, so a page-level state replaces the whole page. -->
  @if (pageState(); as state) {
    <lfx-org-lens-empty-state
      [state]="state"
      [testId]="'org-training-no-access'"
      [values]="{ correlationId: correlationId() }"
      [retrying]="emptyState.retrying()"
      (retry)="emptyState.retry()" />
  } @else if (!emptyState.settled()) {
    <div class="flex flex-col gap-6" data-testid="org-training-skeleton">
      <div class="flex flex-col gap-2">
        <p-skeleton height="2rem" width="22rem" />
        <p-skeleton height="1rem" width="28rem" />
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        @for (slot of [1, 2, 3, 4]; track slot) {
          <p-skeleton height="5rem" />
        }
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        @for (slot of [1, 2]; track slot) {
          <p-skeleton height="4rem" />
        }
      </div>
      <p-skeleton height="24rem" />
    </div>
  } @else {
    <!-- Page Header -->
    <lfx-page-header
      [title]="companyName() ? 'Training & Certifications — ' + companyName() : 'Training & Certifications'"
      description="Training enrollments and certifications across your organization."
      titleTestId="org-training-title"
      descriptionTestId="org-training-subtitle"
      data-testid="org-training-header" />

    <!-- The same stat tiles as People › Trainees, for the same range and filters. A failed read is stated as such, never as dashes that read like "no data". -->
    @if (statsError()) {
      <lfx-org-training-stats-error testIdPrefix="org-training-stats" (retry)="retryStats()" />
    } @else {
      <lfx-org-training-stats [stats]="shownStats()" [range]="range()" [collapsible]="true" />
    }

    <!-- Content Card: product-type tabs over one group table (search is local to the table) -->
    <lfx-card styleClass="[&_.p-card-body]:p-0 [&_.p-card-content]:p-0" data-testid="org-training-content-card">
      <lfx-card-tabs-bar [options]="tabs" [selectedFilter]="activeTab()" (filterChange)="onActiveTabChange($event)" data-testid="org-training-tabs" />

      <section [id]="'org-training-panel-' + activeTab()" [attr.data-testid]="'org-training-panel-' + activeTab()" class="flex flex-col gap-4 p-5">
        <!-- The one filter bar, in the card: name search, range and group-by up front, the other filters behind its toggle. State is in the URL. -->
        <lfx-org-training-filter-bar [showGroupBy]="true">
          <div class="w-full md:w-72" data-testid="org-training-groups-search">
            <lfx-input-text
              [form]="searchForm"
              control="search"
              placeholder="Search by name"
              ariaLabel="Search by name"
              icon="fa-light fa-search"
              size="small"
              styleClass="w-full"
              data-testid="org-training-search-input" />
          </div>
        </lfx-org-training-filter-bar>
        <lfx-org-training-groups-table [orgUid]="orgUid()" [query]="statsQuery()" [groupBy]="groupBy()" [tab]="activeTab()" [searchQuery]="searchQuery()" />
      </section>
    </lfx-card>
    <p class="text-xs text-gray-500" data-testid="org-training-range-note">{{ tableNote() }}</p>
  }
</div>

<lfx-person-detail-drawer />
