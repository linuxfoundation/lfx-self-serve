<form [formGroup]="form" (submit)="$event.preventDefault(); onConfirm()" class="flex flex-col gap-4" data-testid="org-easycla-invalidate-dialog">
  <lfx-message severity="warn" icon="fa-light fa-triangle-exclamation">
    <ng-template #content>
      <span data-testid="org-easycla-invalidate-dialog-body">{{ bodyCopy }}</span>
    </ng-template>
  </lfx-message>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700" for="org-easycla-invalidate-reason">{{ copy.reasonLabel }}</label>
    <lfx-input-text [form]="form" control="reason" inputId="org-easycla-invalidate-reason" [placeholder]="copy.reasonPlaceholder" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700" for="org-easycla-invalidate-note">{{ copy.noteLabel }}</label>
    <lfx-input-text [form]="form" control="note" inputId="org-easycla-invalidate-note" [placeholder]="copy.notePlaceholder" />
  </div>

  <div class="flex justify-end gap-2">
    <lfx-button [label]="copy.cancelLabel" severity="secondary" [outlined]="true" (onClick)="onCancel()" data-testid="org-easycla-invalidate-dialog-cancel" />
    <lfx-button
      [label]="copy.confirmLabel"
      icon="fa-light fa-ban"
      severity="danger"
      (onClick)="onConfirm()"
      data-testid="org-easycla-invalidate-dialog-confirm" />
  </div>
</form>
