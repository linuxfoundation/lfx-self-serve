<div class="flex flex-col gap-4" data-testid="org-easycla-manager-question-dialog">
  <p class="text-base font-semibold text-gray-900 m-0" data-testid="org-easycla-manager-question">{{ copy.question }}</p>
  <p class="text-sm text-gray-600 m-0">{{ copy.message }}</p>
  <p class="text-sm text-gray-500 m-0">{{ copy.note }}</p>

  <div class="flex justify-end gap-2 pt-2">
    <lfx-button
      [label]="copy.noLabel"
      type="button"
      severity="secondary"
      [outlined]="true"
      (onClick)="answer('no')"
      data-testid="org-easycla-manager-question-no" />
    <lfx-button [label]="copy.yesLabel" type="button" (onClick)="answer('yes')" data-testid="org-easycla-manager-question-yes" />
  </div>
</div>
