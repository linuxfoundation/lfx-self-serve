<form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" data-testid="org-easycla-identify-manager-dialog">
  <p class="text-sm text-gray-600 m-0">{{ copy.message }}</p>

  <div class="flex flex-col gap-2">
    <label for="org-easycla-identify-manager-name" class="text-sm font-medium text-gray-700">{{ copy.nameLabel }}</label>
    <lfx-input-text
      [form]="form"
      control="fullName"
      inputId="org-easycla-identify-manager-name"
      autocomplete="name"
      [required]="true"
      [invalid]="!!fullNameError()"
      [describedBy]="fullNameError() ? 'org-easycla-identify-manager-name-error' : undefined"
      dataTest="org-easycla-identify-manager-name" />
    @if (fullNameError()) {
      <p id="org-easycla-identify-manager-name-error" role="alert" class="text-xs text-red-600 m-0" data-testid="org-easycla-identify-manager-name-error">
        {{ fullNameError() }}
      </p>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="org-easycla-identify-manager-email" class="text-sm font-medium text-gray-700">{{ copy.emailLabel }}</label>
    <lfx-input-text
      [form]="form"
      control="email"
      type="text"
      inputId="org-easycla-identify-manager-email"
      autocomplete="email"
      [required]="true"
      [invalid]="!!emailError()"
      [describedBy]="emailError() ? 'org-easycla-identify-manager-email-error' : undefined"
      dataTest="org-easycla-identify-manager-email" />
    @if (emailError()) {
      <p id="org-easycla-identify-manager-email-error" role="alert" class="text-xs text-red-600 m-0" data-testid="org-easycla-identify-manager-email-error">
        {{ emailError() }}
      </p>
    }
  </div>

  <div class="flex justify-end gap-2 pt-2">
    <lfx-button
      [label]="copy.cancelLabel"
      type="button"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
      data-testid="org-easycla-identify-manager-cancel" />
    <lfx-button [label]="copy.submitLabel" type="submit" data-testid="org-easycla-identify-manager-submit" />
  </div>
</form>
