<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="events-orgs">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Companies at events unavailable"
      subtitle="We could not load the companies at this foundation's events. Refresh the page to try again."
      data-testid="events-orgs-error" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else {
    <!-- The search fills the row from 240px, and the whole width on phones. -->
    <div class="flex flex-wrap items-center gap-[10px]">
      <lfx-ui-search-input
        class="min-w-[240px] flex-[1_1_240px] max-[640px]:min-w-0 max-[640px]:basis-full"
        placeholder="Search company..."
        ariaLabel="Search company"
        [(value)]="searchText"
        data-testid="events-orgs-search" />
    </div>

    @if (!loading() && totalRecords() === 0) {
      <lfx-empty-state
        variant="compact"
        icon="fa-light fa-magnifying-glass"
        title="No matching companies"
        subtitle="No company matches the selected filter or search. Clear the search or pick another filter."
        [resettable]="true"
        (resetFilters)="onResetFilters()"
        data-testid="events-orgs-no-match" />
    } @else {
      <!-- The design's 880px minimum; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [value]="rowViews()"
        [loading]="loading()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '880px' }"
        data-testid="events-orgs-table">
        <ng-template #header>
          <tr>
            <th scope="col" [attr.aria-sort]="sorting.headers().company.ariaSort">
              <lfx-health-metrics-th
                label="Company"
                [sort]="sorting.headers().company.state"
                (sorted)="sorting.toggle('company')"
                data-testid="events-organizations-sort-company" />
            </th>
            <!-- Exact %: the design's 0.8 / 0.7 / 0.7 / 0.6 / 0.5 / 0.4 shares of its 5.7fr row. -->
            <th scope="col" class="w-[14%]" [attr.aria-sort]="sorting.headers().membership.ariaSort">
              <lfx-health-metrics-th
                label="Membership"
                [sort]="sorting.headers().membership.state"
                (sorted)="sorting.toggle('membership')"
                data-testid="events-organizations-sort-membership" />
            </th>
            <th scope="col" class="w-[12%] text-right" [attr.aria-sort]="sorting.headers().registrations.ariaSort">
              <lfx-health-metrics-th
                label="Registrations"
                [sort]="sorting.headers().registrations.state"
                (sorted)="sorting.toggle('registrations')"
                data-testid="events-organizations-sort-registrations" />
            </th>
            <th scope="col" class="w-[12%] text-right" [attr.aria-sort]="sorting.headers().sponsorship.ariaSort">
              <lfx-health-metrics-th
                label="Sponsorship"
                [sort]="sorting.headers().sponsorship.state"
                (sorted)="sorting.toggle('sponsorship')"
                data-testid="events-organizations-sort-sponsorship" />
            </th>
            <th scope="col" class="w-[11%] text-right" [attr.aria-sort]="sorting.headers().proposals.ariaSort">
              <lfx-health-metrics-th
                label="Proposals"
                [sort]="sorting.headers().proposals.state"
                (sorted)="sorting.toggle('proposals')"
                data-testid="events-organizations-sort-proposals" />
            </th>
            <th scope="col" class="w-[9%] text-right" [attr.aria-sort]="sorting.headers().speakers.ariaSort">
              <lfx-health-metrics-th
                label="Speakers"
                [sort]="sorting.headers().speakers.state"
                (sorted)="sorting.toggle('speakers')"
                data-testid="events-organizations-sort-speakers" />
            </th>
            <th scope="col" class="w-[7%] text-right" [attr.aria-sort]="sorting.headers().events.ariaSort">
              <lfx-health-metrics-th
                label="Events"
                [sort]="sorting.headers().events.state"
                (sorted)="sorting.toggle('events')"
                data-testid="events-organizations-sort-events" />
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <!-- The name link is the control screen readers and keyboards use; a click anywhere else on the row does the same.
               It reads as plain row text: the `!` utilities beat lfx-table's blue, 0.875rem `td a` link style. -->
          <tr class="cursor-pointer" (click)="openOrganization(view)" [attr.data-testid]="'events-orgs-row-' + view.accountId">
            <td>
              <a
                [routerLink]="view.link.commands"
                [fragment]="view.link.fragment"
                [queryParams]="view.link.queryParams"
                queryParamsHandling="merge"
                [attr.aria-label]="view.linkLabel"
                (click)="$event.stopPropagation()"
                class="block rounded-sm ![font-size:inherit] ![line-height:inherit] !font-medium !text-gray-900 !no-underline hover:!text-gray-900 hover:!no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"
                [attr.data-testid]="'events-orgs-row-' + view.accountId + '-name'">
                <lfx-health-metrics-cell [text]="view.accountName" [lead]="view.company" />
              </a>
            </td>
            <!-- A non-member reads in neutral-500; a tier reads in the row's ink. -->
            <td>
              <lfx-health-metrics-cell
                [textClass]="view.isMember ? '' : 'text-gray-500'"
                [text]="view.membershipLabel"
                [attr.data-testid]="'events-orgs-row-' + view.accountId + '-membership'" />
            </td>
            <td>
              <lfx-health-metrics-cell
                class="items-end"
                [text]="view.registrationsLabel"
                [attr.data-testid]="'events-orgs-row-' + view.accountId + '-registrations'" />
            </td>
            <td>
              <lfx-health-metrics-cell
                class="items-end"
                [text]="view.sponsorshipLabel"
                [attr.data-testid]="'events-orgs-row-' + view.accountId + '-sponsorship'" />
            </td>
            <td>
              <lfx-health-metrics-cell class="items-end" [text]="view.proposalsLabel" [attr.data-testid]="'events-orgs-row-' + view.accountId + '-proposals'" />
            </td>
            <td>
              <lfx-health-metrics-cell class="items-end" [text]="view.speakersLabel" [attr.data-testid]="'events-orgs-row-' + view.accountId + '-speakers'" />
            </td>
            <td>
              <lfx-health-metrics-cell class="items-end" [text]="view.eventsLabel" [attr.data-testid]="'events-orgs-row-' + view.accountId + '-events'" />
            </td>
          </tr>
        </ng-template>
      </lfx-table>

      <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
    }
  }
</div>
