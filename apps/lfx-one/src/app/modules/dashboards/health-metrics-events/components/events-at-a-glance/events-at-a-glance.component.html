<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="events-at-a-glance">
  @if (status() === 'failed') {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Events at a glance unavailable"
      subtitle="We could not load event reach for this foundation. Refresh the page to try again."
      data-testid="events-at-a-glance-error" />
  } @else if (status() === 'loading') {
    <p-skeleton height="16rem" borderRadius="0.5rem" data-testid="events-at-a-glance-loading" aria-hidden="true" />
  } @else if (!empty()) {
    <lfx-health-metrics-metrics-row [items]="view().metrics" testId="events-at-a-glance-metrics" />

    <!-- The design's 560px minimum; a narrower card scrolls the table sideways. -->
    <lfx-table
      styleClass="hm-table"
      [rowHover]="false"
      [value]="view().rows"
      [paginator]="false"
      [tableStyle]="{ 'min-width': '560px' }"
      data-testid="events-at-a-glance-table">
      <ng-template #header>
        <tr>
          <th scope="col">Metric</th>
          <th scope="col" class="text-right" data-testid="events-at-a-glance-period-heading">{{ view().periodHeading }}</th>
          <th scope="col" class="text-right" data-testid="events-at-a-glance-comparison-heading">{{ view().comparisonHeading }}</th>
          <th scope="col" class="text-right">Change</th>
        </tr>
      </ng-template>

      <ng-template #body let-row>
        <tr [attr.data-testid]="'events-at-a-glance-row-' + row.key">
          <td><lfx-health-metrics-cell [text]="row.label" /></td>
          <td><lfx-health-metrics-cell class="items-end" [text]="row.value" /></td>
          <td><lfx-health-metrics-cell class="items-end" [text]="row.comparison" /></td>
          <td>
            @if (row.change; as change) {
              <div class="flex justify-end">
                <lfx-ui-badge [tone]="row.changeTone" [attr.data-testid]="'events-at-a-glance-row-' + row.key + '-change'">{{ change }}</lfx-ui-badge>
              </div>
            } @else {
              <lfx-health-metrics-cell class="items-end" text="—" />
            }
          </td>
        </tr>
      </ng-template>
    </lfx-table>
  }
</div>
