<div class="flex flex-col gap-[16px]" data-testid="events-registrations-growth">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Registrations and growth unavailable"
      subtitle="We could not load registrations by year for this foundation. Refresh the page to try again."
      data-testid="events-registrations-growth-error" />
  } @else if (loading()) {
    <p-skeleton height="24rem" borderRadius="0.5rem" data-testid="events-registrations-growth-loading" aria-hidden="true" />
  } @else if (chart().columns.length) {
    <!-- A read with no year settles empty, so the shell shows the section's empty state in place of this. -->
    <lfx-health-metrics-column-chart [chart]="chart()" testId="events-registrations-growth-chart" />
  }
</div>
