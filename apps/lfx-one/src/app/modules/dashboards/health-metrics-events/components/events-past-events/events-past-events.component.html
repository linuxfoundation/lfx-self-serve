<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="events-past-events">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Past events unavailable"
      subtitle="We could not load past events for this foundation. Refresh the page to try again."
      data-testid="events-past-events-error" />
  } @else if (loading()) {
    <p-skeleton height="20rem" borderRadius="0.5rem" data-testid="events-past-events-loading" aria-hidden="true" />
  } @else if (!empty()) {
    <lfx-health-metrics-metrics-row [items]="view().metrics" testId="events-past-events-metrics" />

    <!-- The design's 700px minimum; a narrower card scrolls the table sideways. -->
    <lfx-table
      styleClass="hm-table"
      [rowHover]="false"
      [value]="pageRows()"
      [paginator]="false"
      [tableStyle]="{ 'min-width': '700px' }"
      data-testid="events-past-events-table">
      <ng-template #header>
        <tr>
          <th scope="col">Event</th>
          <!-- Exact px: the design's 220px column. -->
          <th scope="col" class="w-[220px]">Final registrations vs goal</th>
          <th scope="col">Revenue</th>
          <th scope="col">Status</th>
        </tr>
      </ng-template>

      <ng-template #body let-row>
        <tr [attr.data-testid]="'events-past-events-row-' + row.eventId">
          <td><lfx-health-metrics-cell [text]="row.eventName" [description]="row.placeLabel" /></td>
          <td class="w-[220px]">
            <!-- The design's inline goal suffix: 13px neutral-400, 5px into the cell's 8px gap. -->
            <lfx-health-metrics-cell [text]="row.registrationsLabel" [attr.data-testid]="'events-past-events-goal-' + row.eventId">
              <span class="-ml-[5px] whitespace-nowrap text-[13px] text-gray-400">{{ row.goalSuffix }}</span>
            </lfx-health-metrics-cell>
          </td>
          <td><lfx-health-metrics-cell [text]="row.revenueLabel" [attr.data-testid]="'events-past-events-revenue-' + row.eventId" /></td>
          <td>
            <lfx-ui-badge [tone]="row.statusTone" [attr.data-testid]="'events-past-events-status-' + row.eventId">{{ row.statusLabel }}</lfx-ui-badge>
          </td>
        </tr>
      </ng-template>
    </lfx-table>
    <lfx-ui-pagination [total]="view().rows.length" [pageSize]="pageSize" [(page)]="page" />
  }
</div>
