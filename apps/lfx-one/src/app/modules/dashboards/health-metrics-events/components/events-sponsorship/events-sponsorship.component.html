<!-- Pixel sizes follow the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="events-sponsorship">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Sponsorship unavailable"
      subtitle="We could not load sponsorship for this foundation. Refresh the page to try again."
      data-testid="events-sponsorship-error" />
  } @else if (loading()) {
    <p-skeleton height="18rem" borderRadius="0.5rem" data-testid="events-sponsorship-loading" aria-hidden="true" />
  } @else if (!empty()) {
    <lfx-health-metrics-metrics-row [items]="view().metrics" testId="events-sponsorship-metrics" />

    <h3 class="m-0 mt-[4px] text-[11px] font-semibold uppercase tracking-[0.06em] text-gray-500" data-testid="events-sponsorship-tiers-heading">
      Tier packages
    </h3>
    @if (view().tiers.length === 0) {
      <p class="m-0 text-[13px] text-gray-500" data-testid="events-sponsorship-tiers-empty">No tier package was sold in the selected period.</p>
    } @else {
      <!-- Exact px: the design's minmax(110px,150px) 1fr 40px grid. -->
      <lfx-health-metrics-bar-list [rows]="view().tiers" gridClass="grid-cols-[minmax(110px,150px)_1fr_40px]" testId="events-sponsorship-tiers" />
    }
  }
</div>
