<lfx-cdp-company-section-frame
  sectionKey="groups"
  [state]="section.state()"
  [emptyState]="section.emptyState()"
  [companyName]="section.companyName()"
  (retry)="section.retry()">
  <lfx-card styleClass="[&_.p-card-body]:p-0 [&_.p-card-content]:p-0">
    <lfx-table [value]="rows()" sortField="activeSeats" [sortOrder]="-1" data-testid="cdp-company-groups-table">
      <ng-template #header>
        <tr>
          <th scope="col">Group</th>
          <th scope="col">Project</th>
          <th scope="col" class="text-right">Active seats</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr data-testid="cdp-company-groups-row">
          <td class="font-medium text-gray-900">{{ row.committeeName }}</td>
          <td>{{ row.projectName }}</td>
          <td class="text-right">{{ row.activeSeats | number }}</td>
        </tr>
      </ng-template>
    </lfx-table>
  </lfx-card>
  <p class="text-xs text-gray-500" data-testid="cdp-company-groups-note">Visible to LF staff only. Groups with fewer than 4 seats held are not shown.</p>
</lfx-cdp-company-section-frame>
