<lfx-cdp-company-section-frame
  sectionKey="profile"
  [state]="section.state()"
  [emptyState]="section.emptyState()"
  [companyName]="section.companyName()"
  (retry)="section.retry()">
  @if (section.data(); as profile) {
    <lfx-card data-testid="cdp-company-profile-card">
      <div class="flex flex-col gap-6">
        <div class="flex items-center gap-4">
          <div class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-lg border border-gray-200 bg-white">
            @if (logoUrl(); as logo) {
              <img
                [src]="logo"
                alt=""
                class="h-full w-full object-contain"
                referrerpolicy="no-referrer"
                (error)="logoFailed.set(true)"
                data-testid="cdp-company-profile-logo" />
            } @else {
              <i class="fa-light fa-building text-2xl text-gray-400" aria-hidden="true"></i>
            }
          </div>
          <p class="text-xl font-semibold text-gray-900" data-testid="cdp-company-profile-name">{{ profile.name }}</p>
        </div>
        <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="flex flex-col gap-1">
            <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">Top project</dt>
            <dd class="text-sm text-gray-900" data-testid="cdp-company-profile-top-project">{{ profile.topProjectName || 'Not available' }}</dd>
          </div>
          <div class="flex flex-col gap-1">
            <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">Last active</dt>
            <dd class="text-sm text-gray-900" data-testid="cdp-company-profile-last-active">{{ lastActive() }}</dd>
          </div>
        </dl>
        <p class="text-xs text-gray-500" data-testid="cdp-company-profile-note">
          This company has no company account. What is shown here comes from open source activity and cannot be edited.
        </p>
      </div>
    </lfx-card>
  }
</lfx-cdp-company-section-frame>
