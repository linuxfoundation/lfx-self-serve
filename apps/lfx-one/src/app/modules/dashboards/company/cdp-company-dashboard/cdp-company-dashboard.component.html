<lfx-cdp-company-section-frame
  sectionKey="dashboard"
  [state]="section.state()"
  [emptyState]="section.emptyState()"
  [companyName]="section.companyName()"
  (retry)="section.retry()">
  @if (section.data()) {
    <lfx-stat-card-grid [cards]="cards()" [columns]="columns()" data-testid="cdp-company-dashboard-stats" />
  }
</lfx-cdp-company-section-frame>
