<div class="flex flex-col gap-[24px]" data-testid="health-metrics-overview-page">
  @if (blank(); as blank) {
    <!-- Pixel sizes follow the design; the 14px root makes the rem scale undershoot them. -->
    <section
      class="flex min-h-[440px] flex-col items-center justify-center gap-[10px] rounded-[20px] border border-gray-200 bg-white px-[24px] py-[48px] text-center"
      aria-labelledby="health-metrics-overview-blank-title"
      data-testid="health-metrics-overview-blank">
      <div class="mb-[8px] flex h-[82px] items-start justify-center gap-[10px]" aria-hidden="true">
        @for (tile of blankTiles; track tile.icon) {
          <span
            class="inline-flex h-[48px] w-[48px] items-center justify-center rounded-[14px] border border-gray-200 bg-white shadow-sm"
            [style.transform]="tile.transform">
            <i class="text-gray-600" [class]="tile.icon" [style.font-size.px]="tile.iconSizePx"></i>
          </span>
        }
      </div>
      <h2 id="health-metrics-overview-blank-title" class="m-0 text-[18px] font-semibold text-gray-900">{{ blank.title }}</h2>
      <p class="m-0 max-w-full text-pretty text-[14px] leading-[1.55] text-gray-500" data-testid="health-metrics-overview-blank-lead">{{ blank.lead }}</p>
      <ul class="m-0 mt-[10px] flex w-full max-w-[460px] list-none flex-col p-0" data-testid="health-metrics-overview-blank-reasons">
        @for (reason of blank.reasons; track $index; let first = $first) {
          <li
            class="text-pretty py-[10px] text-center text-[12.5px] font-medium leading-[1.5] text-gray-400"
            [class.border-t]="!first"
            [class.border-gray-200]="!first">
            {{ reason }}
          </li>
        }
      </ul>
    </section>
  }

  <!-- Rows wrap: a wide card takes about two thirds of a row and a narrow one a third, stacking once they no longer fit. -->
  <div class="flex flex-col gap-[24px]" [class.hidden]="!!blank()" data-testid="health-metrics-overview-cards">
    <div class="flex flex-wrap items-stretch gap-[24px]">
      <lfx-overview-orgs-card class="flex-[2_1_560px]" />
      <lfx-overview-nps-card class="flex-[1_1_340px]" />
    </div>
    <div class="flex flex-wrap items-stretch gap-[24px]">
      <lfx-overview-churn-card class="flex-[2_1_560px]" />
      <lfx-overview-balance-card class="flex-[1_1_340px]" />
    </div>
    <lfx-overview-events-card />
    <div class="flex flex-wrap items-stretch gap-[24px]">
      <lfx-overview-training-card class="flex-[2_1_560px]" />
      <lfx-overview-code-card class="flex-[1_1_340px]" />
    </div>
    <lfx-overview-board-card />
  </div>
</div>
