<!-- Pixel sizes follow the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="overview-event-dialog">
  <div class="flex flex-wrap items-start justify-between gap-[16px]">
    <div class="flex min-w-0 flex-[1_1_320px] flex-col gap-[4px]">
      <h2 #heading class="m-0 text-[18px] font-semibold leading-[1.3] text-gray-900 outline-none" tabindex="-1" [id]="headingId">{{ event.eventName }}</h2>
      <span class="text-[12px] text-gray-500" data-testid="overview-event-dialog-meta">{{ meta }}</span>
    </div>
    <div class="ml-auto flex flex-none items-start gap-[12px]">
      <div class="flex flex-wrap items-center gap-[8px] pt-[4px]" data-testid="overview-event-dialog-badges">
        <lfx-ui-badge [variant]="badges().goal.variant" [tone]="badges().goal.tone" data-testid="overview-event-dialog-goal"
          ><i [class]="badges().goal.icon" aria-hidden="true"></i>{{ badges().goal.label }}</lfx-ui-badge
        >
        @if (badges().days; as days) {
          <lfx-ui-badge [variant]="days.variant" [tone]="days.tone" data-testid="overview-event-dialog-days"
            ><i [class]="days.icon" aria-hidden="true"></i>{{ days.label }}</lfx-ui-badge
          >
        }
      </div>
      <button
        type="button"
        class="inline-flex h-[32px] w-[32px] flex-none items-center justify-center rounded-full border-0 bg-transparent text-gray-500 hover:bg-gray-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"
        aria-label="Close"
        data-testid="overview-event-dialog-close"
        (click)="close()">
        <i class="fa-light fa-xmark text-[16px]" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="relative -mb-[4px]">
    <lfx-ui-tabs
      ariaLabel="Event details"
      idPrefix="overview-event-dialog"
      [tabs]="tabs"
      [value]="tab()"
      (valueChange)="onTabChange($event)"
      data-testid="overview-event-dialog-tabs" />
    <lfx-ui-button
      class="absolute right-0 top-1/2 -translate-y-1/2"
      variant="tertiary"
      size="small"
      icon="fa-light fa-arrow-down-to-line"
      [loading]="exporting()"
      [disabled]="!canExport()"
      (click)="downloadPng()"
      data-testid="overview-event-dialog-png"
      >Download PNG</lfx-ui-button
    >
  </div>

  <!-- Display classes stay off the panels, so `hidden` is never overridden; each keeps its state while the other shows. -->
  <div
    #trendPanel
    class="mt-[12px]"
    role="tabpanel"
    id="overview-event-dialog-panel-trend"
    aria-labelledby="overview-event-dialog-tab-trend"
    [hidden]="tab() !== 'trend'"
    data-testid="overview-event-dialog-panel-trend">
    <lfx-overview-event-trend [event]="event" [isPast]="isPast" [reads]="reads()" [status]="status()" />
  </div>
  @if (snapshotShown()) {
    <!-- 674px is the Snapshot tables' own minimum, which a capture widens the panel to. -->
    <div
      #snapshotPanel
      class="mt-[12px] data-[exporting]:min-w-[674px]"
      role="tabpanel"
      id="overview-event-dialog-panel-snapshot"
      aria-labelledby="overview-event-dialog-tab-snapshot"
      [hidden]="tab() !== 'snapshot'"
      data-testid="overview-event-dialog-panel-snapshot">
      <lfx-overview-event-snapshot [eventId]="event.eventId" />
    </div>
  }
</div>
