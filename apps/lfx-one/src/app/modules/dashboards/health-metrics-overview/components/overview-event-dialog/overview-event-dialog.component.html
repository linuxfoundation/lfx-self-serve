<!-- Pixel sizes follow the design; the 14px root makes the rem scale undershoot them. The dialog renders on <body>, so it
     carries its own truncation tips. On a phone the trend tab takes the dialog's full height. -->
<div
  class="relative flex min-h-0 flex-auto flex-col gap-[16px] pt-[22px] max-[640px]:pt-[16px]"
  [class]="tab() === 'trend' ? 'max-[640px]:basis-[100dvh]' : ''"
  lfxHealthMetricsTruncationTip
  data-testid="overview-event-dialog">
  <button
    type="button"
    class="absolute right-[18px] top-[18px] z-[2] inline-flex h-[32px] w-[32px] items-center justify-center rounded-full border-0 bg-transparent text-gray-500 hover:bg-gray-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 max-[640px]:right-[10px] max-[640px]:top-[10px]"
    aria-label="Close"
    data-testid="overview-event-dialog-close"
    (click)="close()">
    <i class="fa-light fa-xmark text-[16px]" aria-hidden="true"></i>
  </button>

  <!-- The header and the tabs stay put; only the body under them scrolls. -->
  <div class="flex flex-none flex-col gap-[16px] px-[22px] max-[640px]:px-[16px]">
    <!-- 40px on the right keeps the header clear of the close button. -->
    <div class="flex flex-wrap items-start justify-between gap-x-[16px] gap-y-[12px] pr-[40px]">
      <div class="flex min-w-0 flex-[1_1_320px] flex-col gap-[4px]">
        <h2 #heading class="m-0 text-[18px] font-semibold leading-[1.3] text-gray-900 outline-none" tabindex="-1" [id]="headingId">{{ event.eventName }}</h2>
        <span class="text-[12px] text-gray-500" data-testid="overview-event-dialog-meta">{{ meta }}</span>
      </div>
      <div
        class="ml-auto flex flex-[0_1_auto] flex-wrap items-center gap-[8px] pt-[4px] max-[640px]:ml-0 max-[640px]:basis-full max-[640px]:pt-0"
        data-testid="overview-event-dialog-badges">
        <lfx-ui-badge [size]="badgeSize()" [variant]="badges().goal.variant" [tone]="badges().goal.tone" data-testid="overview-event-dialog-goal"
          ><i [class]="badges().goal.icon" aria-hidden="true"></i>{{ badges().goal.label }}</lfx-ui-badge
        >
        @if (badges().days; as days) {
          <lfx-ui-badge [size]="badgeSize()" [variant]="days.variant" [tone]="days.tone" data-testid="overview-event-dialog-days"
            ><i [class]="days.icon" aria-hidden="true"></i>{{ days.label }}</lfx-ui-badge
          >
        }
      </div>
    </div>

    <div class="relative -mb-[4px]">
      <!-- On a phone the tabs keep 40px clear of the icon-only Download PNG. -->
      <lfx-ui-tabs
        class="block max-[640px]:pr-[40px]"
        ariaLabel="Event details"
        idPrefix="overview-event-dialog"
        [tabs]="tabs"
        [value]="tab()"
        (valueChange)="onTabChange($event)"
        data-testid="overview-event-dialog-tabs" />
      @if (isPhone()) {
        <lfx-ui-button
          class="absolute right-0 top-1/2 -translate-y-1/2"
          variant="secondary"
          size="small"
          icon="fa-light fa-arrow-down-to-line"
          iconOnly
          ariaLabel="Download PNG"
          [loading]="exporting()"
          [disabled]="!canExport()"
          (click)="downloadPng()"
          data-testid="overview-event-dialog-png" />
      } @else {
        <lfx-ui-button
          class="absolute right-0 top-1/2 -translate-y-1/2"
          variant="tertiary"
          size="small"
          icon="fa-light fa-arrow-down-to-line"
          [loading]="exporting()"
          [disabled]="!canExport()"
          (click)="downloadPng()"
          data-testid="overview-event-dialog-png"
          >Download PNG</lfx-ui-button
        >
      }
    </div>
  </div>

  <!-- The trend never scrolls, as its chart fits the height; the Snapshot fades at an edge with more to scroll. -->
  <div
    #body
    class="flex min-h-0 flex-auto flex-col px-[22px] pb-[22px] max-[640px]:px-[16px] max-[640px]:pb-[16px]"
    [class]="tab() === 'trend' ? 'overflow-hidden' : 'overflow-y-auto'"
    [style.mask-image]="bodyMask()"
    [style.-webkit-mask-image]="bodyMask()"
    (scroll)="measureFade()"
    data-testid="overview-event-dialog-body">
    <!-- One wrapper for both panels, so a resize observer sees the Snapshot load; only the trend shrinks to fit. -->
    <div #bodyContent class="flex flex-col" [class]="tab() === 'trend' ? 'min-h-0 flex-auto' : ''">
      <!-- Display classes go on a panel only while it shows, so `hidden` is never overridden; each keeps its state. -->
      <div
        #trendPanel
        class="mt-[12px]"
        [class]="tab() === 'trend' ? 'flex min-h-0 flex-auto flex-col' : ''"
        role="tabpanel"
        id="overview-event-dialog-panel-trend"
        aria-labelledby="overview-event-dialog-tab-trend"
        [hidden]="tab() !== 'trend'"
        data-testid="overview-event-dialog-panel-trend">
        <lfx-overview-event-trend [event]="event" [isPast]="isPast" [reads]="reads()" [status]="status()" />
      </div>
      @if (snapshotShown()) {
        <!-- 674px is the Snapshot tables' own desktop minimum, which a capture widens the panel to. -->
        <div
          #snapshotPanel
          class="mt-[12px] data-[exporting]:min-w-[674px] max-[640px]:mt-[8px]"
          role="tabpanel"
          id="overview-event-dialog-panel-snapshot"
          aria-labelledby="overview-event-dialog-tab-snapshot"
          [hidden]="tab() !== 'snapshot'"
          data-testid="overview-event-dialog-panel-snapshot">
          <lfx-overview-event-snapshot [eventId]="event.eventId" [compact]="snapshotCompact()" />
        </div>
      }
    </div>
  </div>
</div>
