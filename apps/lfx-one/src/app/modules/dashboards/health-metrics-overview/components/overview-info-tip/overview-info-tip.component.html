<i
  class="fa-light fa-circle-question cursor-help rounded-full text-gray-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"
  [class]="size() === 'title' ? 'text-[14px]' : 'text-[13px]'"
  role="img"
  tabindex="0"
  tooltipEvent="both"
  tooltipPosition="bottom"
  tooltipStyleClass="lfx-hm-tip"
  [attr.aria-label]="text()"
  [pTooltip]="text()"></i>
