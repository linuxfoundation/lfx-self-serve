<!-- Arbitrary [Npx] values throughout match the design's exact pixel sizes, per .claude/rules/styling.md's
     rem-scale-undershoot exception (this app's 14px root font makes e.g. `text-xs` render ~10.5px, not 12px). -->
@if (tile().tabRoute; as tabRoute) {
  <!-- The whole tile opens the top of its tab, as the tab bar does; hover and focus reveal the chevron.
       No aria-label: the link's name comes from the tile's figures and status, which a label would hide. -->
  <a
    [routerLink]="tabRoute"
    queryParamsHandling="preserve"
    [attr.title]="'Open ' + tile().name"
    class="group relative flex h-full flex-col gap-[16px] p-[20px] transition-colors hover:bg-gray-50 focus-visible:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-inset"
    data-testid="health-metrics-overview-tile-link">
    <ng-container [ngTemplateOutlet]="tileBody" />
    <i
      class="fa-light fa-chevron-right absolute top-[12px] right-[12px] text-[12px] text-gray-400 opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
      aria-hidden="true"></i>
  </a>
} @else {
  <div class="flex h-full flex-col gap-[16px] p-[20px]">
    <ng-container [ngTemplateOutlet]="tileBody" />
  </div>
}

<ng-template #tileBody>
  <div class="flex items-center gap-2">
    <i [class]="tile().icon + ' w-[20px] text-center text-[18px] text-gray-900'" aria-hidden="true"></i>
    <span class="text-[12px] font-semibold text-gray-900">{{ tile().name }}</span>
  </div>

  <div class="flex flex-col gap-0.5">
    <span class="text-[24px] font-medium text-gray-900">{{ tile().statValue }}</span>
    <span class="text-[12px] text-gray-600 first-letter:uppercase" data-testid="health-metrics-overview-tile-caption">{{ tile().statLabel }}</span>
  </div>

  <!-- Rendered only with content, so a statusless tile doesn't carry an empty row's gap. -->
  @if (tile().insightsUrl; as insightsUrl) {
    <a
      [href]="insightsUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="self-start text-xs font-medium text-blue-600 hover:underline"
      data-testid="health-metrics-overview-tile-insights-link">
      LFX Insights <i class="fa-light fa-arrow-up-right-from-square" aria-hidden="true"></i>
    </a>
  } @else if (tile().showStatus !== false) {
    <span
      class="flex items-center gap-1.5 text-xs font-medium"
      [ngClass]="classificationMeta().statusTextClass"
      data-testid="health-metrics-overview-tile-status">
      <i [class]="classificationMeta().icon" aria-hidden="true"></i>
      {{ classificationMeta().label }}
    </span>
  }
</ng-template>
