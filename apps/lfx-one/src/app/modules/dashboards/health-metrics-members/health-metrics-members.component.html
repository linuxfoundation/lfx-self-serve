<!-- Each data section reports its reads to the shell, which holds a deep link until they all land. -->
<lfx-health-metrics-l2-shell
  #shell
  [sections]="sections"
  [idPrefix]="idPrefix"
  [dataSections]="dataSections"
  [subNavItems]="subNavItems()"
  navLabel="Members sections"
  testIdPrefix="members">
  <ng-template lfxHealthMetricsL2Section="tiers">
    <div class="flex flex-col gap-6">
      <lfx-members-tiers (reading)="shell.sectionReading('tiers')" (settled)="shell.sectionSettled('tiers')" />
      <lfx-members-bridge
        (reading)="shell.sectionReading('bridge', 'tiers')"
        (settled)="shell.sectionSettled('bridge', 'tiers')"
        (sectionPicked)="shell.scrollToSection($event)" />
    </div>
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="list">
    <lfx-members-directory (countChange)="listCount.set($event)" (reading)="shell.sectionReading('list')" (settled)="shell.sectionSettled('list')" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="risk">
    <lfx-members-at-risk (noteChange)="riskNote.set($event)" (reading)="shell.sectionReading('risk')" (settled)="shell.sectionSettled('risk')" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="renewals">
    <lfx-members-renewals (countChange)="renewalsCount.set($event)" (reading)="shell.sectionReading('renewals')" (settled)="shell.sectionSettled('renewals')" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="board">
    <lfx-members-board-attendance (noteChange)="boardNote.set($event)" (reading)="shell.sectionReading('board')" (settled)="shell.sectionSettled('board')" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="nps">
    <lfx-members-nps (reading)="shell.sectionReading('nps')" (settled)="shell.sectionSettled('nps')" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="churn">
    <lfx-members-churn (reading)="shell.sectionReading('churn')" (settled)="shell.sectionSettled('churn')" />
  </ng-template>
</lfx-health-metrics-l2-shell>
