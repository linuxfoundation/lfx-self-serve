<!-- Each data section reports its reads to the shell, which holds a deep link until they all land. -->
<lfx-health-metrics-l2-shell
  #shell
  [sections]="sections"
  [idPrefix]="idPrefix"
  [dataSections]="dataSections"
  [subNavItems]="subNavItems()"
  [blank]="blank"
  navLabel="Members sections"
  testIdPrefix="members">
  <ng-template lfxHealthMetricsL2Section="growth">
    <lfx-members-growth (reading)="shell.sectionReading('growth')" (settled)="shell.sectionSettled('growth', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="breakdown">
    <lfx-members-breakdown (reading)="shell.sectionReading('breakdown')" (settled)="shell.sectionSettled('breakdown', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="list">
    <lfx-members-directory (reading)="shell.sectionReading('list')" (settled)="shell.sectionSettled('list', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="risk">
    <lfx-members-at-risk (noteChange)="riskNote.set($event)" (reading)="shell.sectionReading('risk')" (settled)="shell.sectionSettled('risk', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="renewals">
    <lfx-members-renewals (reading)="shell.sectionReading('renewals')" (settled)="shell.sectionSettled('renewals', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="board">
    <lfx-members-board-attendance
      (noteChange)="boardNote.set($event)"
      (reading)="shell.sectionReading('board')"
      (settled)="shell.sectionSettled('board', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="nps">
    <lfx-members-nps (reading)="shell.sectionReading('nps')" (settled)="shell.sectionSettled('nps', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="churn">
    <lfx-members-churn (reading)="shell.sectionReading('churn')" (settled)="shell.sectionSettled('churn', $event)" />
  </ng-template>
</lfx-health-metrics-l2-shell>
