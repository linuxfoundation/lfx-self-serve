<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="members-at-risk">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Members at risk unavailable"
      subtitle="We could not load this foundation's overdue balances. Refresh the page to try again."
      data-testid="members-at-risk-error" />
  } @else if (firstRead()) {
    <p-skeleton height="24rem" borderRadius="0.5rem" data-testid="members-at-risk-loading" aria-hidden="true" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else {
    <lfx-health-metrics-metrics-row [items]="metrics()" testId="members-at-risk-metrics" />

    @if (!loading() && totalRecords() === 0) {
      <p class="m-0 py-[24px] text-center text-[13px] text-gray-500" data-testid="members-at-risk-no-match">Nothing matches this view.</p>
    } @else {
      <!-- The design's 620px minimum; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [rowHover]="false"
        [value]="rowViews()"
        [loading]="loading()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '620px' }"
        data-testid="members-at-risk-table">
        <ng-template #header>
          <tr>
            <th scope="col" [attr.aria-sort]="sorting.headers().company.ariaSort">
              <lfx-health-metrics-th
                label="Company"
                [sort]="sorting.headers().company.state"
                (sorted)="sorting.toggle('company')"
                data-testid="members-at-risk-sort-company" />
            </th>
            <th scope="col" class="w-[22%]" [attr.aria-sort]="sorting.headers().membership.ariaSort">
              <lfx-health-metrics-th
                label="Membership"
                [sort]="sorting.headers().membership.state"
                (sorted)="sorting.toggle('membership')"
                data-testid="members-at-risk-sort-membership" />
            </th>
            <th scope="col" class="w-[16%] text-right" [attr.aria-sort]="sorting.headers().overdue.ariaSort">
              <lfx-health-metrics-th
                label="Overdue"
                [sort]="sorting.headers().overdue.state"
                (sorted)="sorting.toggle('overdue')"
                data-testid="members-at-risk-sort-overdue" />
            </th>
            <!-- The design's 16px spacer between the amount and its age; it has no header, so it does not sort. -->
            <td class="w-[16px]" aria-hidden="true"></td>
            <th scope="col" class="w-[16%]" [attr.aria-sort]="sorting.headers().age.ariaSort">
              <lfx-health-metrics-th label="Age" [sort]="sorting.headers().age.state" (sorted)="sorting.toggle('age')" data-testid="members-at-risk-sort-age" />
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <tr [attr.data-testid]="'members-at-risk-row-' + view.accountId">
            <td>
              <lfx-health-metrics-cell
                [text]="view.name"
                [lead]="{ kind: 'company', name: view.name, logoUrl: view.logoUrl }"
                [description]="view.lastEngagedLabel"
                [attr.data-testid]="'members-at-risk-row-' + view.accountId + '-name'" />
            </td>
            <td>
              <lfx-health-metrics-cell
                textClass="text-gray-900"
                [text]="view.membershipLabel"
                [tier]="view.tier"
                [attr.data-testid]="'members-at-risk-row-' + view.accountId + '-membership'" />
            </td>
            <td>
              <lfx-health-metrics-cell class="items-end" [text]="view.overdueLabel" [attr.data-testid]="'members-at-risk-row-' + view.accountId + '-overdue'" />
            </td>
            <td aria-hidden="true"></td>
            <td>
              <lfx-health-metrics-cell
                [text]="view.ageLabel"
                [dotClass]="view.ageDotClass"
                [attr.data-testid]="'members-at-risk-row-' + view.accountId + '-age'" />
            </td>
          </tr>
        </ng-template>
      </lfx-table>

      <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
    }
  }
</div>
