<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="members-renewals">
  @if (firstRead()) {
    <p-skeleton height="20rem" borderRadius="0.5rem" data-testid="members-renewals-loading" aria-hidden="true" />
  } @else if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Renewals unavailable"
      subtitle="We could not load this foundation's upcoming renewals. Refresh the page to try again."
      data-testid="members-renewals-error" />
  } @else if (windowRead()) {
    <p-skeleton height="16rem" borderRadius="0.5rem" data-testid="members-renewals-loading" aria-hidden="true" />
  } @else if (!loading() && noneDue()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-calendar-check"
      [title]="'No renewals ' + windowPhrase()"
      subtitle="No membership renews inside this window."
      data-testid="members-renewals-empty" />
  } @else {
    <lfx-health-metrics-metrics-row [items]="metrics()" testId="members-renewals-metrics" />

    <!-- The design's 600px minimum; a narrower card scrolls the table sideways. -->
    <lfx-table
      styleClass="hm-table"
      [rowHover]="false"
      [value]="rowViews()"
      [loading]="loading()"
      [paginator]="false"
      [tableStyle]="{ 'min-width': '600px' }"
      data-testid="members-renewals-table">
      <ng-template #header>
        <tr>
          <th scope="col" [attr.aria-sort]="sorting.headers().company.ariaSort">
            <lfx-health-metrics-th
              label="Company"
              [sort]="sorting.headers().company.state"
              (sorted)="sorting.toggle('company')"
              data-testid="members-renewals-sort-company" />
          </th>
          <th scope="col" class="w-[24%]" [attr.aria-sort]="sorting.headers().membership.ariaSort">
            <lfx-health-metrics-th
              label="Membership"
              [sort]="sorting.headers().membership.state"
              (sorted)="sorting.toggle('membership')"
              data-testid="members-renewals-sort-membership" />
          </th>
          <th scope="col" class="w-[20%]" [attr.aria-sort]="sorting.headers().date.ariaSort">
            <lfx-health-metrics-th
              label="Renewal date"
              [sort]="sorting.headers().date.state"
              (sorted)="sorting.toggle('date')"
              data-testid="members-renewals-sort-date" />
          </th>
          <th scope="col" class="w-[16%] text-right" [attr.aria-sort]="sorting.headers().dues.ariaSort">
            <lfx-health-metrics-th
              label="Dues"
              [sort]="sorting.headers().dues.state"
              (sorted)="sorting.toggle('dues')"
              data-testid="members-renewals-sort-dues" />
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-view>
        <tr [attr.data-testid]="'members-renewals-row-' + view.accountId">
          <td>
            <lfx-health-metrics-cell
              [text]="view.name"
              [lead]="{ kind: 'company', name: view.name, logoUrl: view.logoUrl }"
              [attr.data-testid]="'members-renewals-row-' + view.accountId + '-name'" />
          </td>
          <td>
            <lfx-health-metrics-cell
              textClass="text-gray-900"
              [text]="view.membershipLabel"
              [tier]="view.tier"
              [attr.data-testid]="'members-renewals-row-' + view.accountId + '-membership'" />
          </td>
          <td>
            <lfx-health-metrics-cell [text]="view.renewalDateLabel" [attr.data-testid]="'members-renewals-row-' + view.accountId + '-date'" />
          </td>
          <td>
            <lfx-health-metrics-cell class="items-end" [text]="view.duesLabel" [attr.data-testid]="'members-renewals-row-' + view.accountId + '-dues'" />
          </td>
        </tr>
      </ng-template>
    </lfx-table>

    <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
  }
</div>
