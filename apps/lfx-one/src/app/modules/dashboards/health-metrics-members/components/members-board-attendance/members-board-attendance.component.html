<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="members-board">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Attendance unavailable"
      subtitle="We could not load this foundation's meeting attendance. Refresh the page to try again."
      data-testid="members-board-error" />
  } @else if (firstRead()) {
    <p-skeleton height="24rem" borderRadius="0.5rem" data-testid="members-board-loading" aria-hidden="true" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else if (!loading() && noMeetings()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-calendar"
      [title]="'No ' + meetingNoun() + 's in this period'"
      subtitle="Attendance appears here once a meeting in the selected period is recorded."
      data-testid="members-board-empty" />
  } @else {
    <lfx-health-metrics-metrics-row [items]="metrics()" testId="members-board-metrics" />

    @if (chart().bars.length > 0) {
      <div class="flex flex-col gap-[8px]" data-testid="members-board-trend">
        <h3 class="m-0 mt-[4px] text-[11px] font-semibold uppercase tracking-[0.06em] text-gray-500">Attendance by meeting</h3>
        <lfx-health-metrics-bar-chart [chart]="chart()" testId="members-board-chart" />
      </div>
    }

    <!-- The design's 560px minimum; a narrower card scrolls the table sideways. -->
    <lfx-table
      styleClass="hm-table"
      [rowHover]="false"
      [value]="rowViews()"
      [loading]="loading()"
      [paginator]="false"
      [tableStyle]="{ 'min-width': '560px' }"
      data-testid="members-board-table">
      <ng-template #header>
        <tr>
          <th scope="col" [attr.aria-sort]="sorting.headers().meeting.ariaSort">
            <lfx-health-metrics-th
              label="Meeting"
              [sort]="sorting.headers().meeting.state"
              (sorted)="sorting.toggle('meeting')"
              data-testid="members-board-sort-meeting" />
          </th>
          <th scope="col" class="w-[24%]" [attr.aria-sort]="sorting.headers().date.ariaSort">
            <lfx-health-metrics-th label="Date" [sort]="sorting.headers().date.state" (sorted)="sorting.toggle('date')" data-testid="members-board-sort-date" />
          </th>
          <!-- Exact px: the design's 170px attendance column. -->
          <th scope="col" class="w-[170px]" [attr.aria-sort]="sorting.headers().attendance.ariaSort">
            <lfx-health-metrics-th
              label="Attendance"
              [sort]="sorting.headers().attendance.state"
              (sorted)="sorting.toggle('attendance')"
              data-testid="members-board-sort-attendance" />
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-view>
        <tr [attr.data-testid]="'members-board-row-' + view.meetingId">
          <td>
            <lfx-health-metrics-cell [text]="view.meetingName" [attr.data-testid]="'members-board-row-' + view.meetingId + '-name'" />
          </td>
          <td>
            <lfx-health-metrics-cell [text]="view.dateLabel" [attr.data-testid]="'members-board-row-' + view.meetingId + '-date'" />
          </td>
          <td [attr.data-testid]="'members-board-row-' + view.meetingId + '-attendance'">
            <lfx-health-metrics-progress-cell [value]="view.attendanceLabel" [pct]="view.attendancePct" [fillClass]="view.fillClass" />
          </td>
        </tr>
      </ng-template>
    </lfx-table>

    <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
  }
</div>
