<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="engagement-meeting-participation">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Meeting participation unavailable"
      subtitle="We could not load meeting participation for this foundation. Refresh the page to try again."
      data-testid="engagement-meeting-participation-error" />
  } @else if (loading()) {
    <p-skeleton height="8rem" borderRadius="0.5rem" data-testid="engagement-meeting-participation-loading" aria-hidden="true" />
  } @else if (!empty()) {
    <lfx-health-metrics-metrics-row [items]="metrics()" testId="engagement-meeting-participation-metrics" />

    @if (lowConfidence()) {
      <lfx-ui-note variant="warning" size="small" data-testid="engagement-meeting-participation-low-confidence">
        Too few meetings in this period to report an attendance rate with confidence.
      </lfx-ui-note>
    }

    @if (rowViews().length) {
      <!-- The design's 520px minimum; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [value]="rowViews()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '520px' }"
        data-testid="engagement-meeting-participation-table">
        <ng-template #header>
          <tr>
            <th scope="col">Meeting type</th>
            <!-- Exact px: the design's 240px attendance column, and meetings held about a quarter of the rest. -->
            <th scope="col" class="w-[20%]">Meetings held</th>
            <th scope="col" class="w-[240px]">Attendance</th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <!-- The whole row is the target, as in the design: the board opens Members board attendance, every other
               type scrolls to Group attendance. The name carries the same action for keyboards and screen readers. -->
          <tr class="cursor-pointer" (click)="onRowPicked(view.governance)" [attr.data-testid]="'engagement-meeting-participation-row-' + view.key">
            <td>
              <lfx-health-metrics-cell
                [text]="view.name"
                [lead]="{ kind: 'icon', icon: view.icon }"
                [description]="view.description"
                [descriptionEndIcon]="view.governance ? 'fa-light fa-angle-right' : ''">
                <!-- An invisible control over the name, so the cell keeps the design's plain text and a focus ring. -->
                @if (view.governance) {
                  <a
                    class="absolute inset-0 rounded-[8px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"
                    [routerLink]="boardRoute"
                    fragment="board"
                    [queryParams]="boardQueryParams"
                    queryParamsHandling="merge"
                    [attr.aria-label]="view.name + ': ' + view.description"
                    (click)="$event.stopPropagation()"
                    [attr.data-testid]="'engagement-meeting-participation-row-' + view.key + '-link'"></a>
                } @else {
                  <button
                    type="button"
                    class="absolute inset-0 rounded-[8px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"
                    [attr.aria-label]="view.name + ': show group attendance'"
                    (click)="$event.stopPropagation(); onRowPicked(false)"
                    [attr.data-testid]="'engagement-meeting-participation-row-' + view.key + '-link'"></button>
                }
              </lfx-health-metrics-cell>
            </td>
            <td><lfx-health-metrics-cell [text]="view.meetings" /></td>
            <td>
              <lfx-health-metrics-value-bar [value]="view.attendanceLabel" [pct]="view.attendancePct" [fillRule]="view.fillRule" [barWidthPx]="160" />
            </td>
          </tr>
        </ng-template>
      </lfx-table>
    }
  }
</div>
