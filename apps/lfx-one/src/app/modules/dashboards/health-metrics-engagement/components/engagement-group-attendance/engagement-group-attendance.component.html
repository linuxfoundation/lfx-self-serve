<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="engagement-group-attendance">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Group attendance unavailable"
      subtitle="We could not load group attendance for this foundation. Refresh the page to try again."
      data-testid="engagement-group-attendance-error" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else if (!loading() && totalRecords() === 0) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-users-rectangle"
      title="No groups of this type"
      subtitle="This foundation has no groups matching the selected filter."
      [resettable]="true"
      (resetFilters)="onResetFilters()"
      data-testid="engagement-group-attendance-empty" />
  } @else {
    <!-- The design's 620px minimum; a narrower card scrolls the table sideways. Rows are not clickable. -->
    <lfx-table
      styleClass="hm-table"
      [rowHover]="false"
      [value]="rowViews()"
      [loading]="loading()"
      [paginator]="false"
      [tableStyle]="{ 'min-width': '620px' }"
      data-testid="engagement-group-attendance-table">
      <ng-template #header>
        <tr>
          <th scope="col">Group</th>
          <!-- Exact px: the design's 140px attendance column; the middle two share the rest about 5:8. -->
          <th scope="col" class="w-[12%]">Meetings</th>
          <th scope="col" class="w-[18%]">Last meeting</th>
          <th scope="col" class="w-[140px]">Attendance</th>
        </tr>
      </ng-template>

      <ng-template #body let-view>
        <tr [attr.data-testid]="'engagement-group-attendance-row-' + view.key">
          <td>
            <lfx-health-metrics-cell [text]="view.name" [description]="view.kind.label" [descriptionIcon]="view.kind.icon" />
          </td>
          <td>{{ view.meetings }}</td>
          <td [class.text-gray-400]="view.lastMetLabel === '—'">{{ view.lastMetLabel }}</td>
          <td>
            @if (view.dormant) {
              <!-- Focusable for its tooltip, so it carries a role; its name is the label and the tooltip describes it. -->
              <lfx-ui-badge
                tone="danger"
                role="img"
                tabindex="0"
                class="cursor-help focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
                [attr.aria-label]="dormantTip.title + ': ' + dormantTip.text"
                [lfxUiTooltipTitle]="dormantTip.title"
                [lfxUiTooltip]="dormantTip.text"
                [attr.data-testid]="'engagement-group-attendance-dormant-' + view.key"
                >{{ dormantTip.title }}</lfx-ui-badge
              >
            } @else {
              <lfx-health-metrics-value-bar [value]="view.attendanceLabel" [pct]="view.attendancePct" />
            }
          </td>
        </tr>
      </ng-template>
    </lfx-table>

    <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [page]="pageIndex()" (pageChange)="onPageChange($event)" />
  }
</div>
