<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="engagement-representatives">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Representatives unavailable"
      subtitle="We could not load representatives for this foundation. Refresh the page to try again."
      data-testid="engagement-representatives-error" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else {
    <!-- The search fills the row from 240px, and the whole width on phones. -->
    <div class="flex flex-wrap items-center gap-[10px]">
      <lfx-ui-search-input
        class="min-w-[240px] flex-[1_1_240px] max-[640px]:min-w-0 max-[640px]:basis-full"
        placeholder="Search person or company..."
        ariaLabel="Search person or company"
        [(value)]="searchText"
        data-testid="engagement-representatives-search" />
    </div>

    @if (!loading() && totalRecords() === 0) {
      <lfx-empty-state
        variant="compact"
        icon="fa-light fa-magnifying-glass"
        title="No representatives match this filter"
        subtitle="Nobody in this scope falls into this group right now."
        [resettable]="true"
        (resetFilters)="onResetFilters()"
        data-testid="engagement-representatives-empty" />
    } @else {
      <!-- The design's 700px minimum; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [rowHover]="false"
        [value]="pageRows()"
        [loading]="loading()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '700px' }"
        data-testid="engagement-representatives-table">
        <ng-template #header>
          <tr>
            <th scope="col">Representative</th>
            <!-- Exact %: the design's 1.3 / 0.6 / 0.8 shares of the columns after Representative. -->
            <th scope="col" class="w-[28%]">Group</th>
            <th scope="col" class="w-[13%]">Attended</th>
            <th scope="col" class="w-[17%]">Last attended</th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <tr [attr.data-testid]="'engagement-representatives-row-' + view.key">
            <!-- An unresolved identity reads in italic neutral-500 behind a "?" avatar. -->
            <td [class.italic]="view.unresolved" [class.text-gray-500]="view.unresolved">
              <lfx-health-metrics-cell
                [text]="view.displayName"
                [lead]="{ kind: 'person', name: view.unresolved ? '?' : view.displayName, photoUrl: '' }"
                [description]="view.description" />
            </td>
            <td><lfx-health-metrics-cell [text]="view.committeeName" /></td>
            <td>
              @if (view.neverAttended) {
                <!-- The badge's colour carries "never attended", so screen readers get it in words. -->
                <lfx-ui-badge tone="danger" [attr.data-testid]="'engagement-representatives-row-' + view.key + '-never'"
                  >{{ view.attendedLabel }}<span class="sr-only"> — never attended</span></lfx-ui-badge
                >
              } @else {
                <lfx-health-metrics-cell [text]="view.attendedLabel" />
              }
            </td>
            <td><lfx-health-metrics-cell [text]="view.lastAttendedLabel" /></td>
          </tr>
        </ng-template>
      </lfx-table>

      <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
    }
  }
</div>
