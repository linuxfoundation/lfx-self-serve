@if (hasLine()) {
  <svg
    [attr.width]="width"
    [attr.height]="height"
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    role="img"
    [attr.aria-label]="ariaLabel()"
    data-testid="engagement-sparkline">
    <path [attr.d]="path()" fill="none" class="stroke-blue-500" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
} @else {
  <span class="text-[13px] text-gray-300" aria-hidden="true" data-testid="engagement-sparkline-empty">—</span>
}
