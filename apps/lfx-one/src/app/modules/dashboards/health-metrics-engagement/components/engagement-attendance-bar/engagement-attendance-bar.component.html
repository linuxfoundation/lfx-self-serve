<div class="flex items-center gap-2" data-testid="engagement-attendance-bar">
  <div class="h-1.5 min-w-0 flex-1 overflow-hidden rounded-full bg-gray-100">
    <div class="h-full rounded-full" [class]="fillClass()" [style.width.%]="widthPct()"></div>
  </div>

</div>
