<!-- The design's `.att`: a fixed 62×6px track, 9px gap and a 34px-min label, in exact px for the 14px root. -->
<div class="flex items-center justify-end gap-[9px]" data-testid="engagement-attendance-bar">
  <div class="h-[6px] w-[62px] shrink-0 overflow-hidden rounded-full bg-gray-100" data-testid="engagement-attendance-bar-track">
    <div class="h-full rounded-full" [class]="fillClass()" [style.width.%]="widthPct()"></div>
  </div>
  <span class="min-w-[34px] shrink-0 text-right text-[13px] font-semibold tabular-nums text-gray-900" data-testid="engagement-attendance-bar-label">{{
    label()
  }}</span>
</div>
