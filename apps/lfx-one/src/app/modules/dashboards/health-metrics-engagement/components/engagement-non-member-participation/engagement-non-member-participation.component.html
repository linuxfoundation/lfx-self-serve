<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="engagement-non-member-participation">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Non-member participation unavailable"
      subtitle="We could not load non-member participation for this foundation. Refresh the page to try again."
      data-testid="engagement-non-member-participation-error" />
  } @else if (!empty()) {
    <!-- The design's caution sits above the table it qualifies. -->
    <lfx-ui-note variant="warning" size="small" data-testid="engagement-non-member-participation-caution">{{ caution }}</lfx-ui-note>

    <!-- The design's 560px minimum; a narrower card scrolls the table sideways. -->
    <lfx-table
      styleClass="hm-table"
      [rowHover]="false"
      [value]="pageRows()"
      [loading]="loading()"
      [paginator]="false"
      [tableStyle]="{ 'min-width': '560px' }"
      data-testid="engagement-non-member-participation-table">
      <ng-template #header>
        <tr>
          <th scope="col" [attr.aria-sort]="sorting.headers().company.ariaSort">
            <lfx-health-metrics-th
              label="Company"
              [sort]="sorting.headers().company.state"
              (sorted)="sorting.toggle('company')"
              data-testid="engagement-non-member-participation-sort-company" />
          </th>
          <!-- Exact %: the design's 0.9 / 0.5 shares of the columns after Company. -->
          <th scope="col" class="w-[26%]" [attr.aria-sort]="sorting.headers().meetings.ariaSort">
            <lfx-health-metrics-th
              label="Meetings attended"
              [sort]="sorting.headers().meetings.state"
              (sorted)="sorting.toggle('meetings')"
              data-testid="engagement-non-member-participation-sort-meetings" />
          </th>
          <th scope="col" class="w-[15%]" [attr.aria-sort]="sorting.headers().people.ariaSort">
            <lfx-health-metrics-th
              label="People"
              [sort]="sorting.headers().people.state"
              (sorted)="sorting.toggle('people')"
              data-testid="engagement-non-member-participation-sort-people" />
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-view>
        <tr [attr.data-testid]="'engagement-non-member-participation-row-' + view.key">
          <td>
            <lfx-health-metrics-cell [text]="view.name" [lead]="{ kind: 'company', name: view.name, logoUrl: view.logoUrl }" />
          </td>
          <td><lfx-health-metrics-cell [text]="view.meetings" /></td>
          <td><lfx-health-metrics-cell [text]="view.people" /></td>
        </tr>
      </ng-template>
    </lfx-table>

    <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
  }
</div>
