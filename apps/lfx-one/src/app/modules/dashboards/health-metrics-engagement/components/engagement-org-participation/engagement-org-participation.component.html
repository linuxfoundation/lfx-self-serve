<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="engagement-org-participation">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Company participation unavailable"
      subtitle="We could not load company participation for this foundation. Refresh the page to try again."
      data-testid="engagement-org-participation-error" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else {
    <!-- The search fills the row from 240px, and the whole width on phones. -->
    <div class="flex flex-wrap items-center gap-[10px]">
      <lfx-ui-search-input
        class="min-w-[240px] flex-[1_1_240px] max-[640px]:min-w-0 max-[640px]:basis-full"
        placeholder="Search company..."
        ariaLabel="Search company"
        [(value)]="searchText"
        data-testid="engagement-org-participation-search" />
    </div>

    @if (!loading() && totalRecords() === 0) {
      <lfx-empty-state
        variant="compact"
        icon="fa-light fa-magnifying-glass"
        title="No companies match this filter"
        subtitle="No company in this scope matches the current search and activity filter."
        [resettable]="true"
        (resetFilters)="onResetFilters()"
        data-testid="engagement-org-participation-empty" />
    } @else {
      <!-- The design's 700px minimum; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [rowHover]="false"
        [value]="pageRows()"
        [loading]="loading()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '700px' }"
        data-testid="engagement-org-participation-table">
        <ng-template #header>
          <tr>
            <th scope="col">Company</th>
            <!-- Exact %: the design's 0.8 / 1.1 / 0.5 / 0.8 shares of the columns after Company. -->
            <th scope="col" class="w-[15%]">Membership</th>
            <th scope="col" class="w-[21%]">Meetings attended</th>
            <th scope="col" class="w-[10%]">Avg reps</th>
            <th scope="col" class="w-[15%]">Last engaged</th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <tr [attr.data-testid]="'engagement-org-participation-row-' + view.key">
            <td>
              <lfx-health-metrics-cell [text]="view.name" [lead]="{ kind: 'company', name: view.name, logoUrl: view.logoUrl }" />
            </td>
            <!-- A non-member reads in neutral-500; a tier reads in the row's ink, after its icon. -->
            <td [class.text-gray-500]="!view.isMember">
              <lfx-health-metrics-cell [text]="view.membership" [tier]="view.tier" />
            </td>
            <td>
              @if (view.attendedPct === null) {
                <lfx-health-metrics-cell [text]="view.attendedLabel" />
              } @else {
                <lfx-health-metrics-progress-cell [value]="view.attendedLabel" [pct]="view.attendedPct" [fillClass]="view.attendedFillClass" />
              }
            </td>
            <td><lfx-health-metrics-cell [text]="view.avgRepsLabel" /></td>
            <td><lfx-health-metrics-cell [text]="view.lastEngagedLabel" /></td>
          </tr>
        </ng-template>
      </lfx-table>

      <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
    }
  }
</div>
