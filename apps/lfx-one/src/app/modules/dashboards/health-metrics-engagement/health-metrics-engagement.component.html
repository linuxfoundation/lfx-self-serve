<!-- Each data section reports its reads to the shell, which holds a deep link until they all land.
     `trend` projects no body: its chart is blocked on a quarterly grain, a follow-up on #2802. -->
<lfx-health-metrics-l2-shell
  #shell
  [sections]="sections"
  [idPrefix]="idPrefix"
  [dataSections]="dataSections"
  [subNavItems]="subNavItems()"
  navLabel="Engagement sections"
  testIdPrefix="engagement"
  [crossReferenceNote]="crossReferenceNote">
  <ng-template lfxHealthMetricsL2Section="participation">
    <lfx-engagement-meeting-participation
      (sectionPicked)="shell.scrollToSection($event)"
      (reading)="shell.sectionReading('participation')"
      (settled)="shell.sectionSettled('participation')" />
  </ng-template>

  <ng-template lfxHealthMetricsL2Section="committees">
    <lfx-engagement-group-attendance
      (countsChange)="groupCounts.set($event)"
      (reading)="shell.sectionReading('committees')"
      (settled)="shell.sectionSettled('committees')" />
  </ng-template>

  <ng-template lfxHealthMetricsL2Section="orgs">
    <lfx-engagement-org-participation
      (countsChange)="orgCounts.set($event)"
      (reading)="shell.sectionReading('orgs')"
      (settled)="shell.sectionSettled('orgs')" />
  </ng-template>

  <ng-template lfxHealthMetricsL2Section="reps">
    <lfx-engagement-representatives (countsChange)="repCounts.set($event)" (reading)="shell.sectionReading('reps')" (settled)="shell.sectionSettled('reps')" />
  </ng-template>

  <ng-template lfxHealthMetricsL2Section="nonmem">
    <lfx-engagement-non-member-participation
      (countsChange)="nonMemberCounts.set($event)"
      (reading)="shell.sectionReading('nonmem')"
      (settled)="shell.sectionSettled('nonmem')" />
  </ng-template>
</lfx-health-metrics-l2-shell>
