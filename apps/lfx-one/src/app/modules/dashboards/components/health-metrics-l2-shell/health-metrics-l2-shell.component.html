<!-- The design's `l2Shell`: a fixed sub-nav beside a single stacked column of anchored sections. Pixel sizes follow the
     design; the 14px root makes the rem scale undershoot them. -->
<div
  class="flex flex-col gap-6 lg:grid lg:grid-cols-[270px_minmax(0,1fr)] lg:items-start lg:gap-[40px]"
  [attr.data-testid]="'health-metrics-' + testIdPrefix() + '-page'">
  <lfx-health-metrics-l2-sub-nav
    [items]="subNavItems()"
    [activeKey]="activeSection()"
    [topPx]="chrome.stickyTopPx()"
    [ariaLabel]="navLabel()"
    [testIdPrefix]="testIdPrefix()"
    [crossReference]="crossReference()"
    (sectionPicked)="scrollToSection($event)" />

  <!-- The design's `.panes`: the page scrolls them, beside the sticky sub-nav. `relative` anchors
       absolutely-positioned descendants rendered inline (e.g. icon-field decorations) to the column. -->
  <!-- The header only sticks at `lg`, so only there does a section need its offset as a scroll margin. -->
  <div class="relative flex min-w-0 flex-col gap-[28px]" [style.--l2-sticky-top]="chrome.stickyTopPx() + 'px'">
    <!-- Lights the first section when the reader lands back at the top, which a jump there never crosses the band for. -->
    <div #startSentinel class="absolute inset-x-0 top-0 h-px" aria-hidden="true"></div>
    @for (section of sectionViews(); track section.key) {
      @let body = bodyByKey().get(section.key);
      <section
        [id]="section.id"
        class="surface-card flex flex-col gap-3 rounded-xl bg-white p-5 lg:scroll-mt-[var(--l2-sticky-top)]"
        [attr.data-testid]="testIdPrefix() + '-section-' + section.key">
        <div class="flex flex-col gap-[6px]" [id]="section.headingId">
          <div class="flex flex-wrap items-center gap-2">
            <h2 class="text-[18px] font-semibold tracking-[-0.01em] text-gray-900">{{ section.heading }}</h2>
            @if (section.headingBadge) {
              <span
                class="rounded-[4px] bg-amber-50 px-[6px] py-[2px] text-[11px] font-medium uppercase tracking-[0.03em] text-amber-700"
                [attr.data-testid]="testIdPrefix() + '-heading-badge-' + section.key"
                >{{ section.headingBadge }}</span
              >
            }
          </div>
          <p class="max-w-[680px] text-[13px] leading-[1.6] text-gray-500">{{ section.description }}</p>
        </div>

        @if (body) {
          <ng-container [ngTemplateOutlet]="body" />
        } @else {
          <!-- A section the tab projects no body for is still anchored, so its link resolves. -->
          <p class="rounded-lg bg-gray-50 px-3 py-6 text-center text-[13px] text-gray-400">Awaiting data</p>
        }

        <!-- A footnote explains a body, so it waits until there is one. -->
        @if (body && section.footnote.length) {
          <lfx-health-metrics-footnote
            [parts]="section.footnote"
            [caution]="section.footnoteCaution"
            [attr.data-testid]="testIdPrefix() + '-footnote-' + section.key" />
        }
      </section>
    }

    <!-- Single-pixel sentinel: lets the scroll-spy snap to the short last section without a scroll
         listener or magic pixel values. -->
    <div #endSentinel [attr.data-testid]="testIdPrefix() + '-scroll-end-sentinel'" class="h-px" aria-hidden="true"></div>
  </div>
</div>
