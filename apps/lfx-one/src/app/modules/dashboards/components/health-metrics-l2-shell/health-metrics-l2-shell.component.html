<!-- The design's `l2Shell`: a fixed sub-nav beside a single stacked column of anchored sections. -->
<div
  class="flex flex-col gap-6 lg:grid lg:grid-cols-[220px_minmax(0,1fr)] lg:items-start lg:gap-8"
  [attr.data-testid]="'health-metrics-' + testIdPrefix() + '-page'">
  <lfx-health-metrics-l2-sub-nav
    [items]="subNavItems()"
    [activeKey]="activeSection()"
    [topPx]="chrome.stickyTopPx()"
    [ariaLabel]="navLabel()"
    [testIdPrefix]="testIdPrefix()"
    [crossReferenceNote]="crossReferenceNote()"
    (sectionPicked)="scrollToSection($event)" />

  <!-- The design's `.panes`: the only thing that scrolls. Its height is measured off the viewport so
       the sections scroll inside it and the sub-nav beside it never travels. Below `lg` the height
       variable goes unused and the page scrolls normally. Set imperatively by measurePanesHeight()
       rather than bound, so a same-value re-measurement isn't skipped as a no-op update. `relative`
       gives this element's own absolutely-positioned descendants a containing block here instead of
       the document root — a PrimeNG panel rendered inline rather than via `appendTo: 'body'` (e.g. the
       table paginator's rows-per-page dropdown) is positioned against the nearest one, and without this
       it would resolve to the document root and inflate `document.documentElement.scrollHeight` past
       the viewport even though `overflow-y-auto` clips it visually here, which is what actually made
       the whole page scrollable. -->
  <div #panes class="relative flex min-w-0 flex-col gap-6 lg:h-[var(--l2-panes-height)] lg:overflow-y-auto lg:pr-2">
    @for (section of sectionViews(); track section.key) {
      @let body = bodyByKey().get(section.key);
      <section
        [id]="section.id"
        class="surface-card flex flex-col gap-3 rounded-xl bg-white p-5"
        [attr.data-testid]="testIdPrefix() + '-section-' + section.key">
        <div class="flex flex-col gap-1" [id]="section.headingId">
          <h2 class="text-base font-semibold text-gray-900">{{ section.heading }}</h2>
          <p class="text-[13px] text-gray-500">{{ section.description }}</p>
        </div>

        @if (body) {
          <ng-container [ngTemplateOutlet]="body" />
        } @else {
          <!-- A section the tab projects no body for is still anchored, so its link resolves. -->
          <p class="rounded-lg bg-gray-50 px-3 py-6 text-center text-[13px] text-gray-400">Awaiting data</p>
        }

        @if (section.footnote) {
          <p class="border-t border-gray-100 pt-3 text-[12px] text-gray-400">
            @if (section.footnoteCaution) {
              <i class="fa-light fa-triangle-exclamation mr-1 text-amber-500" aria-hidden="true"></i>
            }
            {{ section.footnote }}
          </p>
        }
      </section>
    }

    <!-- Single-pixel sentinel: lets the scroll-spy snap to the short last section without a scroll
         listener or magic pixel values. -->
    <div #endSentinel [attr.data-testid]="testIdPrefix() + '-scroll-end-sentinel'" class="h-px" aria-hidden="true"></div>
  </div>
</div>
