<!-- The design's `.subnav2`. Pixel sizes follow it; the 14px root makes the rem scale undershoot them. Its blues sit one
     step lighter than ours, so its blue-50 / blue-100 / blue-800 are our blue-100 / blue-200 / blue-900. -->
<nav class="flex flex-col gap-[4px] lg:sticky" [style.top.px]="topPx()" [attr.aria-label]="ariaLabel()" [attr.data-testid]="testIdPrefix() + '-sub-nav'">
  @for (item of items(); track item.key) {
    @let active = item.key === activeKey();
    <button
      type="button"
      class="flex items-center justify-between gap-2 rounded-[8px] px-[12px] py-[10px] text-left text-[13px] leading-[1.35] transition-colors"
      [ngClass]="active ? 'bg-blue-100 font-semibold text-gray-900' : 'text-gray-700 hover:bg-gray-100 hover:text-gray-900'"
      [attr.aria-current]="active ? 'true' : null"
      [attr.data-testid]="testIdPrefix() + '-sub-nav-' + item.key"
      (click)="sectionPicked.emit(item.key)">
      <span class="flex min-w-0 flex-col gap-px">
        <span>{{ item.label }}</span>
        @if (item.note) {
          <span
            class="flex items-center gap-[5px] text-[11px] font-normal leading-[1.3]"
            [ngClass]="active ? 'text-gray-600' : 'text-gray-500'"
            [attr.data-testid]="testIdPrefix() + '-sub-nav-' + item.key + '-note'">
            <span class="h-[5px] w-[5px] shrink-0 rounded-full bg-red-500" aria-hidden="true"></span>
            <span>{{ item.note }}</span>
          </span>
        }
      </span>
      @if (item.count !== null) {
        <span
          class="shrink-0 rounded-full px-[8px] py-px text-[11px] font-medium tabular-nums"
          [ngClass]="active ? 'bg-blue-200 text-blue-900' : 'bg-gray-100 text-gray-500'"
          [attr.data-testid]="testIdPrefix() + '-sub-nav-' + item.key + '-count'"
          >{{ item.count }}</span
        >
      }
    </button>
  }

  @if (crossReference(); as crossReference) {
    <!-- Preserves query params, matching the tab bar's links. -->
    <p
      class="mt-[14px] border-t border-gray-200 px-[10px] pt-[12px] text-[12px] leading-[1.55] text-gray-400"
      [attr.data-testid]="testIdPrefix() + '-sub-nav-cross-reference-note'">
      {{ crossReference.text }}
      <a
        class="font-medium text-gray-700 underline-offset-2 hover:underline"
        [routerLink]="[basePath, crossReference.route]"
        [fragment]="crossReference.fragment"
        queryParamsHandling="preserve"
        [attr.data-testid]="testIdPrefix() + '-sub-nav-cross-reference-link'"
        >{{ crossReference.linkLabel }}</a
      >
    </p>
  }
</nav>
