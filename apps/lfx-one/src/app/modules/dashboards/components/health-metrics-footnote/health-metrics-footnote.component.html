<!-- The design's section notes: a plain grey line, or, for a caution, a warning icon on an amber panel. Pixel sizes
     follow it (the 14px root undershoots the rem scale). Each run is its own element, so template whitespace never adds
     a space the text does not carry. -->
<p
  class="m-0 flex items-start gap-[8px] rounded-[10px] px-[12px] py-[10px] text-[12px] leading-normal"
  [class]="caution() ? 'bg-amber-50 text-amber-800' : 'text-gray-400'">
  @if (caution()) {
    <i class="fa-light fa-triangle-exclamation mt-[2px] shrink-0 text-[12px]" aria-hidden="true" data-testid="health-metrics-footnote-icon"></i>
  }
  <span>
    @for (part of parts(); track $index) {
      @if (part.route) {
        <!-- Preserves query params, matching the tab bar's links. -->
        <a
          class="text-blue-600 hover:underline"
          [routerLink]="[basePath, part.route]"
          queryParamsHandling="preserve"
          [attr.data-testid]="'health-metrics-footnote-link-' + part.route"
          >{{ part.text }}</a
        >
      } @else if (part.bold) {
        <b class="font-semibold">{{ part.text }}</b>
      } @else {
        <span>{{ part.text }}</span>
      }
    }
    <ng-content />
  </span>
</p>
