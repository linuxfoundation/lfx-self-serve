<section class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 flex flex-col gap-3" data-testid="formation-entry-card">
  <div class="flex items-center justify-between">
    <h2 class="font-display font-light text-lg m-0">Formation checklist</h2>
  </div>

  @if (loading()) {
    <p-skeleton width="100%" height="1.25rem" />
  } @else if (hasError()) {
    <p class="text-sm text-gray-500 m-0" data-testid="formation-entry-card-error">
      <i class="fa-light fa-circle-exclamation"></i>
      Couldn&apos;t load the checklist status
    </p>
  } @else {
    <p class="text-sm text-gray-600 m-0" data-testid="formation-entry-card-summary">
      {{ doneCount() }} of {{ totalCount() }} done
      @if (totalGatingCount() > 0) {
        · {{ openGatingCount() }} of {{ totalGatingCount() }} required for Active open
      }
    </p>
  }

  <a
    [routerLink]="formationLink"
    [queryParams]="formationQueryParams()"
    class="self-start text-sm font-medium text-primary hover:underline"
    data-testid="formation-entry-card-link">
    View formation checklist
  </a>
</section>
