@if (sort() === null) {
  <span>{{ label() }}</span>
} @else {
  <button
    type="button"
    class="cursor-pointer rounded-sm border-0 bg-transparent p-0 text-inherit [font:inherit] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
    (click)="sorted.emit()"
    data-testid="health-metrics-th-sort-button">
    {{ label() }}
  </button>
}
@if (tip()) {
  <!-- Exact px, not rem: the design's 6px before the 12px tip glyph. -->
  <span
    class="ml-[6px] inline-flex cursor-help items-center rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
    role="img"
    tabindex="0"
    [attr.aria-label]="tip()"
    [lfxUiTooltip]="tip()"
    data-testid="health-metrics-th-tip"
    ><i class="fa-light fa-circle-question text-[12px] text-gray-500" aria-hidden="true"></i
  ></span>
}
@if (arrowClasses(); as classes) {
  <!-- A pointer shortcut beside the tip; the label's button is the keyboard and screen-reader control. -->
  <i [class]="classes" aria-hidden="true" (click)="sorted.emit()" data-testid="health-metrics-th-sort"></i>
}
