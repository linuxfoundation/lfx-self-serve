<!-- Exact px, not rem: the design's 10px sort arrow and 12px tip glyph. -->
<span>{{ label() }}</span>
@if (sortIcon(); as icon) {
  <i class="text-[10px]" [class]="icon" aria-hidden="true" data-testid="health-metrics-th-sort"></i>
}
@if (tip()) {
  <span
    class="inline-flex cursor-help items-center rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
    role="img"
    tabindex="0"
    [attr.aria-label]="tip()"
    [lfxUiTooltip]="tip()"
    data-testid="health-metrics-th-tip"
    ><i class="fa-light fa-circle-question text-[12px] text-gray-500" aria-hidden="true"></i
  ></span>
}
