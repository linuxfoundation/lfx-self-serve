<!-- Each data section reports its reads to the shell, which holds a deep link until they all land. -->
<lfx-health-metrics-l2-shell
  #shell
  [sections]="sections"
  [idPrefix]="idPrefix"
  [dataSections]="dataSections"
  [subNavItems]="subNavItems"
  [blank]="blank"
  navLabel="Non-Members sections"
  testIdPrefix="non-members">
  <ng-template lfxHealthMetricsL2SectionControls="orgs">
    <lfx-ui-switch
      size="small"
      ariaLabel="Company activity"
      [value]="orgsFilter()"
      (valueChange)="onOrgsFilterChange($event)"
      data-testid="non-members-orgs-filter">
      @for (filter of orgsFilters; track filter.id) {
        <lfx-ui-switch-option [value]="filter.id" [label]="filter.label" [attr.data-testid]="'non-members-orgs-filter-' + filter.id" />
      }
    </lfx-ui-switch>
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="orgs">
    <lfx-non-members-orgs [(filter)]="orgsFilter" (reading)="shell.sectionReading('orgs')" (settled)="shell.sectionSettled('orgs', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="people">
    <lfx-non-members-people (reading)="shell.sectionReading('people')" (settled)="shell.sectionSettled('people', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="conversion">
    <lfx-non-members-conversion (reading)="shell.sectionReading('conversion')" (settled)="shell.sectionSettled('conversion', $event)" />
  </ng-template>
</lfx-health-metrics-l2-shell>
