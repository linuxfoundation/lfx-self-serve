<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[16px]" data-testid="non-members-conversion">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Conversion opportunity unavailable"
      subtitle="We could not load the conversion opportunity for this foundation. Refresh the page to try again."
      data-testid="non-members-conversion-error" />
  } @else if (loading()) {
    <!-- The metrics row's and the table's own shapes, not one block. -->
    <p-skeleton height="7rem" borderRadius="0.5rem" data-testid="non-members-conversion-loading-metrics" aria-hidden="true" />
    <p-skeleton height="18rem" borderRadius="0.5rem" data-testid="non-members-conversion-loading-table" aria-hidden="true" />
  } @else if (!empty()) {
    <lfx-health-metrics-metrics-row [items]="view().metrics" testId="non-members-conversion-metrics" />

    <!-- No table empty state: with no active company there is nothing to rank, so the sub-heading and table drop out. -->
    @if (warmestRows().length) {
      <div class="flex flex-col gap-[10px]" data-testid="non-members-conversion-warmest">
        <h3 class="m-0 mt-[4px] text-[11px] font-semibold uppercase tracking-[0.06em] text-gray-500">Warmest companies</h3>
        <!-- The design's 520px minimum; a narrower card scrolls the table sideways. -->
        <lfx-table
          styleClass="hm-table"
          [rowHover]="false"
          [value]="warmestRows()"
          [paginator]="false"
          [tableStyle]="{ 'min-width': '520px' }"
          data-testid="non-members-conversion-warmest-table">
          <ng-template #header>
            <tr>
              <th scope="col" [attr.aria-sort]="sorting.headers().company.ariaSort">
                <lfx-health-metrics-th
                  label="Company"
                  [sort]="sorting.headers().company.state"
                  (sorted)="sorting.toggle('company')"
                  data-testid="non-members-conversion-sort-company" />
              </th>
              <!-- Exact %: the design's 0.8 / 0.6 shares of its 3.4fr row, Company taking the rest; exact px: its column minimums. -->
              <th scope="col" class="w-[24%] min-w-[130px]" [attr.aria-sort]="sorting.headers().meetings.ariaSort">
                <lfx-health-metrics-th
                  label="Meetings attended"
                  [sort]="sorting.headers().meetings.state"
                  (sorted)="sorting.toggle('meetings')"
                  data-testid="non-members-conversion-sort-meetings" />
              </th>
              <th scope="col" class="w-[18%] min-w-[110px]" [attr.aria-sort]="sorting.headers().contributions.ariaSort">
                <lfx-health-metrics-th
                  label="Contributions"
                  [tip]="contributionsTip"
                  [sort]="sorting.headers().contributions.state"
                  (sorted)="sorting.toggle('contributions')"
                  data-testid="non-members-conversion-sort-contributions" />
              </th>
            </tr>
          </ng-template>

          <ng-template #body let-row>
            <tr [attr.data-testid]="'non-members-conversion-warm-' + row.accountId">
              <td>
                <lfx-health-metrics-cell
                  [text]="row.accountName"
                  [lead]="{ kind: 'company', name: row.accountName, logoUrl: row.logoUrl }"
                  [attr.data-testid]="'non-members-conversion-warm-' + row.accountId + '-name'" />
              </td>
              <td>
                <lfx-health-metrics-cell [text]="row.meetingsLabel" [attr.data-testid]="'non-members-conversion-warm-' + row.accountId + '-meetings'" />
              </td>
              <td>
                <lfx-health-metrics-cell
                  [text]="row.contributionsLabel"
                  [attr.data-testid]="'non-members-conversion-warm-' + row.accountId + '-contributions'" />
              </td>
            </tr>
          </ng-template>
        </lfx-table>
      </div>
    }
  }
</div>
