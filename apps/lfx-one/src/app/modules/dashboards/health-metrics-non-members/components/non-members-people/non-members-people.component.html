<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="non-members-people">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="People unavailable"
      subtitle="We could not load this foundation's engaged non-member people. Refresh the page to try again."
      data-testid="non-members-people-error" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else {
    <!-- Search only, filling the row; it matches the person's name or the company's. -->
    <lfx-ui-search-input
      class="w-full"
      placeholder="Search person or company…"
      ariaLabel="Search person or company"
      [maxlength]="maxSearchLength"
      [(value)]="searchText"
      data-testid="non-members-people-search" />

    @if (!loading() && totalRecords() === 0) {
      <lfx-empty-state
        variant="compact"
        icon="fa-light fa-magnifying-glass"
        title="No matching people"
        subtitle="No person matches this search."
        [resettable]="true"
        (resetFilters)="onResetFilters()"
        data-testid="non-members-people-no-match" />
    } @else {
      <!-- The design's 680px minimum; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [rowHover]="false"
        [value]="rowViews()"
        [loading]="loading()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '680px' }"
        data-testid="non-members-people-table">
        <ng-template #header>
          <tr>
            <th scope="col" [attr.aria-sort]="sorting.headers().person.ariaSort">
              <lfx-health-metrics-th
                label="Person"
                [sort]="sorting.headers().person.state"
                (sorted)="sorting.toggle('person')"
                data-testid="non-members-people-sort-person" />
            </th>
            <!-- Exact %: the design's 1.3 / 0.8 / 0.8 shares of its 4.7fr row, Person taking the rest; exact px: its column minimums. -->
            <th scope="col" class="w-[28%] min-w-[190px]" [attr.aria-sort]="sorting.headers().company.ariaSort">
              <lfx-health-metrics-th
                label="Company"
                [sort]="sorting.headers().company.state"
                (sorted)="sorting.toggle('company')"
                data-testid="non-members-people-sort-company" />
            </th>
            <th scope="col" class="w-[17%] min-w-[120px]" [attr.aria-sort]="sorting.headers().meetings.ariaSort">
              <lfx-health-metrics-th
                label="Meetings attended"
                [sort]="sorting.headers().meetings.state"
                (sorted)="sorting.toggle('meetings')"
                data-testid="non-members-people-sort-meetings" />
            </th>
            <th scope="col" class="w-[17%] min-w-[120px]" [attr.aria-sort]="sorting.headers().lastAttended.ariaSort">
              <lfx-health-metrics-th
                label="Last attended"
                [sort]="sorting.headers().lastAttended.state"
                (sorted)="sorting.toggle('lastAttended')"
                data-testid="non-members-people-sort-last-attended" />
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <tr [attr.data-testid]="'non-members-people-row-' + view.rowKey">
            <td>
              <lfx-health-metrics-cell
                [text]="view.displayName"
                [lead]="{ kind: 'person', name: view.displayName, photoUrl: '', initials: view.initials }"
                [description]="view.jobTitle"
                [attr.data-testid]="'non-members-people-row-' + view.rowKey + '-name'" />
            </td>
            <td>
              @if (view.hasCompany) {
                <lfx-health-metrics-cell
                  [text]="view.companyLabel"
                  [lead]="{ kind: 'company', name: view.companyLabel, logoUrl: view.logoUrl }"
                  [attr.data-testid]="'non-members-people-row-' + view.rowKey + '-company'" />
              } @else {
                <lfx-health-metrics-cell [text]="view.companyLabel" [attr.data-testid]="'non-members-people-row-' + view.rowKey + '-company'" />
              }
            </td>
            <td>
              <lfx-health-metrics-cell [text]="view.meetingsLabel" [attr.data-testid]="'non-members-people-row-' + view.rowKey + '-meetings'" />
            </td>
            <td>
              <!-- Ink from the table's cell style, so the shared cell can still mute a "—". -->
              <lfx-health-metrics-cell [text]="view.lastAttendedLabel" [attr.data-testid]="'non-members-people-row-' + view.rowKey + '-last-attended'" />
            </td>
          </tr>
        </ng-template>
      </lfx-table>

      <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
    }
  }
</div>
