<!-- Exact px sizes from the design; the 14px root makes the rem scale undershoot them. -->
<div class="flex flex-col gap-[12px]" data-testid="non-members-orgs">
  @if (loadFailed()) {
    <lfx-empty-state
      variant="compact"
      icon="fa-light fa-triangle-exclamation"
      title="Company participation unavailable"
      subtitle="We could not load this foundation's non-member companies. Refresh the page to try again."
      data-testid="non-members-orgs-error" />
  } @else if (empty()) {
    <!-- The shell shows the section's empty state. -->
  } @else {
    <!-- Search only, filling the row; the cut sits in the card header. -->
    <lfx-ui-search-input
      class="w-full"
      placeholder="Search company…"
      ariaLabel="Search company"
      [maxlength]="maxSearchLength"
      [(value)]="searchText"
      data-testid="non-members-orgs-search" />

    @if (!loading() && totalRecords() === 0) {
      <lfx-empty-state
        variant="compact"
        icon="fa-light fa-magnifying-glass"
        title="No matching companies"
        subtitle="No company matches this search or filter."
        [resettable]="true"
        (resetFilters)="onResetFilters()"
        data-testid="non-members-orgs-no-match" />
    } @else {
      <!-- The design's minimum is capped at the shared 700px; a narrower card scrolls the table sideways. -->
      <lfx-table
        styleClass="hm-table"
        [rowHover]="false"
        [value]="rowViews()"
        [loading]="loading()"
        [paginator]="false"
        [tableStyle]="{ 'min-width': '700px' }"
        data-testid="non-members-orgs-table">
        <ng-template #header>
          <tr>
            <th scope="col" [attr.aria-sort]="sorting.headers().company.ariaSort">
              <lfx-health-metrics-th
                label="Company"
                [sort]="sorting.headers().company.state"
                (sorted)="sorting.toggle('company')"
                data-testid="non-members-orgs-sort-company" />
            </th>
            <!-- Exact %: the design's 0.8 / 0.6 / 0.5 shares of its 3.7fr row, Company taking the rest. -->
            <th scope="col" class="w-[22%]" [attr.aria-sort]="sorting.headers().meetings.ariaSort">
              <lfx-health-metrics-th
                label="Meetings attended"
                [sort]="sorting.headers().meetings.state"
                (sorted)="sorting.toggle('meetings')"
                data-testid="non-members-orgs-sort-meetings" />
            </th>
            <th scope="col" class="w-[16%]" [attr.aria-sort]="sorting.headers().contributions.ariaSort">
              <lfx-health-metrics-th
                label="Contributions"
                [tip]="contributionsTip"
                [sort]="sorting.headers().contributions.state"
                (sorted)="sorting.toggle('contributions')"
                data-testid="non-members-orgs-sort-contributions" />
            </th>
            <th scope="col" class="w-[14%]" [attr.aria-sort]="sorting.headers().fit.ariaSort">
              <lfx-health-metrics-th
                label="Fit"
                [sort]="sorting.headers().fit.state"
                (sorted)="sorting.toggle('fit')"
                data-testid="non-members-orgs-sort-fit" />
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-view>
          <tr [attr.data-testid]="'non-members-orgs-row-' + view.accountId">
            <td>
              <lfx-health-metrics-cell
                [text]="view.accountName"
                [lead]="{ kind: 'company', name: view.accountName, logoUrl: view.logoUrl }"
                [description]="view.lastEngagedLabel"
                [attr.data-testid]="'non-members-orgs-row-' + view.accountId + '-name'" />
            </td>
            <td>
              <lfx-health-metrics-cell
                [text]="view.meetingsLabel"
                [description]="view.peopleLabel"
                [attr.data-testid]="'non-members-orgs-row-' + view.accountId + '-meetings'" />
            </td>
            <td>
              <lfx-health-metrics-cell [text]="view.contributionsLabel" [attr.data-testid]="'non-members-orgs-row-' + view.accountId + '-contributions'" />
            </td>
            <td [attr.data-testid]="'non-members-orgs-row-' + view.accountId + '-fit'">
              @if (view.fitBadgeClass) {
                <!-- Exact px: the design's 24px badge at 12px/500. -->
                <span
                  class="inline-flex h-[24px] items-center whitespace-nowrap rounded-[6px] px-[8px] text-[12px] font-medium leading-[16px]"
                  [class]="view.fitBadgeClass"
                  >{{ view.fitLabel }}</span
                >
              } @else {
                <lfx-health-metrics-cell [text]="view.fitLabel" />
              }
            </td>
          </tr>
        </ng-template>
      </lfx-table>

      <lfx-ui-pagination [total]="totalRecords()" [pageSize]="size" [(page)]="page" />
    }
  }
</div>
