@if (showEventsSections()) {
  <!-- The events sections each render their own card; without a wrapper they sit flush
       against one another. -->
  <div class="flex flex-col gap-4">
    @if (showAttendance()) {
      <!-- Registration pacing is an attendance concern — hidden in the sponsorship view. Not period
           scoped: it covers upcoming events, which fall outside any past period the picker offers. -->
      <lfx-events-attention-section [foundationSlug]="foundationSlug()" data-testid="overview-tab-events-attention" />
    }

    <lfx-events-summary-section
      [foundationSlug]="foundationSlug()"
      [foundationName]="foundationName()"
      [selectedPeriod]="selectedPeriod()"
      [eventsSplit]="eventsSplit()"
      data-testid="overview-tab-events-summary" />

    <lfx-event-roster-section
      [foundationSlug]="foundationSlug()"
      [selectedPeriod]="selectedPeriod()"
      [eventsSplit]="eventsSplit()"
      data-testid="overview-tab-event-roster" />
  </div>
} @else {
  <div
    class="flex flex-col items-center justify-center gap-3 rounded-lg border border-dashed border-gray-300 bg-gray-50 px-6 py-16 text-center"
    data-testid="overview-tab-coming-soon">
    <span class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-blue-50 text-blue-500">
      <i class="fa-light fa-chart-mixed text-xl" aria-hidden="true"></i>
    </span>
    <h3 class="text-base font-semibold text-gray-900">Cross-channel summary — coming soon</h3>
    <p class="max-w-md text-sm text-gray-500">
      An overall summary across every campaign type will appear here once the metrics are finalized. In the meantime, select the Events campaign type for the
      events summary and roster.
    </p>
  </div>
}
