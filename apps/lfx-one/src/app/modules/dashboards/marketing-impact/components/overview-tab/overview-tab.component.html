<!-- The three events sections each render their own card; without a wrapper they sit flush
     against one another. -->
<div class="flex flex-col gap-4">
  <lfx-events-attention-section [foundationSlug]="foundationSlug()" data-testid="overview-tab-events-attention" />

  <lfx-events-summary-section
    [foundationSlug]="foundationSlug()"
    [foundationName]="foundationName()"
    [selectedPeriod]="selectedPeriod()"
    data-testid="overview-tab-events-summary" />

  <lfx-event-roster-section [foundationSlug]="foundationSlug()" [selectedPeriod]="selectedPeriod()" data-testid="overview-tab-event-roster" />
</div>
