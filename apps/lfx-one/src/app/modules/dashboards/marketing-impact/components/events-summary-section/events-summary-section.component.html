<div class="flex flex-col gap-4 rounded-lg border border-gray-200 bg-white p-5" data-testid="events-summary-section">
  <!-- Header -->
  <div class="flex flex-col gap-0.5">
    <h3 class="text-base font-semibold text-gray-900">{{ heading() }}</h3>
    <p class="text-xs text-gray-500">{{ subheading() }} · {{ foundationName() || 'All foundations' }}</p>
  </div>

  <!-- Tiles -->
  @if (loading()) {
    <!--
      Column counts are capped by the tile count at every breakpoint, not just lg. The sponsorship
      view renders a single tile, so a fixed grid-cols-2/sm:grid-cols-3 left half or two-thirds of
      the row as dead columns below 1024px. The caps stay for the six-tile attendance view —
      min() takes whichever is smaller. The loaded-tiles grid below carries the same rule; they
      must move together or the layout shifts when data resolves.
    -->
    <div
      class="grid gap-x-6 gap-y-5 [grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))] sm:[grid-template-columns:repeat(min(var(--cols),3),minmax(0,1fr))] lg:[grid-template-columns:repeat(var(--cols),minmax(0,1fr))]"
      [style.--cols]="tileCount()"
      data-testid="events-summary-skeleton">
      @for (i of skeletons(); track i) {
        <div class="flex flex-col gap-2">
          <div class="h-4 w-24 animate-pulse rounded bg-gray-200"></div>
          <div class="h-7 w-16 animate-pulse rounded bg-gray-200"></div>
        </div>
      }
    </div>
  } @else {
    <div
      class="grid gap-x-6 gap-y-5 [grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))] sm:[grid-template-columns:repeat(min(var(--cols),3),minmax(0,1fr))] lg:[grid-template-columns:repeat(var(--cols),minmax(0,1fr))]"
      [style.--cols]="tileCount()"
      role="list"
      data-testid="events-summary-tiles">
      @for (stat of stats(); track stat.id) {
        <div class="flex flex-col gap-2" role="listitem" [attr.data-testid]="'events-summary-tile-' + stat.id">
          <div class="flex items-center gap-1.5">
            <span class="inline-flex h-6 w-6 items-center justify-center rounded-md" [ngClass]="stat.iconClass">
              <i [class]="stat.icon + ' text-xs'" aria-hidden="true"></i>
            </span>
            <span class="text-xs font-medium text-gray-500">{{ stat.label }}</span>
          </div>
          <span class="text-2xl font-semibold text-gray-900">{{ stat.value }}</span>
          @if (stat.delta) {
            <span
              class="text-xs font-medium"
              [ngClass]="{
                'text-emerald-600': stat.deltaTrend === 'up',
                'text-red-600': stat.deltaTrend === 'down',
                'text-gray-400': stat.deltaTrend === 'neutral',
              }"
              >{{ stat.delta }}</span
            >
          }
        </div>
      }
    </div>
  }
</div>
