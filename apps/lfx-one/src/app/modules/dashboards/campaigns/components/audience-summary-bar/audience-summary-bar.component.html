<div
  class="sticky bottom-0 z-10 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-gray-200 bg-white/95 px-4 py-2 shadow-md backdrop-blur"
  role="region"
  aria-label="Selected audience"
  data-testid="campaigns-audience-summary-bar">
  <dl class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-600">
    <div class="flex items-center gap-1">
      <dt>Included</dt>
      <dd class="font-semibold text-gray-900" data-testid="campaigns-audience-summary-bar-included">{{ included() }}</dd>
    </div>
    <div class="flex items-center gap-1">
      <dt>Excluded</dt>
      <dd class="font-semibold text-gray-900" data-testid="campaigns-audience-summary-bar-excluded">{{ excluded() }}</dd>
    </div>
    <div class="flex items-center gap-1">
      <dt>{{ reachExact() ? 'Reach before exclusions' : 'Reach (sum)' }}</dt>
      <dd class="font-semibold text-gray-900" data-testid="campaigns-audience-summary-bar-reach">{{ reachText() }}</dd>
    </div>
  </dl>
  @if (attached()) {
    <span class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700">
      <i class="fa-light fa-circle-check" aria-hidden="true"></i>
      Attached to this email
    </span>
  } @else {
    <button
      type="button"
      (click)="review.emit()"
      class="inline-flex items-center gap-2 rounded-md bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700"
      data-testid="campaigns-audience-summary-bar-review">
      Review and attach
      <i class="fa-light fa-arrow-down" aria-hidden="true"></i>
    </button>
  }
</div>
