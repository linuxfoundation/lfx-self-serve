<div class="flex flex-col gap-4" data-testid="meta-device-os-options">
  @if (deviceShown()) {
    <fieldset class="flex flex-col gap-2" data-testid="meta-device-os-devices">
      <legend class="text-sm font-medium text-gray-900">Devices</legend>
      <div class="flex flex-wrap items-center gap-3">
        @for (device of devices(); track device.value) {
          <lfx-ui-checkbox
            [label]="device.label"
            [checked]="device.on"
            (checkedChange)="onDeviceToggle(device.value, $event)"
            [attr.data-testid]="'meta-device-os-device-' + device.value" />
        }
      </div>
      <p class="text-xs text-gray-500" data-testid="meta-device-os-devices-hint">Tick neither, or both, to show the ads on every device.</p>
    </fieldset>
  }

  @if (osShown()) {
    <fieldset class="flex flex-col gap-2" data-testid="meta-device-os-systems">
      <legend class="text-sm font-medium text-gray-900">Operating systems</legend>
      <div class="flex flex-wrap items-center gap-3">
        @for (os of systems(); track os.value) {
          <lfx-ui-checkbox
            [label]="os.label"
            [checked]="os.on"
            (checkedChange)="onOsToggle(os.value, $event)"
            [attr.data-testid]="'meta-device-os-os-' + os.value" />
        }
      </div>
      <p class="text-xs text-gray-500" data-testid="meta-device-os-systems-hint">Mobile only. Tick neither to show the ads on every system.</p>
    </fieldset>
  }
</div>
