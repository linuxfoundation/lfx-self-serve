<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6" data-testid="formation-page-container">
  @if (selectedProject(); as project) {
    <div class="mb-6">
      <h1 class="font-display font-light text-2xl m-0">{{ project.name }}</h1>
    </div>
  }

  <div class="flex flex-col xl:flex-row xl:items-start gap-10" data-testid="formation-page-columns">
    <div class="flex-1 min-w-0">
      <lfx-formation-checklist-section (responseLoaded)="onChecklistLoaded($event)" />
    </div>
    @if (checklist(); as checklist) {
      <aside class="flex flex-col gap-8 w-full shrink-0 xl:w-64" data-testid="formation-page-sidebar">
        <lfx-formation-card [formation]="checklist.formation" />
        <lfx-formation-people-card [checklist]="checklist" />
      </aside>
    }
  </div>
</div>
