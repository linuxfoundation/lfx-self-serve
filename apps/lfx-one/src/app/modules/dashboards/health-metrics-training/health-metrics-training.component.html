<!-- Each data section reports its reads to the shell, which holds a deep link until they all land. -->
<lfx-health-metrics-l2-shell
  #shell
  [sections]="sections"
  [idPrefix]="idPrefix"
  [dataSections]="dataSections"
  [subNavItems]="subNavItems"
  [blank]="blank"
  navLabel="Training sections"
  testIdPrefix="training">
  <ng-template lfxHealthMetricsL2SectionControls="enroll">
    <lfx-ui-switch size="small" ariaLabel="Measure" [value]="enrollMetric()" (valueChange)="onEnrollMetricChange($event)" data-testid="training-enroll-metric">
      @for (option of enrollMetrics; track option.id) {
        <lfx-ui-switch-option [value]="option.id" [label]="option.label" [attr.data-testid]="'training-enroll-metric-' + option.id" />
      }
    </lfx-ui-switch>
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="enroll">
    <lfx-training-enroll [(metric)]="enrollMetric" (reading)="shell.sectionReading('enroll')" (settled)="shell.sectionSettled('enroll', $event)" />
  </ng-template>
  <ng-template lfxHealthMetricsL2Section="courses">
    <lfx-training-courses (reading)="shell.sectionReading('courses')" (settled)="shell.sectionSettled('courses', $event)" />
  </ng-template>
</lfx-health-metrics-l2-shell>
