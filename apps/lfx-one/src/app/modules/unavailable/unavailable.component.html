<div class="max-w-4xl mx-auto">
  <lfx-card data-testid="unavailable-card">
    <div class="text-center py-12">
      <div class="flex justify-center mb-6">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center">
          <i class="fa-light fa-arrows-rotate text-4xl text-gray-400" aria-hidden="true"></i>
        </div>
      </div>

      <h1 class="mb-3" data-testid="unavailable-title">We couldn't load this page right now</h1>
      <p class="text-gray-600 mb-8 max-w-lg mx-auto">This is usually temporary. Try again in a moment.</p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <lfx-button (onClick)="retry()" icon="fa-light fa-arrows-rotate" label="Try again" size="small" data-testid="unavailable-retry-button"></lfx-button>
        <lfx-button
          routerLink="/"
          icon="fa-light fa-house"
          label="Go to Dashboard"
          size="small"
          severity="secondary"
          data-testid="unavailable-dashboard-button"></lfx-button>
      </div>
    </div>
  </lfx-card>
</div>
