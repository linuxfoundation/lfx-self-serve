<div class="mx-auto flex max-w-screen-2xl flex-col gap-6 px-4 sm:px-6 lg:px-8" data-testid="it-os-agents-page">
  <lfx-page-header [title]="labels.title" [description]="labels.description" titleTestId="it-os-agents-title" descriptionTestId="it-os-agents-description">
    <div pageHeaderActions>
      <lfx-tag value="Prototype · sample data" severity="info" data-testid="it-os-agents-prototype-tag" />
    </div>
  </lfx-page-header>

  <div class="max-w-md">
    <lfx-input-text
      [form]="searchForm"
      control="search"
      type="search"
      icon="fa-light fa-magnifying-glass"
      placeholder="Search agents"
      inputId="it-os-agents-search"
      dataTest="it-os-agents-search" />
  </div>

  @if (agents().length === 0) {
    <p class="text-sm text-gray-500" data-testid="it-os-agents-empty">No agents match that search.</p>
  } @else {
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3" data-testid="it-os-agents-grid">
      @for (agent of agents(); track agent.id) {
        @if (agent.comingSoon) {
          <div
            class="flex flex-col gap-3 rounded-lg border border-gray-200 bg-gray-50 p-5 opacity-75"
            aria-disabled="true"
            [attr.data-testid]="'it-os-agents-card-' + agent.id">
            <ng-container *ngTemplateOutlet="cardBody; context: { $implicit: agent }" />
          </div>
        } @else {
          <a
            [routerLink]="[agent.id]"
            queryParamsHandling="preserve"
            class="flex flex-col gap-3 rounded-lg border border-gray-200 bg-white p-5 transition hover:border-blue-300 hover:shadow-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"
            [attr.data-testid]="'it-os-agents-card-' + agent.id">
            <ng-container *ngTemplateOutlet="cardBody; context: { $implicit: agent }" />
          </a>
        }
      }
    </div>
  }
</div>

<ng-template #cardBody let-agent>
  <div class="flex items-center gap-3">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg" [class]="iconClasses[agent.color]" aria-hidden="true">
      <i [class]="agent.icon"></i>
    </span>
    <span class="font-semibold text-gray-900">{{ agent.name }}</span>
  </div>
  <div class="flex flex-wrap gap-2">
    @for (tag of agent.tags; track tag) {
      <lfx-tag [value]="tag" severity="secondary" />
    }
    @if (agent.comingSoon) {
      <lfx-tag value="Coming soon" severity="warn" />
    }
  </div>
  <p class="text-sm text-gray-600">{{ agent.description }}</p>
</ng-template>
