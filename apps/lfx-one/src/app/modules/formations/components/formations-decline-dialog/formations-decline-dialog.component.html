<div class="flex flex-col gap-4" data-testid="formations-decline-dialog">
  <p class="text-sm text-gray-600">
    Declining <strong>{{ formationName }}</strong> requires a reason. The proposer is notified.
  </p>

  <lfx-textarea
    [form]="form"
    control="reason"
    [rows]="4"
    placeholder="Why is this formation being declined?"
    styleClass="w-full"
    [required]="true"
    dataTest="formations-decline-dialog-reason-textarea" />

  <div class="flex justify-end gap-2">
    <lfx-button label="Cancel" size="small" severity="secondary" (onClick)="onCancel()" data-testid="formations-decline-dialog-cancel" />
    <lfx-button
      label="Decline formation"
      size="small"
      severity="danger"
      [disabled]="!canConfirm()"
      (onClick)="onConfirm()"
      data-testid="formations-decline-dialog-confirm" />
  </div>
</div>
