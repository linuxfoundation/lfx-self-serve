<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6" data-testid="formations-queue-container">
  <div class="flex items-center gap-3">
    <h1 class="font-display font-light text-2xl m-0">Formations</h1>
  </div>
  <p class="text-sm text-gray-500 -mt-4">Every foundation, project, and subproject between Prospect and Active.</p>

  @if (loadFailed()) {
    <div class="flex flex-col items-center gap-3 py-8 border border-red-200 bg-red-50 rounded-xl" data-testid="formations-queue-inline-error">
      <span class="text-sm text-red-700">Something went wrong loading the Formations queue.</span>
    </div>
  } @else {
    <lfx-stat-card-grid [cards]="tiles()" [loading]="loading()" [columns]="4" />

    <lfx-formations-table
      [rows]="rows()"
      [loading]="loading()"
      (filtersChange)="onFiltersChange($event)"
      (accept)="onAccept($event)"
      (decline)="onDecline($event)" />
  }
</div>
