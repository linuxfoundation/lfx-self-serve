<div class="flex flex-col" data-testid="sign-identity-select-dialog">
  <p class="mb-4 text-sm text-slate-600">{{ copy.body }}</p>

  @if (hasIdentities()) {
    <div role="listbox" aria-label="Identities you can sign with" class="flex flex-col gap-2">
      <!--
        An identity that already signed this CLA group is grayed out with the reason. The card owns
        the reason so it reaches everyone: hover, keyboard focus, and screen readers alike.
      -->
      @for (account of accounts(); track account.githubId) {
        <lfx-selectable-card
          [form]="selectForm"
          control="identity"
          [value]="account.githubId"
          [label]="account.label"
          [disabled]="!!account.alreadySignedTooltip"
          [disabledReason]="account.alreadySignedTooltip ?? ''"
          [testId]="'sign-identity-select-github-' + account.githubId" />
      }

      @if (gerritLabel(); as label) {
        <lfx-selectable-card
          [form]="selectForm"
          control="identity"
          [value]="gerritValue"
          [label]="label"
          [disabled]="!!gerritAlreadySignedTooltip()"
          [disabledReason]="gerritAlreadySignedTooltip() ?? ''"
          testId="sign-identity-select-gerrit" />
      }
    </div>

    <div class="mt-4 flex justify-end gap-2.5">
      <lfx-button label="Cancel" [text]="true" (onClick)="onCancel()" data-testid="sign-identity-select-cancel" />
      <lfx-button
        label="Continue to sign"
        icon="fa-light fa-arrow-right"
        iconPos="right"
        [disabled]="!selectedId()"
        (onClick)="onContinue()"
        data-testid="sign-identity-select-continue" />
    </div>
  } @else {
    <div class="px-2 py-6 text-center" data-testid="sign-identity-select-empty">
      <i class="fa-light fa-circle-question mb-2.5 block text-2xl text-slate-400" aria-hidden="true"></i>
      <p class="mb-4 text-sm leading-relaxed text-slate-600">
        No GitHub accounts are connected to your profile yet. Link one from Identities, then come back to sign.
      </p>
      <lfx-button label="Go to Identities" [outlined]="true" (onClick)="onLinkAccounts()" data-testid="sign-identity-select-link-accounts" />
    </div>
  }
</div>
