<div data-testid="newsletter-invite-guest">
  <lfx-newsletter-guest-reader
    [issue]="state().issue ?? null"
    [teaser]="invite()?.teaser ?? null"
    [foundation]="invite()?.foundation ?? null"
    [signInHref]="signInHref()" />

  @if (state().status === 'prompt' || state().status === 'error') {
    <lfx-newsletter-guest-modal
      mode="invite"
      [foundation]="invite()?.foundation ?? null"
      [membershipName]="invite()?.membership_name ?? ''"
      [companyName]="invite()?.company_name ?? ''"
      [email]="invite()?.masked_email ?? ''"
      [loading]="submitting()"
      [errorMessage]="modalError()"
      [blocked]="blocked()"
      [signInHref]="signInHref()"
      (continued)="onContinue()" />
  }
</div>
