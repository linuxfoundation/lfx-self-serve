<main class="flex min-h-screen items-center justify-center bg-gray-50 px-4" data-testid="newsletter-share-preview">
  <div class="flex w-full max-w-lg flex-col items-center gap-4 rounded-xl border border-gray-200 bg-white p-8 text-center">
    <p class="text-xs font-semibold uppercase tracking-wide text-gray-500">Newsletter</p>
    @if (!state().loading) {
      <h1 class="font-display text-2xl font-light text-gray-900" data-testid="newsletter-share-preview-title">{{ heading() }}</h1>
    }
    <p class="text-sm text-gray-600">Sign in to LFX to read this newsletter.</p>
    <a
      [attr.href]="loginHref"
      class="rounded-md bg-blue-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600"
      data-testid="newsletter-share-preview-sign-in">
      Sign in
    </a>
  </div>
</main>
