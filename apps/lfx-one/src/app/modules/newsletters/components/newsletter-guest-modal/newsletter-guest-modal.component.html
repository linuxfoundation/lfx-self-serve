<div class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-ui-overlay px-4 py-8 backdrop-blur-md" data-testid="newsletter-guest-modal">
  <div
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="labelledBy"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    class="my-auto flex w-full max-w-xl flex-col items-center gap-6 rounded-xl bg-white px-6 py-10 text-center shadow-xl sm:px-14 sm:py-12">
    @if (foundation()?.logo_url; as logoUrl) {
      <img
        [src]="logoUrl"
        [alt]="foundationName() + ' logo'"
        class="h-16 w-16 rounded-full border border-gray-200 bg-white object-contain p-1.5"
        data-testid="newsletter-guest-modal-logo" />
    } @else {
      <div
        class="flex h-16 w-16 items-center justify-center rounded-full bg-blue-50 text-2xl font-semibold text-blue-600"
        aria-hidden="true"
        data-testid="newsletter-guest-modal-monogram">
        {{ monogram() }}
      </div>
    }

    <h2 [id]="labelledBy" class="font-display text-2xl text-gray-900 sm:text-3xl" data-testid="newsletter-guest-modal-heading">
      Be the first to hear about new stories from {{ foundationName() }}
    </h2>

    <p class="max-w-md text-base text-gray-600" data-testid="newsletter-guest-modal-description">{{ description() }}</p>

    <form class="flex w-full max-w-sm flex-col items-stretch gap-5 text-left" (submit)="onSubmit($event)" novalidate data-testid="newsletter-guest-modal-form">
      <lfx-ui-input
        label="Your email"
        type="email"
        autocomplete="email"
        placeholder="Enter your work email address"
        [(value)]="emailValue"
        [disabled]="mode() === 'invite'"
        [error]="errorMessage()"
        data-testid="newsletter-guest-modal-email" />
      @if (!blocked()) {
        <div class="flex justify-center">
          <lfx-ui-button type="submit" size="large" [loading]="loading()" [disabled]="!canContinue()" data-testid="newsletter-guest-modal-continue">
            Continue
          </lfx-ui-button>
        </div>
      }
    </form>

    <p class="text-sm text-gray-600">
      Already have an account?
      <a
        [attr.href]="signInHref()"
        class="font-medium text-gray-900 underline underline-offset-2 hover:text-blue-600"
        data-testid="newsletter-guest-modal-sign-in"
        >Sign in</a
      >
    </p>
  </div>
</div>
