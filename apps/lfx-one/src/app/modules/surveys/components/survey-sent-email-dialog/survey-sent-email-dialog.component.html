<div class="flex flex-col gap-4" data-testid="survey-sent-email-dialog">
  @if (email(); as rendered) {
    <p class="text-sm text-gray-500">The survey email as {{ recipientName || 'this recipient' }} received it.</p>

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-neutral-950">Subject:</span>
      <p class="p-3 bg-gray-50 rounded-md text-sm" data-testid="survey-sent-email-subject">{{ rendered.subject }}</p>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-neutral-950">Body:</span>
      <lfx-email-body-preview
        class="overflow-hidden rounded-md border border-gray-200"
        [html]="rendered.html"
        [heightPx]="480"
        testId="survey-sent-email-body" />
    </div>
  } @else {
    <p class="text-sm text-gray-500" data-testid="survey-sent-email-empty">The email for this survey is not available.</p>
  }

  <div class="flex justify-end pt-2">
    <lfx-button label="Close" severity="secondary" [outlined]="true" (onClick)="close()" data-testid="survey-sent-email-close" />
  </div>
</div>
