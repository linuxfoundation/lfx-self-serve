<lfx-header></lfx-header>

<div class="bg-gray-50 min-h-screen flex items-center justify-center">
  @if (isProcessing()) {
    <div class="flex flex-col items-center gap-4 text-center" role="status" aria-live="polite">
      <!-- CSS spinner: LCP must not wait on the deferred Font Awesome kit (GH-2290). -->
      <div
        class="h-9 w-9 shrink-0 rounded-full border-2 border-blue-200 border-t-blue-500 animate-spin"
        aria-hidden="true"
        data-testid="invite-accept-spinner"></div>
      <p class="text-gray-600 text-sm">Accepting your invitation&hellip;</p>
    </div>
  }
</div>
