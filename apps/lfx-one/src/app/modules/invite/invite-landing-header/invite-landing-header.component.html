<div class="sticky top-0 z-50 bg-white border-b border-gray-100">
  <div class="mx-auto max-w-6xl flex items-center justify-between px-4 py-3">
    <a href="/" class="flex items-center p-2 hover:opacity-80 transition-opacity" aria-label="Go to home page" data-testid="invite-home-link">
      <img src="/images/logo_lfx.svg" alt="LFX Logo" class="w-auto h-5" />
    </a>
    @if (userService.authenticated()) {
      <a href="/logout" class="text-sm font-medium text-gray-600 hover:text-gray-800 px-2 py-1" data-testid="invite-logout-link">Logout</a>
    }
  </div>
</div>
