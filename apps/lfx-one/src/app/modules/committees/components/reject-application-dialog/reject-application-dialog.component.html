<div class="flex flex-col gap-4" data-testid="reject-application-dialog">
  <p class="text-sm text-gray-600">
    Reject the join request from <strong>{{ applicantEmail }}</strong
    >. You may optionally include a note for the applicant.
  </p>

  <lfx-textarea
    [form]="form"
    control="reviewer_notes"
    [rows]="4"
    placeholder="Optional note to the applicant…"
    styleClass="w-full"
    dataTest="reject-application-notes"></lfx-textarea>

  <div class="flex justify-end gap-3 pt-2">
    <lfx-button label="Cancel" severity="secondary" [outlined]="true" size="small" (onClick)="cancel()" data-testid="reject-application-cancel"></lfx-button>
    <lfx-button label="Reject Application" severity="danger" size="small" (onClick)="submit()" data-testid="reject-application-submit"></lfx-button>
  </div>
</div>
