<div class="flex flex-col gap-5" data-testid="committee-edit-chairs-dialog">
  <!-- Chairs -->
  <div class="flex flex-col gap-2">
    <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Chair</label>

    @if (chairRows().length) {
      <div class="flex flex-wrap gap-2" data-testid="chair-chip-list">
        @for (row of chairRows(); track row.uid) {
          <span
            class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-3 py-1 text-sm font-medium text-blue-700 border border-blue-200"
            data-testid="chair-row">
            {{ row.label }}
            <button
              type="button"
              class="flex items-center justify-center rounded-full w-4 h-4 text-blue-400 hover:bg-blue-200 hover:text-blue-700 transition-colors"
              [attr.aria-label]="'Remove ' + row.label + ' as chair'"
              data-testid="remove-chair-btn"
              (click)="removeChair(row.uid)">
              <span aria-hidden="true" class="text-xs leading-none">&times;</span>
            </button>
          </span>
        }
      </div>
    }

    <lfx-select
      [form]="addChairForm"
      control="uid"
      [options]="availableOptions()"
      optionLabel="label"
      optionValue="value"
      placeholder="Add a chair..."
      [filter]="true"
      filterBy="label"
      filterPlaceholder="Search members..."
      (onChange)="onChairSelected($event)"></lfx-select>
  </div>

  <!-- Vice Chairs -->
  <div class="flex flex-col gap-2">
    <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Vice Chair</label>

    @if (viceChairRows().length) {
      <div class="flex flex-wrap gap-2" data-testid="vice-chair-chip-list">
        @for (row of viceChairRows(); track row.uid) {
          <span
            class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-3 py-1 text-sm font-medium text-blue-700 border border-blue-200"
            data-testid="vice-chair-row">
            {{ row.label }}
            <button
              type="button"
              class="flex items-center justify-center rounded-full w-4 h-4 text-blue-400 hover:bg-blue-200 hover:text-blue-700 transition-colors"
              [attr.aria-label]="'Remove ' + row.label + ' as vice chair'"
              data-testid="remove-vice-chair-btn"
              (click)="removeViceChair(row.uid)">
              <span aria-hidden="true" class="text-xs leading-none">&times;</span>
            </button>
          </span>
        }
      </div>
    }

    <lfx-select
      [form]="addViceChairForm"
      control="uid"
      [options]="availableOptions()"
      optionLabel="label"
      optionValue="value"
      placeholder="Add a vice chair..."
      [filter]="true"
      filterBy="label"
      filterPlaceholder="Search members..."
      (onChange)="onViceChairSelected($event)"></lfx-select>
  </div>
</div>

<div class="flex justify-end gap-2 mt-4">
  <lfx-button label="Cancel" severity="secondary" [outlined]="true" size="small" (onClick)="cancel()"></lfx-button>
  <lfx-button label="Save" severity="info" size="small" (onClick)="save()"></lfx-button>
</div>
