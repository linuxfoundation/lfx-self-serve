<div class="flex flex-col gap-4 pt-2" data-testid="committee-votes-tab">
  @if (loading() || votes().length > 0) {
    <lfx-votes-table
      [votes]="votes()"
      [hasPMOAccess]="canEdit()"
      [loading]="loading()"
      [totalRecords]="votes().length"
      [editQueryParams]="editVoteQueryParams()"
      (viewResults)="viewVoteResults($event)"
      (viewVote)="viewVoteResults($event)"
      (refresh)="refreshVotes()">
      @if (canEdit()) {
        <lfx-button
          tableActions
          label="Create Vote"
          icon="fa-light fa-check-to-slot"
          severity="info"
          size="small"
          [loading]="creating()"
          (onClick)="onCreateVote()"
          data-testid="committee-votes-create-btn"></lfx-button>
      }
    </lfx-votes-table>
  } @else {
    @if (canEdit()) {
      <div class="flex items-center justify-end">
        <lfx-button
          label="Create Vote"
          icon="fa-light fa-check-to-slot"
          severity="info"
          size="small"
          [loading]="creating()"
          (onClick)="onCreateVote()"
          data-testid="committee-votes-empty-create-btn"></lfx-button>
      </div>
    }
    <lfx-card>
      <div class="flex flex-col items-center py-12">
        <i class="fa-light fa-check-to-slot text-3xl text-surface-300 mb-3" aria-hidden="true"></i>
        <p class="text-sm font-medium text-muted-color">No votes yet</p>
        <p class="text-xs text-surface-400 mt-1">Votes for this committee will appear here.</p>
      </div>
    </lfx-card>
  }

  <!-- Default audience 'creator' renders an inline "Cast Vote" CTA for the viewer's own awaiting-response
       active votes — reuse the same dashboard-cast-drawer-host + vote-cast-drawer pair every dashboard
       wires this CTA to (see committee-overview.component.html for the same pairing). -->
  <lfx-vote-results-drawer
    [(visible)]="resultsDrawerVisible"
    [voteId]="selectedVoteId()"
    [listVote]="selectedVote()"
    (castVoteRequested)="castDrawerHost.open($event)">
  </lfx-vote-results-drawer>
  <lfx-dashboard-cast-drawer-host #castDrawerHost (voteSubmitted)="refreshVotes()" />
</div>
