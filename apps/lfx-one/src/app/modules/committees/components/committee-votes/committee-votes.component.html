<div class="flex flex-col gap-4 pt-2" data-testid="committee-votes-tab">
  @if (votesLoading() || votes().length > 0) {
    <lfx-votes-table
      [votes]="votes()"
      [hasPMOAccess]="canEdit()"
      [showParticipationProgress]="true"
      [loading]="votesLoading()"
      [totalRecords]="votes().length"
      [editQueryParamsFallback]="editVoteQueryParams()"
      (viewResults)="viewVoteResults($event)"
      (viewVote)="viewVote($event)"
      (refresh)="refreshVotes()"
      (voteExtended)="onVoteExtended($event)"
      (voteClosed)="onVoteClosed($event)">
      @if (canEdit()) {
        <lfx-button
          tableActions
          label="Create Vote"
          icon="fa-light fa-chevron-down"
          iconPos="right"
          severity="info"
          size="small"
          ariaHaspopup="menu"
          [ariaExpanded]="createMenu.isOpen()"
          [loading]="creating()"
          (onClick)="createMenu.toggle($event)"
          data-testid="committee-votes-create-btn">
          <i class="fa-light fa-check-to-slot" aria-hidden="true"></i>
        </lfx-button>
      }
    </lfx-votes-table>
  } @else {
    @if (canEdit()) {
      <div class="flex items-center justify-end">
        <lfx-button
          label="Create Vote"
          icon="fa-light fa-chevron-down"
          iconPos="right"
          severity="info"
          size="small"
          ariaHaspopup="menu"
          [ariaExpanded]="createMenu.isOpen()"
          [loading]="creating()"
          (onClick)="createMenu.toggle($event)"
          data-testid="committee-votes-empty-create-btn">
          <i class="fa-light fa-check-to-slot" aria-hidden="true"></i>
        </lfx-button>
      </div>
    }
    <lfx-card>
      <div class="flex flex-col items-center py-12">
        <i class="fa-light fa-check-to-slot text-3xl text-surface-300 mb-3" aria-hidden="true"></i>
        <p class="text-sm font-medium text-muted-color">No votes yet</p>
        <p class="text-xs text-surface-400 mt-1">Votes for this committee will appear here.</p>
      </div>
    </lfx-card>
  }
  <!-- One dropdown for both Create Vote buttons, only one of which is ever rendered. Mounted outside
       their `@if` blocks so both can reference `#createMenu`; it renders nothing until toggled, and
       the panel is teleported to `body`, so where it sits here doesn't affect its position. -->
  <lfx-vote-create-menu #createMenu (methodSelected)="onCreateVote($event)" />
</div>
