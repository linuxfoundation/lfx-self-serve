<div [class]="isMeLens() ? 'flex flex-wrap items-end gap-3' : 'flex flex-col md:flex-row md:items-center gap-3 md:gap-4'">
  <!-- Search Input -->
  <div [class]="isMeLens() ? 'w-full min-w-0 md:flex-1 md:min-w-64' : 'flex-1'">
    @if (isMeLens()) {
      <label for="my-groups-search" class="block text-xs font-medium text-gray-600 mb-1">Search groups</label>
    }
    <lfx-input-text
      [form]="searchForm()"
      control="search"
      [inputId]="isMeLens() ? 'my-groups-search' : undefined"
      [placeholder]="'Search ' + committeeLabel.plural.toLowerCase() + '...'"
      icon="fa-light fa-search"
      styleClass="w-full"
      size="small"
      data-testid="committee-search-input"></lfx-input-text>
  </div>

  <!-- Foundation Filter (Me lens) -->
  @if (showFoundationFilter()) {
    <div [class]="isMeLens() ? 'w-full sm:w-48 min-w-0' : 'w-full sm:w-48'">
      @if (isMeLens()) {
        <label for="my-groups-foundation" class="block text-xs font-medium text-gray-600 mb-1">Foundation</label>
      }
      <lfx-select
        [form]="searchForm()"
        control="foundationFilter"
        [inputId]="isMeLens() ? 'my-groups-foundation' : undefined"
        [ariaLabel]="isMeLens() ? 'Foundation' : undefined"
        size="small"
        [options]="foundationOptions()"
        styleClass="w-full"
        (onChange)="foundationFilterChange.emit($event.value)"
        data-testid="committee-foundation-filter"></lfx-select>
    </div>
  }

  <!-- Project Filter (Me lens) -->
  @if (showProjectFilter()) {
    <div [class]="isMeLens() ? 'w-full sm:w-48 min-w-0' : 'w-full sm:w-48'">
      @if (isMeLens()) {
        <label for="my-groups-project" class="block text-xs font-medium text-gray-600 mb-1">Project</label>
      }
      <lfx-select
        [form]="searchForm()"
        control="projectFilter"
        [inputId]="isMeLens() ? 'my-groups-project' : undefined"
        [ariaLabel]="isMeLens() ? 'Project' : undefined"
        size="small"
        [options]="projectOptions()"
        styleClass="w-full"
        (onChange)="projectFilterChange.emit($event.value)"
        data-testid="committee-project-filter"></lfx-select>
    </div>
  }

  <!-- Voting Status Filter Dropdown -->
  <div class="w-full sm:w-48">
    @if (isMeLens()) {
      <label for="my-groups-voting" class="block text-xs font-medium text-gray-600 mb-1">Voting capability</label>
    }
    <lfx-select
      [form]="searchForm()"
      control="votingStatus"
      [inputId]="isMeLens() ? 'my-groups-voting' : undefined"
      [ariaLabel]="isMeLens() ? 'Voting capability' : undefined"
      size="small"
      [options]="votingStatusOptions()"
      [placeholder]="isMeLens() ? 'All voting' : 'All Voting Status'"
      [showClear]="true"
      styleClass="w-full"
      data-testid="committee-voting-status-filter"></lfx-select>
  </div>

  <!-- Join Mode Filter Dropdown (project/foundation lens only) -->
  @if (showJoinModeFilter()) {
    <div class="w-full sm:w-48">
      <lfx-select
        [form]="searchForm()"
        control="joinModeFilter"
        size="small"
        [options]="joinModeOptions()"
        placeholder="All Join Modes"
        [showClear]="true"
        styleClass="w-full"
        data-testid="committee-join-mode-filter"></lfx-select>
    </div>
  }
</div>
