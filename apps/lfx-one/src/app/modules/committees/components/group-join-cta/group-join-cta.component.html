@if (canJoin()) {
  <!-- Visitor CTA — open mode -->
  <div class="rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 p-6 text-center" data-testid="group-join-cta-visitor-cta">
    <div class="flex flex-col gap-3 items-center">
      <i [class]="joinCtaIcon + ' text-2xl text-blue-500'"></i>
      <h3 class="text-base font-semibold text-gray-900">{{ joinCtaTitle() }}</h3>
      <p class="text-sm text-gray-600 max-w-md">{{ joinCtaDescription }}</p>
      <lfx-button
        [label]="joinButtonLabel"
        severity="info"
        size="small"
        [icon]="joinButtonIcon"
        (onClick)="onJoinClick()"
        data-testid="group-join-cta-join-btn"></lfx-button>
    </div>
  </div>
} @else if (canApply()) {
  <!-- Visitor CTA — application mode -->
  <div class="rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 p-6 text-center" data-testid="group-join-cta-application-cta">
    <div class="flex flex-col gap-3 items-center">
      <i [class]="applyCtaIcon + ' text-2xl text-blue-500'"></i>
      <h3 class="text-base font-semibold text-gray-900">{{ joinCtaTitle() }}</h3>
      <p class="text-sm text-gray-600 max-w-md">{{ applyCtaDescription }}</p>
      <lfx-button
        [label]="applyButtonLabel"
        severity="info"
        size="small"
        [icon]="applyButtonIcon"
        (onClick)="onJoinClick()"
        data-testid="group-join-cta-apply-btn"></lfx-button>
    </div>
  </div>
} @else if (showInviteOnlyNotice()) {
  <!-- Invite-only groups: informational only — visitors must wait for an invitation -->
  <div class="rounded-xl bg-gray-50 border border-gray-200 p-6 text-center" role="status" data-testid="group-join-cta-invite-only-notice">
    <div class="flex flex-col gap-3 items-center">
      <i class="fa-light fa-envelope-open-text text-2xl text-gray-500" aria-hidden="true"></i>
      <h3 class="text-base font-semibold text-gray-900">{{ inviteOnlyTitle }}</h3>
      <p class="text-sm text-gray-600 max-w-md">{{ inviteOnlyDescription() }}</p>
    </div>
  </div>
}
