<div class="flex flex-col gap-2" data-testid="committee-general-settings">
  <h3 class="text-base font-medium text-gray-900">General</h3>
  <div class="bg-white border border-gray-200 p-4 rounded-lg">
    <div class="flex flex-col gap-4">
      <!-- Name -->
      <div class="flex flex-col gap-2">
        <label for="general-name" class="text-sm font-semibold text-gray-900"> {{ committeeLabel }} Name <span class="text-red-500">*</span> </label>
        <lfx-input-text
          size="small"
          [form]="form()"
          control="name"
          inputId="general-name"
          [placeholder]="'Enter ' + committeeLabel.toLowerCase() + ' name'"
          styleClass="w-full"
          data-testid="general-name-input">
        </lfx-input-text>
        @if (form().get('name')?.invalid && form().get('name')?.touched) {
          <p class="text-sm text-red-600">{{ committeeLabel }} name is required</p>
        }
      </div>

      <!-- Type -->
      <div class="flex flex-col gap-2">
        <label for="general-category" class="text-sm font-semibold text-gray-900">{{ committeeLabel }} Type</label>
        <lfx-select
          size="small"
          [form]="form()"
          control="category"
          [options]="categoryOptions()"
          placeholder="Select type"
          styleClass="w-full"
          inputId="general-category"
          data-testid="general-category-select">
        </lfx-select>
        <p class="text-xs text-gray-600">
          Changing the type updates how this {{ committeeLabel.toLowerCase() }} is labeled and governed, including on its members' records.
        </p>
      </div>

      <!-- Parent -->
      <div class="flex flex-col gap-2">
        <label for="general-parent" class="text-sm font-semibold text-gray-900">Parent {{ committeeLabel }} (Optional)</label>
        <lfx-select
          size="small"
          [form]="form()"
          control="parent_uid"
          [options]="parentCommitteeOptions()"
          [placeholder]="'No Parent ' + committeeLabel"
          styleClass="w-full"
          inputId="general-parent"
          [showClear]="true"
          data-testid="general-parent-select">
        </lfx-select>
      </div>
    </div>
  </div>
</div>
