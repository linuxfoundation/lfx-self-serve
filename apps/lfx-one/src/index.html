<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LFX</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- DNS/TLS before the kit request and font files. Production inlines the Google Fonts
         CSS into index.html (Angular fonts.inline, default true), so a preconnect to
         fonts.googleapis.com would be unused there; fonts.gstatic.com still serves the files. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin />
    <!-- Kept a plain stylesheet link on purpose: Angular's fonts.inline replaces it with the
         fetched CSS at build time, so production serves no render-blocking request here and a
         preload/onload swap would only add a swap-in flash. Only unoptimized builds (dev/local)
         fetch it at runtime. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Slab:wght@100..900&display=swap" />
    <!-- defer: kit.fontawesome.com must not block HTML parse / first paint (GH-2290). -->
    <script defer src="https://kit.fontawesome.com/736c27f195.js" crossorigin="anonymous"></script>
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": { "href_matches": "/*" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>

  <body>
    <lfx-root></lfx-root>
  </body>
</html>
