name: Smoke-test and push
description: Run a locally-loaded Docker image, poll /livez, and push it only if the check passes
inputs:
  tags:
    description: Newline-separated image tags (docker/metadata-action outputs.tags format); the first tag is run and all tags are pushed
    required: true
runs:
  using: "composite"
  steps:
    - name: Run smoke-test container
      shell: bash
      run: |
        set -euo pipefail
        PRIMARY_TAG="$(echo '${{ inputs.tags }}' | head -n1)"
        docker run -d --name smoke-test -p 4000:4000 "$PRIMARY_TAG"

    - name: Wait for /livez
      shell: bash
      run: |
        set -euo pipefail
        SECONDS=0
        while [ "$SECONDS" -lt 30 ]; do
          if curl -sf --connect-timeout 1 --max-time 3 http://localhost:4000/livez >/dev/null; then
            echo "livez responded"
            exit 0
          fi
          sleep 1
        done
        echo "::error::/livez did not respond within 30s"
        docker logs smoke-test || true
        exit 1

    - name: Stop smoke-test container
      if: always()
      shell: bash
      run: docker rm -f smoke-test || true

    - name: Push Docker image
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.tags }}' | while IFS= read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done
