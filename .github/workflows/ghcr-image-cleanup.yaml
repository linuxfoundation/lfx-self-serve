---
name: "Cleanup Stale Container Images"

# Thin caller for the shared GHCR cleanup workflow in lfx-public-workflows.
# Selection, deletion, safeguards, and the run summary live there; see
# docs/ghcr-image-cleanup/ in that repository for the full input contract.
# This file only owns the schedule, the manual inputs, and the Self Serve
# policy values below.

"on":
  schedule:
    # Sundays at 00:00 UTC. The shared workflow always deletes on schedule.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview candidate deletions without deleting anything."
        type: boolean
        required: false
        default: true
      cut-off:
        description: "Minimum age an image version must reach before it is eligible for deletion (e.g. 30d, 4w 2d)."
        type: string
        required: false
        default: "30d"

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Stale Container Images
    # A called workflow cannot request more than the calling job grants, so
    # the union of its scopes is declared here: contents: read is the shared
    # workflow's top-level scope, packages: write deletes versions, and
    # pull-requests: read lists open deploy-preview PRs.
    permissions:
      contents: read
      packages: write
      pull-requests: read
    # Pinned by full commit SHA (merge of lfx-public-workflows#17); the
    # workflow can delete packages, so a moving ref is not acceptable. The
    # v0.1.0 tag predates this workflow and cannot be used. Do not add
    # `secrets: inherit`; the workflow uses the job's GITHUB_TOKEN.
    uses: linuxfoundation/lfx-public-workflows/.github/workflows/ghcr-image-cleanup.yaml@476427e9afb0814cd8534eccc10b0d5ad5e4b9f8 # main (lfx-public-workflows#17 merge, 2026-09-24)
    with:
      image-name: lfx-self-serve
      # Replaces the shared default, which omits two-segment release tags.
      # Negative patterns protect any version carrying a matching tag:
      # Self Serve release images have no `v` prefix (`1.2.3`, `1.2`),
      # `latest` is a backstop, and `development` is the current build.
      # The shared workflow additionally protects the default-branch tag.
      image-tags: "!development !latest !*.*.* !*.*"
      # Protects ui-pr-<N> images of open PRs labeled deploy-preview.
      enable-preview-protection: true
      cut-off: ${{ github.event.inputs.cut-off || '30d' }}
      # github.event.inputs values are strings, hence fromJSON. Scheduled
      # runs have no inputs; the shared workflow forces delete for them and
      # manual runs default to a preview.
      dry-run: ${{ fromJSON(github.event.inputs['dry-run'] || 'true') }}
