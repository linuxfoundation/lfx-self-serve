name: Quality Checks

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check fixture data for real organization names, ids, domains and emails
        run: |
          # Pick the correct pre-change commit per event: for pull_request/merge_group this is the
          # target base, NOT the current branch tip — on a push/merge_group run, "main" already
          # points at the just-pushed commit, so diffing origin/main against HEAD would be empty
          # and the guard would silently no-op on every direct or automated push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha=""
          fi

          if [ -z "${base_sha}" ]; then
            echo "No pre-change commit available for this event (e.g. first push to a new branch) — skipping."
            exit 0
          fi

          ./check-fixture-emails.sh "${base_sha}"

      # Whole-tree scan, so it needs no base ref: the symbols it looks for are absent today, and any
      # occurrence is a reintroduction. Kept as its own step rather than left to the pre-commit hook,
      # which does not run for contributors who set a global core.hooksPath.
      - name: Check Org Lens company-address guards
        run: ./check-company-email-guards.sh

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Run linting
        run: yarn lint:check

      - name: Type checking
        run: yarn check-types

      - name: Check E2E collection
        working-directory: apps/lfx-one
        run: yarn e2e:check-collection

  build:
    name: Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compute Angular cache namespace
        id: angular-cache-key
        env:
          NODE_VERSION: ${{ steps.node.outputs.node-version }}
          CONFIG_HASH: ${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'tsconfig*.json', 'apps/lfx-one/angular.json', 'apps/lfx-one/tsconfig*.json', 'packages/shared/tsconfig*.json', 'apps/lfx-one/tailwind.config.js', 'apps/lfx-one/postcss.config.js') }}
        run: echo "prefix=ng-ci-v1-${RUNNER_OS}-${RUNNER_ARCH}-node${NODE_VERSION}-${CONFIG_HASH}-production-" >> "$GITHUB_OUTPUT"

      # Compiler state only: never restore dist, test results, or Turbo task successes.
      - name: Restore Angular compiler cache
        id: angular-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/lfx-one/.angular/cache
          key: ${{ steps.angular-cache-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.angular-cache-key.outputs.prefix }}

      - name: Build project
        # The Angular compiler worker inherits this heap; the default (~4 GB) is no longer enough.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn build

      # Forks can restore public base caches, but only trusted, successful runs populate caches.
      # Merge-queue refs are short-lived; restore there without saving another copy.
      - name: Save Angular compiler cache
        if: >-
          success() && steps.angular-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/lfx-one/.angular/cache
          key: ${{ steps.angular-cache.outputs.cache-primary-key }}

  unit-tests:
    name: Unit Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: server
            workspace: lfx-one-ui
            command: test:server
          - suite: shared
            workspace: "@lfx-one/shared"
            command: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # Direct workspace commands bypass the shared build and docs generation in yarn test.
      - name: Build shared package
        if: matrix.suite == 'server'
        run: yarn workspace @lfx-one/shared build

      - name: Generate docs
        if: matrix.suite == 'server'
        run: yarn workspace lfx-one-ui docs:build

      - name: Run unit tests
        run: yarn workspace ${{ matrix.workspace }} ${{ matrix.command }}

  frontend-tests:
    name: Frontend Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @lfx-one/shared build

      - name: Generate docs
        run: yarn workspace lfx-one-ui docs:build

      - name: Run frontend shard
        working-directory: apps/lfx-one
        run: node scripts/run-app-test-shard.mjs ${{ matrix.shard }}/4

  quality-checks:
    # Preserve the existing check context, and never turn a skipped/cancelled dependency green.
    name: Code Quality Checks
    if: always()
    needs: [static-checks, build, unit-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, { result }] of Object.entries(jobs)) {
            console.log(`${name}: ${result}`);
            if (result !== 'success') process.exitCode = 1;
          }
          NODE

