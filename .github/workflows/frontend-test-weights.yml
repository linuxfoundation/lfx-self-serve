# Rebuilds apps/lfx-one/scripts/frontend-test-durations.json from the latest green main run's
# Frontend Tests shard logs and goes red when the weights have drifted more than 20% (#5980).
# It does not open the PR itself: a PR pushed with GITHUB_TOKEN does not trigger the required
# Quality Checks, and commits here must be GPG-signed and DCO-signed by a person. The regenerated
# file is uploaded as an artifact; docs/architecture/testing/unit-testing.md has the steps.
name: Frontend Test Weights

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      run-id:
        description: Quality Checks run id to read (default, the latest successful push to main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-test-weights
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh shard weights
    if: github.repository == 'linuxfoundation/lfx-self-serve'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list runs and download job logs

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Pick the source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run-id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID}"
          if [ -z "${run_id}" ]; then
            run_id="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow quality-check.yml --branch main --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

      # The script validates the run id and requires every Frontend Tests job of that run to be green.
      - name: Rebuild frontend-test-durations.json
        id: refresh
        working-directory: apps/lfx-one
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run-id }}
        run: node scripts/refresh-test-durations.mjs --run "${RUN_ID}" --write

      - name: Upload the regenerated weights
        if: steps.refresh.outputs.drifted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-test-durations
          path: apps/lfx-one/scripts/frontend-test-durations.json
          retention-days: 14

      - name: Report drift
        env:
          DRIFT: ${{ steps.refresh.outputs.drift }}
          DRIFTED: ${{ steps.refresh.outputs.drifted }}
          RUN_ID: ${{ steps.source.outputs.run-id }}
        run: |
          set -euo pipefail
          percent="$(node -e 'console.log((Number(process.argv[1]) * 100).toFixed(1))' "${DRIFT}")"
          {
            echo "### Frontend shard weights"
            echo
            echo "Source: run [${RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}). Weights moved **${percent}%** (threshold 20%)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRIFTED}" = "true" ]; then
            {
              echo
              echo "Open a PR with the refreshed file: from \`apps/lfx-one\`, run"
              echo "\`node scripts/refresh-test-durations.mjs --run ${RUN_ID} --write\` (or take the \`frontend-test-durations\` artifact),"
              echo "then commit it with \`git commit -S --signoff\`. See docs/architecture/testing/unit-testing.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Frontend shard weights drifted::Weights moved ${percent}% since the checked-in file; refresh apps/lfx-one/scripts/frontend-test-durations.json (see the run summary)."
            exit 1
          fi
