<svg viewBox="0 -70 1200 1010" width="1200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <rect x="-40" y="-70" width="1280" height="1080" fill="#FFFFFF"/>
  <text x="20" y="-38" font-size="21" font-weight="700" fill="#0F172B">LFX SS — Permission-Based Access Model</text>
  <text x="20" y="-16" font-size="12.5" fill="#62748E">The app checks permissions, never personas. Grants evaluate through the model into permissions; guards bind each action to the single permission it requires.</text>
  <defs>
      <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L8,4.5 L0,9 z" fill="#62748E"/>
      </marker>
      <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L8,4.5 L0,9 z" fill="#0061A3"/>
      </marker>
    </defs>

    <!-- ============ BAND 1: FGA MODEL ============ -->
    <rect x="20" y="16" width="1160" height="300" rx="14" fill="#F8FBFF" stroke="#B8D9FF"/>
    <text x="44" y="48" font-size="15" font-weight="700" fill="#00426F">OPENFGA AUTHORIZATION MODEL</text>
    <text x="44" y="68" font-size="12.5" fill="#62748E">Platform team owns grants and the model — either may change at any time; the app never references them</text>

    <!-- Grant bundles -->
    <text x="60" y="104" font-size="12" font-weight="700" fill="#45556C" letter-spacing=".04em">GRANTS  ·  tuples: direct, via teams, via relations</text>
    <g font-size="12.5">
      <rect x="60" y="116" width="200" height="34" rx="8" fill="#fff" stroke="#CAD5E2"/><text x="160" y="137" text-anchor="middle" fill="#314158">LF Staff Team</text>
      <rect x="60" y="158" width="200" height="34" rx="8" fill="#fff" stroke="#CAD5E2"/><text x="160" y="179" text-anchor="middle" fill="#314158">marketing_ops team</text>
      <rect x="60" y="200" width="200" height="34" rx="8" fill="#fff" stroke="#CAD5E2"/><text x="160" y="221" text-anchor="middle" fill="#314158">executive_director relation</text>
      <rect x="60" y="242" width="200" height="34" rx="8" fill="#fff" stroke="#CAD5E2"/><text x="160" y="263" text-anchor="middle" fill="#314158">committee membership</text>
      <rect x="278" y="116" width="150" height="34" rx="8" fill="#fff" stroke="#CAD5E2"/><text x="353" y="137" text-anchor="middle" fill="#314158">direct grants</text>
      <rect x="278" y="158" width="150" height="34" rx="8" fill="#fff" stroke="#CAD5E2"/><text x="353" y="179" text-anchor="middle" fill="#314158">object-tree inheritance</text>
      <text x="286" y="222" font-size="11" fill="#90A1B9">meeting → committee → project,</text>
      <text x="286" y="237" font-size="11" fill="#90A1B9">parent project → sub-project</text>
    </g>

    <!-- funnel arrow -->
    <line x1="446" y1="200" x2="560" y2="200" stroke="#0061A3" stroke-width="2.5" marker-end="url(#arrB)"/>
    <text x="503" y="175" text-anchor="middle" font-size="11" fill="#0061A3" font-weight="600">evaluated by</text>
    <text x="503" y="189" text-anchor="middle" font-size="11" fill="#0061A3" font-weight="600">the model</text>

    <!-- Permissions chips -->
    <text x="586" y="104" font-size="12" font-weight="700" fill="#45556C" letter-spacing=".04em">PERMISSIONS  ·  evaluated relationships the app checks</text>
    <g font-size="13" font-weight="600">
      <rect x="586" y="118" width="110" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="641" y="141" text-anchor="middle" fill="#0061A3">viewer</text>
      <rect x="706" y="118" width="110" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="761" y="141" text-anchor="middle" fill="#0061A3">auditor</text>
      <rect x="826" y="118" width="110" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="881" y="141" text-anchor="middle" fill="#0061A3">writer</text>
      <rect x="946" y="118" width="196" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="1044" y="141" text-anchor="middle" fill="#0061A3">committee.writer</text>
      <rect x="586" y="164" width="230" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="701" y="187" text-anchor="middle" fill="#0061A3">meeting_coordinator</text>
      <rect x="826" y="164" width="200" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="926" y="187" text-anchor="middle" fill="#0061A3">marketing_auditor</text>
      <rect x="586" y="210" width="220" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="696" y="233" text-anchor="middle" fill="#0061A3">campaign_manager</text>
      <rect x="826" y="210" width="180" height="36" rx="18" fill="#ECF4FF" stroke="#85C2FF"/><text x="916" y="233" text-anchor="middle" fill="#0061A3">owner (own item)</text>
    </g>
    <text x="586" y="278" font-size="11.5" fill="#62748E">Grants today:  LF Staff Team → auditor at project root (cascades down the project tree)</text>
    <text x="586" y="296" font-size="11.5" fill="#62748E">executive_director → marketing_auditor + campaign_manager   ·   committee member → viewer</text>

    <!-- ============ ACCESS CHECK BAR ============ -->
    <line x1="600" y1="316" x2="600" y2="352" stroke="#0061A3" stroke-width="2.5" marker-end="url(#arrB)"/>
    <rect x="150" y="356" width="900" height="58" rx="12" fill="#00426F"/>
    <text x="600" y="381" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">check( user U,  action A,  object O )</text>
    <text x="600" y="402" text-anchor="middle" font-size="12" fill="#B8D9FF">the only question app code ever asks — enforced by guards at the API gateway (Heimdall RuleSets); UI mirrors for degradation only</text>

    <!-- arrows to gates -->
    <line x1="240" y1="414" x2="180" y2="458" stroke="#62748E" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="480" y1="414" x2="460" y2="458" stroke="#62748E" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="720" y1="414" x2="740" y2="458" stroke="#62748E" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="960" y1="414" x2="1020" y2="458" stroke="#62748E" stroke-width="2" marker-end="url(#arr)"/>

    <!-- ============ BAND 2: PRODUCT GATES ============ -->
    <g>
      <!-- Discovery -->
      <rect x="30" y="462" width="270" height="188" rx="12" fill="#FFFFFF" stroke="#CAD5E2"/>
      <rect x="30" y="462" width="270" height="42" rx="12" fill="#F1F5F9"/>
      <rect x="30" y="492" width="270" height="12" fill="#F1F5F9"/>
      <text x="165" y="489" text-anchor="middle" font-size="13.5" font-weight="700" fill="#314158">DISCOVERY / BROWSE</text>
      <text x="165" y="530" text-anchor="middle" font-size="12.5" fill="#45556C">needs</text>
      <rect x="105" y="540" width="120" height="30" rx="15" fill="#ECF4FF" stroke="#85C2FF"/><text x="165" y="560" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0061A3">viewer</text>
      <text x="165" y="594" text-anchor="middle" font-size="11.5" fill="#62748E">find · join · register · request ·</text>
      <text x="165" y="610" text-anchor="middle" font-size="11.5" fill="#62748E">open for stewardship</text>
      <text x="165" y="634" text-anchor="middle" font-size="11" fill="#90A1B9">never adds selector access</text>

      <!-- Context entry -->
      <rect x="316" y="462" width="270" height="188" rx="12" fill="#FFFFFF" stroke="#CAD5E2"/>
      <rect x="316" y="462" width="270" height="42" rx="12" fill="#F1F5F9"/>
      <rect x="316" y="492" width="270" height="12" fill="#F1F5F9"/>
      <text x="451" y="489" text-anchor="middle" font-size="13.5" font-weight="700" fill="#314158">CONTEXT ENTRY &amp; SELECTOR</text>
      <text x="451" y="530" text-anchor="middle" font-size="12.5" fill="#45556C">needs</text>
      <rect x="356" y="540" width="190" height="30" rx="15" fill="#ECF4FF" stroke="#85C2FF"/><text x="451" y="560" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0061A3">auditor / explicit role</text>
      <text x="451" y="594" text-anchor="middle" font-size="11.5" fill="#62748E">Foundation &amp; Project lenses ·</text>
      <text x="451" y="610" text-anchor="middle" font-size="11.5" fill="#62748E">defaulting by grant tier, stable tie-break</text>
      <text x="451" y="634" text-anchor="middle" font-size="11" fill="#90A1B9">no grant → stay in Me (fully usable)</text>

      <!-- Pages -->
      <rect x="602" y="462" width="270" height="188" rx="12" fill="#FFFFFF" stroke="#CAD5E2"/>
      <rect x="602" y="462" width="270" height="42" rx="12" fill="#F1F5F9"/>
      <rect x="602" y="492" width="270" height="12" fill="#F1F5F9"/>
      <text x="737" y="489" text-anchor="middle" font-size="13.5" font-weight="700" fill="#314158">CAPABILITY-GATED PAGES</text>
      <text x="737" y="530" text-anchor="middle" font-size="12.5" fill="#45556C">needs</text>
      <rect x="622" y="540" width="110" height="30" rx="15" fill="#ECF4FF" stroke="#85C2FF"/><text x="677" y="560" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0061A3">campaign_mgr</text>
      <rect x="740" y="540" width="112" height="30" rx="15" fill="#ECF4FF" stroke="#85C2FF"/><text x="796" y="560" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0061A3">mktg_auditor</text>
      <text x="737" y="594" text-anchor="middle" font-size="11.5" fill="#62748E">Campaigns · Marketing Impact</text>
      <text x="737" y="610" text-anchor="middle" font-size="11.5" fill="#62748E">named permission per page</text>
      <text x="737" y="634" text-anchor="middle" font-size="11" fill="#90A1B9">no persona guards, no ED reference</text>

      <!-- Actions -->
      <rect x="888" y="462" width="282" height="188" rx="12" fill="#FFFFFF" stroke="#CAD5E2"/>
      <rect x="888" y="462" width="282" height="42" rx="12" fill="#F1F5F9"/>
      <rect x="888" y="492" width="282" height="12" fill="#F1F5F9"/>
      <text x="1029" y="489" text-anchor="middle" font-size="13.5" font-weight="700" fill="#314158">CREATE / MANAGE ACTIONS</text>
      <text x="1029" y="530" text-anchor="middle" font-size="12.5" fill="#45556C">needs</text>
      <rect x="908" y="540" width="242" height="30" rx="15" fill="#ECF4FF" stroke="#85C2FF"/><text x="1029" y="560" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0061A3">the action's own permission on its object</text>
      <text x="1029" y="594" text-anchor="middle" font-size="11.5" fill="#62748E">meeting → organizer · project → writer ·</text>
      <text x="1029" y="610" text-anchor="middle" font-size="11.5" fill="#62748E">committee → writer · response → owner</text>
      <text x="1029" y="634" text-anchor="middle" font-size="11" fill="#90A1B9">one check — the model does the traversal</text>
    </g>

    <!-- product domain label -->
    <text x="30" y="686" font-size="12" font-weight="700" fill="#45556C" letter-spacing=".04em">GUARDS  ·  each binds an action or surface to the permission it requires on the resolved target object</text>

    <!-- ============ BAND 3: PERSONAS ============ -->
    <rect x="20" y="706" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="44" y="738" font-size="15" font-weight="700" fill="#314158">PERSONAS — DETECTED SIGNALS</text>
    <text x="44" y="758" font-size="12.5" fill="#62748E">Criteria outside the model, inferred from connected data (board groups, CDP activity, Insights) — never authorization</text>
    <g font-size="12.5">
      <rect x="44" y="774" width="150" height="34" rx="17" fill="#fff" stroke="#CAD5E2"/><text x="119" y="795" text-anchor="middle" fill="#45556C">Board Member</text>
      <rect x="204" y="774" width="130" height="34" rx="17" fill="#fff" stroke="#CAD5E2"/><text x="269" y="795" text-anchor="middle" fill="#45556C">Contributor</text>
      <rect x="344" y="774" width="130" height="34" rx="17" fill="#fff" stroke="#CAD5E2"/><text x="409" y="795" text-anchor="middle" fill="#45556C">Maintainer</text>
      <rect x="484" y="774" width="130" height="34" rx="17" fill="#fff" stroke="#CAD5E2"/><text x="549" y="795" text-anchor="middle" fill="#45556C">ED (persona)</text>
    </g>

    <!-- persona -> presentation -->
    <line x1="626" y1="791" x2="716" y2="791" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
    <text x="671" y="779" text-anchor="middle" font-size="11.5" fill="#10B981" font-weight="700">shapes</text>
    <rect x="722" y="766" width="260" height="52" rx="10" fill="#ECFDF5" stroke="#10B981"/>
    <text x="852" y="788" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">PRESENTATION ONLY</text>
    <text x="852" y="806" text-anchor="middle" font-size="11.5" fill="#065F46">dashboards · layout · copy · ordering</text>

    <!-- persona blocked from gates -->
    <line x1="1010" y1="791" x2="1100" y2="791" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="1116" cy="791" r="15" fill="#fff" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="1106" y1="801" x2="1126" y2="781" stroke="#DC2626" stroke-width="2.5"/>
    <text x="1113" y="836" text-anchor="middle" font-size="11.5" font-weight="700" fill="#DC2626">never gates access</text>

    <!-- footer -->
    <text x="600" y="898" text-anchor="middle" font-size="12.5" fill="#62748E">Grants and the model are the platform team's domain — resolved per review: executive_director stays, feeding marketing_auditor and campaign_manager.</text>
    <text x="600" y="916" text-anchor="middle" font-size="12.5" fill="#62748E">App code is unaffected by any future grant or model change, because it only ever checks permissions.</text>
  </svg>